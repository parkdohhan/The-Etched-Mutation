<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TEM — 방과 통로</title>
  <!--
    글 방 + 3D 통로 무대 (2026-11-17). 결정 기록: docs/글방_통로_무대_결정-261117.md
    방 = 검은 화면의 글과 소리 / 방 사이 = 직접 걷는 3D 통로 / 끝 = 위상 지도 → 눕힘 → 걸음으로 구운 지형.
    주소: ?memory=<기억 id 또는 코드> (기본 DANG-001 — 임시 제목 "당신입니까". 권역은 ?memory=GWON-001) · ?as=author (작가 첫 걸음) · ?as=test (시험, 남지 않음) · ?tune=1 (통로 조정판)
    기존 플레이 화면(play-test.html)은 건드리지 않는다. 되돌리기 = 이 파일 + css/room-play.css + js/roomplay/ 삭제.
    ※ tem_variant_strata.js 는 일부러 불러오지 않는다 — 이 화면의 지형은 걸음 장부에서 굽는다(TemReplayTerrain 자리 사용).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/room-play.css?v=261120c" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><!-- 261120 길 옆 사물 모형 -->
  <script>try { var _t = new URLSearchParams(location.search).get('touch'); if (_t === '1') window.__temForceTouch = true; } catch (_) {}</script>
  <script src="js/shared/tem_af_strata_terrain.js?v=260809a"></script>
  <script src="js/ui/tem_mobile_controls.js?v=260806"></script>
  <script type="module" src="js/safety.js"></script>
  <script src="js/shared/tem_stem_cuts.js?v=261117a"></script>
</head>
<body>
  <canvas id="rpCorridor" class="rp-canvas"></canvas>
  <canvas id="rpWay" class="rp-canvas"></canvas><!-- 261120 길 (?way=1): 글 화면에서 문까지 -->
  <canvas id="rpPiece" class="rp-canvas"></canvas>
  <canvas id="strataCanvas" class="rp-canvas"></canvas>

  <div id="rpRoom">
    <div id="rpFloat"></div>
    <main class="rp-column">
      <div class="rp-body" aria-live="polite"></div>
      <div class="rp-input"></div>
    </main>
  </div>
  <button id="rpLeave" type="button">나가기</button>

  <div id="rpCaption"><div class="rp-cap-line" id="rpCapLine"></div><div class="rp-cap-src" id="rpCapSrc"></div></div>
  <div id="rpHint"></div>
  <button id="rpWalk" type="button">걷기</button>
  <div id="rpTune"></div>

  <div id="rpEndText"><div class="rp-end-line" id="rpEndLine"></div><div class="rp-end-sub" id="rpEndSub"></div></div>
  <div id="rpTrace"><div class="rp-trace-word" id="rpTraceWord"></div><div class="rp-trace-line" id="rpTraceLine"></div><div class="rp-trace-src" id="rpTraceSrc"></div></div>
  <div id="rpEndBtns"></div>

  <div id="rpEntry">
    <div class="rp-title" id="rpEntryTitle"></div>
    <div class="rp-lead" id="rpEntryLead">불러오는 중…</div>
    <input id="rpEntryInput" type="text" maxlength="200" autocomplete="off" spellcheck="false" aria-label="들어가기 전 한마디" />
    <button class="rp-btn" id="rpEnter" type="button" disabled>들어간다</button>
    <div class="rp-note" id="rpEntryNote"></div>
  </div>

  <div id="rpVeil"></div>
  <div id="rpToast"></div>

  <script type="module" src="js/roomplay/main.js?v=261120f"></script>
</body>
</html>
