<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>메모리 자연 윤곽 — auto-mask 테스트</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #c8c8d0; font-family: 'Gowun Batang', serif; overflow: hidden; }
    #ui {
      position: fixed; top: 12px; left: 12px;
      padding: 14px 16px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(196,168,130,0.32);
      z-index: 10; min-width: 280px;
    }
    #ui h1 { font-size: 0.9rem; letter-spacing: 0.08em; color: #c4a882; margin: 0 0 10px 0; font-weight: normal; }
    #ui select, #ui input[type=number] {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(196,168,130,0.3);
      color: #e8d8fc;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    #ui select { width: 100%; margin-bottom: 8px; }
    #ui input[type=range] { width: 100%; }
    #ui label { font-size: 0.78rem; color: #8aa3a3; display: block; margin-top: 6px; }
    #ui .row { display: flex; gap: 8px; align-items: center; }
    #ui button {
      background: rgba(196,168,130,0.18);
      border: 1px solid #c4a882;
      color: #e8d8fc;
      padding: 8px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      margin-top: 10px;
      width: 100%;
    }
    #ui button:hover { background: rgba(196,168,130,0.32); }
    #status {
      position: fixed; bottom: 12px; left: 12px;
      font-size: 0.78rem; color: #c4a882;
      background: rgba(0,0,0,0.65);
      padding: 8px 14px;
      max-width: 600px;
      font-family: monospace;
    }
    canvas { display: block; }
    .hint { font-size: 0.72rem; color: rgba(168,140,196,0.7); line-height: 1.5; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>지형 자연 윤곽 — 메모리 단위 auto-mask</h1>
    <select id="memSel"></select>
    <label>maxH 비례 임계 (0~0.5)
      <div class="row">
        <input id="thresh" type="range" min="0" max="0.5" step="0.01" value="0.12">
        <input id="threshVal" type="number" value="0.12" step="0.01" min="0" max="0.5" style="width:60px;">
      </div>
    </label>
    <label>절대 floor (0~3)
      <div class="row">
        <input id="floorVal" type="range" min="0" max="3" step="0.05" value="0.5">
        <input id="floorValN" type="number" value="0.5" step="0.05" min="0" style="width:60px;">
      </div>
    </label>
    <label>vertex y 강조 (0.3~1.5)
      <div class="row">
        <input id="vScale" type="range" min="0.3" max="1.5" step="0.05" value="0.6">
        <input id="vScaleN" type="number" value="0.6" step="0.05" style="width:60px;">
      </div>
    </label>
    <label>바닥 y 절대값 (-5~10) — 전체 지형 위로 올림
      <div class="row">
        <input id="floorY" type="range" min="-5" max="10" step="0.1" value="0">
        <input id="floorYN" type="number" value="0" step="0.1" style="width:60px;">
      </div>
    </label>
    <button id="rebuildBtn">메시 재생성</button>
    <div class="hint">
      • 마우스 드래그 — 회전 / 휠 — 줌 / 우클릭 — 이동<br>
      • 외곽 = 원형 mask (R=56). 사각형 박스 자동 사라짐<br>
      • 임계 미만 셀 → 얕은 회색 바닥 (걸어다닐 수 있음)<br>
      • 임계 이상 셀 → 봉우리 (자연 섬 형태)<br>
      • 바닥 y 슬라이더 — 전체 지형 위/아래 평행이동
    </div>
  </div>
  <div id="status">대기 중</div>

  <!-- Three.js r128 + OrbitControls (play-test.html 와 동일 버전) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Supabase JS v2 (play-test.html 와 동일) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 지형 모듈 (window.TemAfStrataTerrain 노출) -->
  <script src="../js/shared/tem_af_strata_terrain.js"></script>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from '../js/lib/config.js';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');
    function setStatus(s) { statusEl.textContent = s; }

    // ─── three.js setup ───
    const W = window.innerWidth, H = window.innerHeight;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.006);

    const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 500);
    camera.position.set(0, 70, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // 라이트
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const hemi = new THREE.HemisphereLight(0xffffff, 0x1a1825, 0.55);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(50, 80, 30);
    scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0x6688aa, 0.35);
    dir2.position.set(-40, 30, -30);
    scene.add(dir2);

    let mesh = null;
    function disposeMesh() {
      if (!mesh) return;
      scene.remove(mesh);
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
      mesh = null;
    }

    // ─── 메모리 캐시 + 빌드 ───
    let CACHE = null;

    function buildMesh(memId) {
      if (!CACHE) return;
      disposeMesh();

      const T = window.TemAfStrataTerrain;
      const items = T.buildMemoryItems(CACHE.mems, CACHE.playsByMem, CACHE.scenesByMem);
      const idx = items.findIndex(m => m.id === memId);
      if (idx < 0) { setStatus('메모리 못 찾음: ' + memId); return; }

      const G = 160, SZ = 112;
      const field = T.computeAfTerrainFields(items, idx, { G, SZ });
      const { hts, cls, minH, maxH } = field;

      const vScale = parseFloat(document.getElementById('vScale').value) || 0.6;
      const floorY = parseFloat(document.getElementById('floorY').value) || 0;

      // 임계
      const threshold = parseFloat(document.getElementById('thresh').value) || 0.12;
      const floorAbs  = parseFloat(document.getElementById('floorVal').value) || 0.5;
      const hThresh   = Math.max(floorAbs, Math.max(0, maxH) * threshold);

      const geo = new THREE.PlaneGeometry(SZ, SZ, G - 1, G - 1);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position.array;
      const colA = new Float32Array(pos.length);
      const rg = (maxH - minH) || 1;

      // 임계 미만 → 얕은 floor (회색), 임계 이상 → 봉우리 (원래 height + 색)
      // 모든 face 유지 (auto-mask 제거) — 봉우리 사이 평지 형태로 걸어다닐 수 있음
      let peakCount = 0, floorCount = 0;
      for (let j = 0; j < G * G; j++) {
        if (hts[j] < hThresh) {
          // 평평한 회색 바닥 — floorY 만 적용
          pos[j * 3 + 1] = floorY;
          colA[j * 3]     = 0.10;
          colA[j * 3 + 1] = 0.10;
          colA[j * 3 + 2] = 0.13;
          floorCount++;
        } else {
          // 봉우리 — 원래 height (양수 정규화) + 원래 색
          pos[j * 3 + 1] = ((hts[j] - minH) / rg) * 20 * vScale + floorY;
          colA[j * 3]     = Math.min(1, Math.max(0, cls[j * 3]));
          colA[j * 3 + 1] = Math.min(1, Math.max(0, cls[j * 3 + 1]));
          colA[j * 3 + 2] = Math.min(1, Math.max(0, cls[j * 3 + 2]));
          peakCount++;
        }
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
      geo.attributes.position.needsUpdate = true;

      // ── 원형 mask: 외곽 사각형 → 원형 (R = SZ/2 = 56) ──
      // vertex world 좌표 사전 계산
      const RAD = SZ / 2;
      const RAD2 = RAD * RAD;
      const oldIdx = geo.index ? geo.index.array : null;
      let kept = 0, total = 0;
      if (oldIdx) {
        const newIdx = [];
        total = oldIdx.length / 3;
        for (let f = 0; f < oldIdx.length; f += 3) {
          const a = oldIdx[f], b = oldIdx[f + 1], c = oldIdx[f + 2];
          // 셀 중심 = 세 vertex 평균. 거리² <= RAD² 이면 face 유지
          const cx = (pos[a*3] + pos[b*3] + pos[c*3]) / 3;
          const cz = (pos[a*3+2] + pos[b*3+2] + pos[c*3+2]) / 3;
          if ((cx*cx + cz*cz) <= RAD2) {
            newIdx.push(a, b, c);
            kept++;
          }
        }
        if (newIdx.length) geo.setIndex(newIdx);
      }

      geo.computeVertexNormals();

      const mat = new THREE.MeshLambertMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        flatShading: false,
      });
      mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);

      const m = items[idx];
      const title = (m.t || m.id).slice(0, 40);
      const pct = total ? (kept * 100 / total).toFixed(1) : '0';
      const peakPct = (G*G > 0) ? (peakCount * 100 / (G*G)).toFixed(1) : '0';
      setStatus(
        `${title} · scenes ${(CACHE.scenesByMem[m.id] || []).length} · ` +
        `plays ${(CACHE.playsByMem[m.id] || []).length} · ` +
        `H[${minH.toFixed(2)}, ${maxH.toFixed(2)}] · ` +
        `임계 ${hThresh.toFixed(2)} · ` +
        `peak ${peakCount}(${peakPct}%) / floor ${floorCount} · ` +
        `원형 face ${kept}/${total} (${pct}%)`
      );
    }

    // ─── 메모리 로드 ───
    async function loadMemories() {
      setStatus('메모리 로드 중...');
      const { data: mems, error: mErr } = await sb
        .from('memories').select('*').order('created_at', { ascending: false });
      if (mErr) { setStatus('메모리 로드 실패: ' + mErr.message); return; }
      const memIds = mems.map(m => m.id);
      const [{ data: scenes }, { data: plays }] = await Promise.all([
        sb.from('scenes').select('*').in('memory_id', memIds),
        sb.from('plays').select('*').in('memory_id', memIds),
      ]);
      const scenesByMem = {}, playsByMem = {};
      mems.forEach(m => { scenesByMem[m.id] = []; playsByMem[m.id] = []; });
      (scenes || []).forEach(s => { (scenesByMem[s.memory_id] || []).push(s); });
      (plays  || []).forEach(p => { (playsByMem[p.memory_id]  || []).push(p); });
      CACHE = { mems, scenesByMem, playsByMem };

      const sel = document.getElementById('memSel');
      sel.innerHTML = '';
      mems.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        const label = (m.title || m.completed_sentence || m.id).slice(0, 50);
        opt.textContent = `${label} (s${(scenesByMem[m.id] || []).length}/p${(playsByMem[m.id] || []).length})`;
        sel.appendChild(opt);
      });
      setStatus(`${mems.length}개 메모리 로드. 첫 메모리 자동 빌드.`);
      if (mems.length) buildMesh(mems[0].id);
    }

    // ─── 슬라이더 sync ───
    function syncSliders() {
      const pairs = [
        ['thresh', 'threshVal'],
        ['floorVal', 'floorValN'],
        ['vScale', 'vScaleN'],
        ['floorY', 'floorYN'],
      ];
      pairs.forEach(([rId, nId]) => {
        const range = document.getElementById(rId);
        const num = document.getElementById(nId);
        range.addEventListener('input', () => { num.value = range.value; });
        num.addEventListener('input',   () => { range.value = num.value; });
      });
    }
    syncSliders();

    document.getElementById('rebuildBtn').onclick = () => {
      const sel = document.getElementById('memSel');
      if (CACHE && sel.value) buildMesh(sel.value);
    };
    document.getElementById('memSel').onchange = () => {
      if (CACHE) buildMesh(document.getElementById('memSel').value);
    };

    // ─── render loop ───
    function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });

    loadMemories();
  </script>
</body>
</html>
