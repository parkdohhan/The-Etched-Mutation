  TEM 실험 페이지 — 통로 T1: 회랑에 전이의 모양·길이·폭·결을 준다 (2026-09-23)
  목적: 현행 무대에서 씬을 마치고 지도로 돌아오면 안개 모듈이 "현재 위치 → 새로 열린 핀"으로
        안개를 *직선*으로 깎아 회랑을 낸다(반폭 5, 도착 시 3초 개화). 늘 같은 결이다.
        이 페이지는 그 회랑이 전이 패턴·출발/도착 장면의 감정 델타·정렬도·오염 3축에 따라
        달라지면 관객 눈에 갈리는지를 보는 실험이다.
  근거: docs/공간안개_B안_구현-260709.md (안개=벽, 연출 규칙), docs/씬은_사건이다_결정-260727.md
        (패턴 = 중심 이동, contradiction = 지도 반사), docs/귀환_시스템_정합성_재정의-260613.md (전이 v2),
        docs/생성형_지형모델_v2-260619.md §9 (7-02 "라벨 6개만 쓰면 궤적이 뭉개진다").
  선례: test/life-t2-test.html (조절판·훅·전환 결) · test/fog-reveal-test.html (지형+안개 단독 구동)
        · test/ghost-mannequin-test.html (유령 재질 — 여기서는 fog-reveal 의 스프라이트 유령을 씀).
  본 코드(js/**, play-test.html) 미반영. 저장 0 · 서버 0 · 엔진 0 (패턴·정렬도·오염은 사람이 고른다).

  모듈 사용 방식 (모듈 수정 0):
    js/ui/lumen_spatial_fog.js 는 지형 파일이 만드는 전역 uniform(window.__temSpatialFogUniforms)과
    runtime{getScene,getRenderer,getCamera} 를 요구한다. 이 페이지는 그 uniform 객체를 같은 모양으로
    직접 만들고, fog-reveal-test 의 인라인 지형에 본 지형(tem_af_strata_terrain.js _sfPatchShader)의
    "안개=벽" 규칙을 옮겨 붙인 셰이더로 그것을 읽는다. 회랑 목록·애니메이션은 모듈이 그대로 관리한다.
    곡선·꺾인 회랑 = 꺾은 선의 마디마다 carve() 를 여러 번 부른 것. 마디별 폭 = carve 직전 setOptions.
    이동 벽 = window.__temSpatialFogConstrain (attach 반환값이 아니라 전역에 걸린다).
    페이지 전용 uniform(_t1*) = 결(가장자리 일렁임 진폭·주파수·벽 결·이질 얼룩·벽 얇아짐).
    → 본 무대로 옮기려면 지형 셰이더에 같은 uniform 이 필요하다 ("본 코드 수정 필요").

  260923 검토 반영 (docs/통로_T1_스크린샷/ 재촬영):
    · 마디 간격 700 → 1400ms (관절에 원이 "툭" 열리던 튕김 제거)  · 출발 걷힘 반경 9 → 6
    · displacement 에 목 마디(A→A2, 반폭 w×0.55) — 1인칭에서 실제로 들어간다 (걷기 실측은 캡처 스크립트)
    · contradiction 되돌림 바닥 seedR+w+1 — 갈고리가 원 밖으로 나온다  · echo_follow 마디 ≥6, 봉우리 0.5±0.1
    · avoidance 띠가 델타 반대쪽으로 비켜 난다(A→K→B) + 얇아짐 0.55 바닥 + 반폭 w×1.2
    · 도착 유령·고리 바닥 불투명도 제거(걷힘에만 비례, avoidance 는 thinAmt 비례)
    · 가장자리 일렁임 ≤ 반폭 절반, 시간항은 거칠수록 느리게
    · 길이 규칙의 실제 유효 범위는 corridor-t1-rules.js 머리 주석 §길이 에 정직히 적음

  기하 규칙 = test/corridor-t1-rules.js 파일 머리 주석 (결정론, 난수 없음).
  연결사 8종 = js/ui/lumen_dialog_phase1.js 의 CONT_CONNECTIVES 를 페이지 로드 시 그 파일에서 읽어 옴.
  패턴 이름은 관객 화면(무대·힌트·자막)에 나오지 않는다. 조절판·상태줄에만.

  playwright 훅: window.__t1 = { ready, setPattern(p), setPair(fromIdx,toIdx), setAlignment(a), setBucket(b),
                                  setCont(d,c,h), setConnective(i), setView('top'|'fp'), recarve(), settled(),
                                  state(), setPanel(bool), setGuide(bool), caption(), fp:{setPos(x,z), setYaw(rad), move(x,z)} }
    setX 는 값만 바꾼다 — recarve() 를 불러야 회랑이 다시 파인다 (조절판은 자동으로 다시 판다).
-->

<script type="module">
import { AXES, AXIS_KO, SCENES, PATTERNS, PATTERN_KO, BUCKETS, buildPath } from './corridor-t1-rules.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
if (!window.THREE || !window.LumenSpatialFog) {
  $('hint').textContent = 'three.js 또는 안개 모듈을 불러오지 못했습니다.';
  throw new Error('THREE or LumenSpatialFog missing');
}

// ─── 잠금값 (출처는 파일 머리 주석 / fog-reveal-test / 안개 모듈 DEFAULTS) ─
const SZ = 190, G = 160;             // 지형 크기·격자 (fog-reveal: 120/128 — 반대편 뚫림 + 조감 여유로 키움)
const GRID_MARGIN = 56;              // 회랑 점의 클램프 경계 (contradiction 반대편)
const CLEAR_COLOR = 0x12121a;
const FOG_CLEAR_DENSITY = 0.006;     // tem_af_strata_terrain 기본
const SF_MAX = 24;                   // 지형 파일 _SF_MAX 와 동일
const WALL = 0.985;                  // 모듈 DEFAULTS.wallStrength
const SKY = 0x555f6e;                // 안개 벽 색 (지형 파일 uSky)
// 마디 간격 — 앞 마디 끝이 관절에 거의 닿은 뒤(진행률 ≈0.97) 다음 마디가 시작한다.
// 260923 검토: 700ms 였을 때 앞 마디가 38% 만 파인 시점에 관절 자리에 반폭 원이 "툭" 열렸다(튕김).
const STAGGER_MS = 1400;
const CORRIDOR_MS = 1600, REGION_MS = 3000;   // 모듈 DEFAULTS
// 출발 자리 걷힘 반경 (무대 입장 14 보다 작게). 260923: 9 → 6 — 9 는 1인칭 75° 시야를 통째로 걷어
// 입구 좌우 벽이 화면에 안 들어왔고, contradiction 갈고리를 원이 삼켰다.
const SEED_R = 6;
const BLOOM_R = 14;                  // 도착 개화 반경
const TRANS_S = 2.5;                 // 결 uniform 전환 (지수 접근, 느리고 넓고 무겁게)
const PIN_A = { x: -24, z: 16 }, PIN_B = { x: 26, z: -14 };
const EYE = 1.7, WALK = 9;           // 1인칭 눈높이·걸음 속도(단위/초)

// 17축 → 지형 물감 (fog-reveal EC 를 17축으로 늘림)
const EC = {
  fear: [0.48, 0.35, 0.85], sadness: [0.35, 0.50, 0.85], anger: [0.85, 0.35, 0.35], guilt: [0.60, 0.40, 0.30],
  shame: [0.70, 0.30, 0.50], isolation: [0.40, 0.45, 0.60], numbness: [0.50, 0.50, 0.55], moral_pain: [0.60, 0.25, 0.35],
  helplessness: [0.35, 0.40, 0.50], despair: [0.25, 0.25, 0.40], joy: [0.91, 0.77, 0.42], hope: [0.70, 0.85, 0.50],
  relief: [0.35, 0.85, 0.72], gratitude: [0.85, 0.70, 0.55], love: [0.90, 0.50, 0.60], peace: [0.50, 0.80, 0.80], comfort: [0.80, 0.75, 0.60],
};
function domAxis(vec) { let b = -1, k = AXES[0]; for (const a of AXES) { const v = vec[a] || 0; if (v > b) { b = v; k = a; } } return k; }

// ─── 상태 ───────────────────────────────────────────────────────
const S = { pattern: 'echo_follow', from: 0, to: 2, alignment: 0.7, bucket: 'MID', cont: { d: 0, c: 0, h: 0 }, connective: 0, view: 'top', guide: false };
let CONNECTIVES = null;     // 대화 모듈에서 읽은 8종
let connSource = '';
let path = null;            // buildPath 결과
let carveTimers = [];
let doneAt = 0;
let carveId = 0;

// ─── 결정론 노이즈 (fog-reveal 과 동일) ───────────────────────────
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;

function applyFpCam() {
  fpCam.position.set(fp.x, heightAt(fp.x, fp.z) + EYE, fp.z);
  const cp = Math.cos(fp.pitch);
  fpCam.lookAt(fp.x + Math.sin(fp.yaw) * cp, fpCam.position.y + Math.sin(fp.pitch), fp.z + Math.cos(fp.yaw) * cp);
}

// ─── 조절판 배선 ──────────────────────────────────────────────────
const patEl = $('patterns');
for (const p of PATTERNS) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (p === S.pattern ? ' on' : ''); b.dataset.pattern = p;
  b.innerHTML = PATTERN_KO[p] + '<small>' + p + '</small>'; patEl.appendChild(b);
}
patEl.addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { setPattern(b.dataset.pattern); recarve(); } });
function setPattern(p) {
  if (!PATTERNS.includes(p)) return;
  S.pattern = p;
  document.querySelectorAll('#patterns .chip').forEach((c) => c.classList.toggle('on', c.dataset.pattern === p));
}
for (const id of ['fromSel', 'toSel']) {
  const sel = $(id);
  SCENES.forEach((sc, i) => { const o = document.createElement('option'); o.value = i; o.textContent = sc.name + ' · ' + AXIS_KO[domAxis(sc.vec)]; sel.appendChild(o); });
  sel.addEventListener('change', () => { setPair(+$('fromSel').value, +$('toSel').value); recarve(); });
}
function setPair(fi, ti) {
  if (SCENES[fi]) S.from = fi; if (SCENES[ti]) S.to = ti;
  $('fromSel').value = S.from; $('toSel').value = S.to;
  $('hintFrom').textContent = SCENES[S.from].name; $('hintTo').textContent = SCENES[S.to].name;
  paintTerrain(); placeGhostB();
  const info = buildPath({ A: PIN_A, B: PIN_B, pattern: 'echo_follow', from: SCENES[S.from].vec, to: SCENES[S.to].vec, alignment: S.alignment }).info;
  $('deltaNote').textContent = '감정 델타: 지배 축 ' + AXIS_KO[info.dom] + '(' + info.dom + ') ' + (info.side > 0 ? '늘어남 → 왼쪽으로 휨' : '줄어듦 → 오른쪽으로 휨')
    + ' · 크기 ' + info.m + ' (mN ' + info.mN + ') · 둘째 축 ' + (info.sec ? AXIS_KO[info.sec] : '—') + ' r2 ' + info.r2;
}
function bindRange(id, apply, fmt) {
  const el = $(id), v = $(id + 'V');
  const upd = (fromUi) => { apply(parseFloat(el.value)); v.textContent = fmt(parseFloat(el.value)); if (fromUi) recarve(); };
  el.addEventListener('input', () => upd(true)); upd(false);
}
bindRange('align', (x) => { S.alignment = x; }, (x) => x.toFixed(2));
bindRange('contD', (x) => { S.cont.d = x; }, (x) => x.toFixed(2));
bindRange('contC', (x) => { S.cont.c = x; }, (x) => x.toFixed(2));
bindRange('contH', (x) => { S.cont.h = x; }, (x) => x.toFixed(2));
function setAlignment(a) { S.alignment = Math.max(0, Math.min(1, a)); $('align').value = S.alignment; $('alignV').textContent = S.alignment.toFixed(2); }
function setCont(d, c, h) {
  if (d != null) { S.cont.d = Math.max(0, Math.min(1, d)); $('contD').value = S.cont.d; $('contDV').textContent = S.cont.d.toFixed(2); }
  if (c != null) { S.cont.c = Math.max(0, Math.min(1, c)); $('contC').value = S.cont.c; $('contCV').textContent = S.cont.c.toFixed(2); }
  if (h != null) { S.cont.h = Math.max(0, Math.min(1, h)); $('contH').value = S.cont.h; $('contHV').textContent = S.cont.h.toFixed(2); }
}
$('bucketSel').addEventListener('change', () => { setBucket($('bucketSel').value); recarve(); });
function setBucket(b) { if (BUCKETS.includes(b)) { S.bucket = b; $('bucketSel').value = b; } }
$('connSel').addEventListener('change', () => { setConnective(+$('connSel').value); });
function setConnective(i) { const list = CONNECTIVES || FALLBACK_CONN; if (list[i] != null) { S.connective = i; $('connSel').value = i; } }
function fillConnectives() {
  const sel = $('connSel'); sel.innerHTML = '';
  (CONNECTIVES || FALLBACK_CONN).forEach((c, i) => { const o = document.createElement('option'); o.value = i; o.textContent = c; sel.appendChild(o); });
  sel.value = S.connective;
  $('connNote').textContent = connSource;
}
$('views').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) setView(b.dataset.view); });
$('guideOn').addEventListener('change', () => { setGuide($('guideOn').checked); });
function setGuide(b) { S.guide = !!b; $('guideOn').checked = S.guide; updateGuide(); }
$('recarve').addEventListener('click', recarve);
$('reset').addEventListener('click', () => {
  setPattern('echo_follow'); setPair(0, 2); setAlignment(0.7); setBucket('MID'); setCont(0, 0, 0); setConnective(0); setGuide(false);
  setView('top'); recarve();
});
const panel = $('panel');
function setPanel(open) { panel.classList.toggle('closed', !open); document.body.classList.toggle('panel-closed', !open); }
$('toggle').addEventListener('click', () => setPanel(panel.classList.contains('closed')));
addEventListener('resize', () => {
  for (const c of [topCam, fpCam]) { c.aspect = innerWidth / innerHeight; c.updateProjectionMatrix(); }
  renderer.setSize(innerWidth, innerHeight);
});

// ─── 상태줄 ───────────────────────────────────────────────────────
function refreshStatus(force) {
  if (!path) return;
  const wl = path.halfWidths.length ? path.halfWidths.map((w) => w.toFixed(1)) : [];
  const wRange = wl.length ? (Math.min(...path.halfWidths).toFixed(1) + '~' + Math.max(...path.halfWidths).toFixed(1)) : '—';
  const settledTxt = settled() ? '정착' : '파이는 중';
  statusEl.textContent =
    '패턴 ' + S.pattern + ' · ' + settledTxt + '\n' +
    '마디 ' + path.segments + ' · 총 길이 ' + path.length.toFixed(1) + ' (직선 ' + path.direct.toFixed(1) + ', ×' + path.ratio.toFixed(2) + ', 목표 ×' + path.ratioTarget.toFixed(2) + ')\n' +
    '반폭 ' + path.halfWidth.toFixed(1) + ' (마디별 ' + wRange + ')' + (path.thin ? ' · 벽 얇아짐 ' + path.thin.amt.toFixed(2) : '') + '\n' +
    '지배축 ' + path.info.dom + ' side ' + path.info.side + ' mN ' + path.info.mN + ' r2 ' + path.info.r2 + ' · 결 edge ' + T1.edgeAmp.value.toFixed(2) + ' grain ' + T1.grain.value.toFixed(2);
}
function settled() {
  if (!window.__t1 || !window.__t1.ready || !path) return false;
  if (performance.now() < doneAt) return false;
  for (const k of Object.keys(T1_TARGET)) if (Math.abs(T1[k].value - T1_TARGET[k]) > 0.01) return false;
  return true;
}

// ─── 프레임 ───────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frameCount = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  // 결 uniform — 느리고 넓고 무겁게 (TRANS_S 초에 약 95% 도달)
  const k = 1 - Math.exp(-dt / (TRANS_S / 3));
  for (const key of Object.keys(T1_TARGET)) T1[key].value += (T1_TARGET[key] - T1[key].value) * k;

  if (S.view === 'fp') { stepFp(dt); applyFpCam(); } else controls.update();

  // 도착 유령·고리 = 걷힘(모듈 revealAt)에만 비례 — 바닥값 없음 (260923: 0.12 바닥이 안개 벽 너머로 새어
  // 안개 원칙 #5 위반). avoidance 만 예외: 띠가 얇아진 만큼(thinAmt×0.55) "벽 너머로 비치는" 정도로.
  const rvB = fog.revealAt(PIN_B.x, PIN_B.z);
  const seeB = Math.max(rvB, T1.thinAmt.value * 0.55);
  ghostB.material.opacity = seeB * (0.8 + 0.1 * Math.sin(clock.elapsedTime * 1.2));
  ringB.material.opacity = seeB * 0.55;

  renderer.render(scene, activeCam);   // 모듈이 render wrap 으로 uniform 을 흘려보낸다
  if (++frameCount % 12 === 0) refreshStatus(false);
}

// ─── 연결사 8종 — 대화 모듈 소스에서 그대로 읽는다 ─────────────────
async function loadConnectives() {
  try {
    const txt = await (await fetch('../js/ui/lumen_dialog_phase1.js', { cache: 'no-store' })).text();
    const m = txt.match(/CONT_CONNECTIVES\s*=\s*\[([^\]]*)\]/);
    if (m) {
      const list = Array.from(m[1].matchAll(/'([^']*)'/g)).map((x) => x[1]);
      if (list.length) { CONNECTIVES = list; connSource = 'js/ui/lumen_dialog_phase1.js CONT_CONNECTIVES ' + list.length + '종 (읽어 옴)'; }
    }
  } catch (e) { console.warn('[t1] 연결사 읽기 실패 — 사본 사용', e); }
  if (!CONNECTIVES) { CONNECTIVES = FALLBACK_CONN.slice(); connSource = '읽기 실패 — 페이지 사본 8종'; }
  fillConnectives();
}

// ─── 시작 ─────────────────────────────────────────────────────────
window.__t1 = {
  ready: false,
  setPattern, setPair, setAlignment, setBucket, setCont, setConnective, setView, recarve, settled, setPanel, setGuide,
  state() {
    return path ? {
      pattern: S.pattern, from: SCENES[S.from].id, to: SCENES[S.to].id, alignment: S.alignment, bucket: S.bucket,
      cont: { ...S.cont }, connective: currentConnective(), view: S.view,
      segments: path.segments, nodes: path.nodes, length: +path.length.toFixed(2), direct: +path.direct.toFixed(2),
      ratio: +path.ratio.toFixed(3), ratioTarget: +path.ratioTarget.toFixed(3), halfWidth: +path.halfWidth.toFixed(2),
      halfWidths: path.halfWidths.map((w) => +w.toFixed(2)), points: path.points.map((q) => ({ x: +q.x.toFixed(2), z: +q.z.toFixed(2) })),
      thin: path.thin ? { amt: +path.thin.amt.toFixed(3), r: +path.thin.r.toFixed(2), bend: path.thin.bend } : null,
      texture: path.texture, info: path.info, revealAtB: +fog.revealAt(PIN_B.x, PIN_B.z).toFixed(3),
      ghostBOpacity: +ghostB.material.opacity.toFixed(3), seedR: SEED_R, staggerMs: STAGGER_MS, fp: { x: fp.x, z: fp.z, yaw: fp.yaw },
    } : null;
  },
  fp: { setPos(x, z) { fp.x = x; fp.z = z; }, setYaw(y) { fp.yaw = y; }, move(tx, tz) { moveFp(tx, tz); } },
  revealAt(x, z) { return fog.revealAt(x, z); },
  // 검증용 — 지금 화면을 한 번 그려 주어진 가로줄들의 밝기(0..255)를 돌려준다 (잔떨림·튕김 측정)
  scanRows(rows) {
    renderer.render(scene, activeCam);
    const gl = renderer.getContext();
    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const buf = new Uint8Array(W * 4);
    const out = {};
    for (const y of rows) {
      gl.readPixels(0, H - 1 - Math.round(y * (H / innerHeight)), W, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const lum = new Array(W);
      for (let x = 0; x < W; x++) lum[x] = Math.round(0.299 * buf[x * 4] + 0.587 * buf[x * 4 + 1] + 0.114 * buf[x * 4 + 2]);
      out[y] = lum;
    }
    return { width: W, scale: W / innerWidth, rows: out };
  },
  // 캡처용 — 입구 자막을 지금 다시 띄운다 (연출상은 회랑이 파일 때 한 번만)
  caption() { showCaption(currentConnective(), path && path.thin ? '벽 앞 · 길은 나지 않는다' : '회랑 입구', 6000); },
};
setPair(S.from, S.to);
frame();                       // 연결사 읽기가 늦어도 무대는 먼저 돈다
await loadConnectives();
recarve();
requestAnimationFrame(() => { window.__t1.ready = true; refreshStatus(true); });
</script>
