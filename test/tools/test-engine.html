<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별이 엔진 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0c;
            color: #e0e0e0;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #c4a882;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .summary {
            background: #121214;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .summary-stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0.25rem;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .stat-value.pass {
            color: #4caf50;
        }
        
        .stat-value.fail {
            color: #f44336;
        }
        
        .test-results {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .test-case {
            background: #121214;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .test-case:hover {
            border-color: #3a3a3e;
        }
        
        .test-case.pass {
            border-left: 4px solid #4caf50;
        }
        
        .test-case.fail {
            border-left: 4px solid #f44336;
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .test-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0e0;
        }
        
        .test-status {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .test-status.pass {
            background: #4caf50;
            color: white;
        }
        
        .test-status.fail {
            background: #f44336;
            color: white;
        }
        
        .test-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2a2a2e;
        }
        
        .test-detail {
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        
        .test-detail-label {
            color: #888;
            margin-right: 0.5rem;
        }
        
        .test-detail-value {
            color: #e0e0e0;
        }
        
        .test-detail-value.expected {
            color: #4caf50;
        }
        
        .test-detail-value.actual {
            color: #f44336;
        }
        
        .error-message {
            color: #f44336;
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 4px;
            border-left: 3px solid #f44336;
        }
        
        button {
            background: #c4a882;
            color: #0a0a0c;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        button:hover {
            background: #d4b892;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>별이 엔진 테스트</h1>
        
        <div class="summary" id="summary">
            <div class="loading">테스트를 실행하는 중...</div>
        </div>
        
        <div class="test-results" id="testResults">
            <!-- 테스트 결과가 여기에 표시됩니다 -->
        </div>
        
        <button onclick="runTests()">테스트 다시 실행</button>
    </div>
    
    <script type="module" src="test-engine.js"></script>
</body>
</html>
