<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>궤적 뷰어 — The Etched Mutation</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        body { margin: 0; background: #0a0a0f; color: #e0d8c4; font-family: 'Noto Serif KR', serif; }
        .tv-root { display: grid; grid-template-columns: 220px 1fr 320px; height: 100vh; }
        .tv-sidebar { background: rgba(15,15,22,0.9); border-right: 1px solid rgba(196,168,130,0.15); padding: 20px 16px; overflow-y: auto; }
        .tv-canvas-wrap { position: relative; overflow: hidden; background: #07070b; }
        .tv-canvas-wrap svg { width: 100%; height: 100%; display: block; }
        .tv-detail { background: rgba(15,15,22,0.9); border-left: 1px solid rgba(196,168,130,0.15); padding: 20px 16px; overflow-y: auto; }
        .tv-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: #c4a882; margin: 0 0 4px; letter-spacing: 0.04em; }
        .tv-subtitle { font-size: 0.75rem; color: #7c7466; margin: 0 0 18px; }
        .tv-section-label { font-size: 0.7rem; color: #7c7466; text-transform: uppercase; letter-spacing: 0.1em; margin: 18px 0 8px; }
        .tv-emo-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; border-radius: 3px; font-size: 0.85rem; }
        .tv-emo-row:hover { background: rgba(196,168,130,0.06); }
        .tv-emo-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .tv-emo-name { flex: 1; }
        .tv-emo-meta { font-size: 0.7rem; color: #7c7466; }
        .tv-toggle-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .tv-toggle { padding: 4px 8px; font-size: 0.7rem; border: 1px solid rgba(196,168,130,0.2); background: transparent; color: #c4a882; cursor: pointer; border-radius: 2px; }
        .tv-toggle.active { background: rgba(196,168,130,0.15); }
        .tv-status { padding: 12px; font-size: 0.75rem; color: #7c7466; text-align: center; }
        .tv-detail-empty { color: #5c544a; font-size: 0.85rem; padding: 40px 0; text-align: center; }
        .scene-node { cursor: pointer; }
        .scene-node-rect { fill: rgba(20,20,28,0.95); stroke: rgba(196,168,130,0.3); stroke-width: 1.2; }
        .scene-node:hover .scene-node-rect { stroke: #c4a882; }
        .scene-node-text { fill: #e0d8c4; font-family: 'Noto Serif KR', serif; font-size: 11px; }
        .scene-node-code { fill: #c4a882; font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; }
        .scene-node-counter { fill: #7c7466; font-size: 9px; }
        .badge-author { fill: #6a655a; }
        .badge-trajectory { fill: #4a7c9d; }
        .badge-text { fill: #e0d8c4; font-size: 8px; font-family: 'Noto Serif KR', serif; }
        .choice-edge { stroke: rgba(196,168,130,0.25); stroke-width: 1; fill: none; }
        .traj-edge { stroke-width: 1.5; fill: none; opacity: 0.7; }
        .entry-marker { fill: none; stroke-width: 2; }
    </style>
</head>
<body>
    <div class="tv-root">
        <aside class="tv-sidebar">
            <h2 class="tv-title">궤적 뷰어</h2>
            <p class="tv-subtitle" id="tvMemoryLabel">로딩 중…</p>

            <div class="tv-section-label">감정 진입점</div>
            <div id="tvEmotionList"></div>

            <div class="tv-section-label">표시 옵션</div>
            <div class="tv-toggle-row">
                <button class="tv-toggle" id="tvToggleAll">전체 표시</button>
                <button class="tv-toggle" id="tvToggleBridges">모든 브릿지</button>
                <button class="tv-toggle" id="tvToggleTerrain" title="감정 좌표 (V/A) 기반 배치">감정 지형 모드</button>
                <button class="tv-toggle" id="tvResetLayout" title="드래그로 옮긴 위치 초기화">레이아웃 초기화</button>
            </div>

            <div class="tv-section-label">통계</div>
            <div id="tvStats" class="tv-emo-meta" style="line-height: 1.6;"></div>
        </aside>

        <main class="tv-canvas-wrap">
            <svg id="tvSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="tv-status" id="tvStatus" style="position:absolute; top:10px; left:50%; transform:translateX(-50%);"></div>
            <div id="tvLegend" style="position:absolute;top:14px;right:14px;background:rgba(10,10,15,0.85);border:1px solid rgba(196,168,130,0.15);border-radius:4px;padding:10px 12px;font-size:0.72rem;color:#c0b8a4;backdrop-filter:blur(6px);line-height:1.7;pointer-events:none;">
                <div style="font-size:0.65rem;color:#7c7466;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">범례</div>
                <div><span style="display:inline-block;width:24px;border-top:1.2px solid rgba(196,168,130,0.5);vertical-align:middle;margin-right:6px;"></span>Choice (명시 분기)</div>
                <div><span style="display:inline-block;width:24px;border-top:1.2px dashed #6aa383;vertical-align:middle;margin-right:6px;"></span>Bridge (숨은 공명)</div>
                <div style="margin-top:6px;"><span style="display:inline-block;width:10px;height:10px;border:2px solid #c4a882;border-radius:50%;vertical-align:middle;margin-right:6px;"></span>감정 진입점</div>
                <div><span style="display:inline-block;width:12px;height:12px;background:#6a655a;border-radius:2px;vertical-align:middle;margin-right:6px;"></span>🔗 작가 브릿지</div>
                <div><span style="display:inline-block;width:12px;height:12px;background:#4a7c9d;border-radius:2px;vertical-align:middle;margin-right:6px;"></span>🌊 궤적 브릿지</div>
            </div>
        </main>

        <aside class="tv-detail">
            <h3 class="tv-title">씬 디테일</h3>
            <div id="tvDetail"><div class="tv-detail-empty">노드를 클릭하세요</div></div>
        </aside>
    </div>

    <script type="module" src="js/admin-trajectory.js"></script>
</body>
</html>
