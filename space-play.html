    첫 장면 = 검은 화면의 글과 소리 / 그 뒤 = 검은 우주에 장면마다 조형물 하나, 중력 없이 날아다님 /
    장면이 끝나면 아스키 길과 문(길에 닿으면 중력·발소리) / 끝 = 실뭉치 → 읽은 판본이 올라감 → 메인.
    주소: ?memory=<기억 id 또는 코드> (기본 UNDW-001) · ?as=test (연습 걸음, 남지 않음) · ?as=author · ?lang=ko|en
          as=test = 측정과 대답은 실제로 하되 장부에는 아무것도 쓰지 않는다.
          시험 전용(as=test 일 때만): &fast=4 · &dry=1 (서버에 묻지도 않음) · &at=space|end (그 대목부터) · &peek=1 (조형물 전부 놓고 둘러보기)
    글 방(room-play.html)·옛 지형(play-test.html)·한 걸음(one-walk.html)은 건드리지 않는다.
    되돌리기 = 이 파일 + css/space-play.css + js/spaceplay/ 삭제 (+ js/app/opening.js 의 이동 주소 한 줄).
  -->
