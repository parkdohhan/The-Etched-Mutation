<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-deep: #0a0a0c;
      --text-primary: #e8e4df;
      --text-muted: #6b6b7b;
      --accent-memory: #c4a882;
      --bg-surface: rgba(15, 15, 20, 0.95);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0a0a0e; color: var(--text-primary); font-family: 'Noto Serif KR', 'Cormorant Garamond', serif; }
    #selectScreen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0e; }
    #mapMode {
      position: fixed; inset: 0; background: #0a0a0e; display: none; flex-direction: column; z-index: 50;
    }
    #mapMode.active { display: flex; }
    .map-canvas-area { flex: 1; position: relative; min-height: 0; }
    #contourCanvas { width: 100%; height: 100%; display: block; }
    .map-pins-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .map-pin {
      position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
      border-radius: 50%; transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .map-pin.core { width: 12px; height: 12px; border: 1.5px solid var(--accent-memory); background: rgba(232, 228, 220, 0.95); }
    .map-pin.core.active { box-shadow: 0 0 12px rgba(196,168,130,0.6); }
    .map-pin.echo { width: 6px; height: 6px; background: rgba(180, 160, 200, 0.85); border: 1px solid rgba(200, 180, 220, 0.5); }
    .map-pin.bridge {
      width: 9px; height: 9px; border: 1.3px solid #7a9a7a; background: rgba(122, 154, 122, 0.22);
      box-shadow: 0 0 10px rgba(122,154,122,0.5);
    }
    .map-pin.bridge.active { box-shadow: 0 0 10px rgba(122,154,122,0.5); }
    .map-pin.voidPin { width: 8px; height: 8px; background: transparent; border: 1px dashed rgba(200, 150, 140, 0.6); }
    .map-pin.active { box-shadow: 0 0 14px rgba(196, 168, 130, 0.55); opacity: 1; }
    .map-pin.current { box-shadow: 0 0 20px rgba(255, 220, 180, 0.8); }
    .map-pin.visited { opacity: 0.72; }
    .map-pin.visited::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; background: #888;
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    .map-pin.locked { opacity: 0.38; pointer-events: none; filter: grayscale(0.35); }
    .map-pin.entrance { animation: entrancePulse 1.5s ease-in-out infinite; }
    @keyframes entrancePulse {
      0% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
      50% { box-shadow: 0 0 22px rgba(196, 168, 130, 0.65); transform: translate(-50%, -50%) scale(1.15); }
      100% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
    }
    .map-pin.unlocking { animation: pinUnlock 0.5s ease forwards; }
    .map-pin.locking { animation: pinLock 0.5s ease forwards; }
    @keyframes pinUnlock {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes pinLock { from { opacity: 1; } to { opacity: 0.06; } }
    .map-pin-label { position: absolute; left: 14px; top: -6px; font-size: 10px; color: rgba(200, 190, 220, 0.7); white-space: nowrap; font-style: italic; pointer-events: none; }
    .emotion-cursor {
      position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(196, 168, 130, 0.15);
      transform: translate(-50%, -50%); pointer-events: none; animation: cursorPulse 2s infinite; z-index: 1;
    }
    @keyframes cursorPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    }
    .map-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem;
      border-top: 1px solid rgba(196, 168, 130, 0.12); background: rgba(8, 8, 12, 0.92);
    }
    .map-status { font-size: 0.75rem; color: rgba(200, 195, 210, 0.65); letter-spacing: 0.04em; }
    .seal-btn {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.45rem 1rem; border-radius: 6px; border: 1px solid rgba(200, 180, 230, 0.35);
      background: rgba(60, 45, 85, 0.45); color: rgba(232, 224, 252, 0.35); cursor: not-allowed;
    }
    .seal-btn:not(:disabled) { color: rgba(248, 240, 255, 0.95); background: rgba(100, 70, 130, 0.55); cursor: pointer; border-color: rgba(210, 190, 255, 0.55); }

    #sceneMode { display: none; position: fixed; inset: 0; background: var(--bg-deep); z-index: 50; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
    #sceneMode.active { display: flex; opacity: 1; }
    .wave-top { width: 100%; height: 18vh; max-height: 200px; position: relative; overflow: hidden; flex-shrink: 0; }
    #waveCanvas { width: 100%; height: 100%; display: block; }
    .scene-content-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1rem; overflow-y: auto; }
    .scene-main { width: 100%; max-width: 560px; text-align: center; }
    #sceneNpc { font-family: 'Cormorant Garamond', serif; font-style: italic; color: rgba(196, 168, 130, 0.5); font-size: 0.9rem; min-height: 1.2em; margin-bottom: 0.8rem; }
    #sceneText { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; line-height: 2; letter-spacing: 0.03em; color: var(--text-primary); margin-bottom: 1.5rem; }
    #emotionInputArea { opacity: 0; transition: opacity 0.6s; }
    #emotionInputArea.warn-border { box-shadow: 0 0 0 1px rgba(196, 168, 130, 0.15); border-radius: 8px; padding: 8px; }
    .emotion-chip {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.35); color: #ccc;
      padding: 10px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; cursor: pointer; transition: all 0.3s;
      border-radius: 4px; user-select: none; margin: 3px;
    }
    .emotion-chip:hover { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.08); }
    .emotion-chip.selected { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.1); }
    .action-btn {
      background: rgba(196, 168, 130, 0.1); border: 1px solid rgba(196, 168, 130, 0.25); color: #e8e4df;
      padding: 8px 24px; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; cursor: pointer; border-radius: 4px;
    }
    .action-btn:disabled { opacity: 0.3; cursor: default; }
    .action-btn.void { background: transparent; border-color: rgba(200, 150, 140, 0.3); color: rgba(200, 150, 140, 0.7); font-style: italic; }
    .typing::after { content: '|'; animation: blink 500ms step-end infinite; color: rgba(196, 168, 130, 0.6); }
    @keyframes blink { 50% { opacity: 0; } }

    #terrainBar { width: 100%; height: 120px; position: relative; flex-shrink: 0; border-top: 1px solid rgba(196, 168, 130, 0.08); background: #09090d; }
    #terrainBar.clickable { cursor: pointer; animation: terrainPulse 1.5s ease-in-out infinite; }
    @keyframes terrainPulse {
      0% { border-top-color: rgba(196, 168, 130, 0.08); }
      50% { border-top-color: rgba(196, 168, 130, 0.25); }
      100% { border-top-color: rgba(196, 168, 130, 0.08); }
    }
    #terrainCanvas { width: 100%; height: 100%; display: block; }
    #terrainClickHint { display: none; position: absolute; inset: 0; cursor: pointer; }
    #terrainClickHint .hint-txt { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-family: 'Cormorant Garamond', serif; font-size: 0.75rem; color: rgba(196, 168, 130, 0.4); letter-spacing: 0.05em; }

    #revealScreen {
      display: none; position: fixed; inset: 0; z-index: 60; background: #08080c; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    #revealScreen.active { display: flex; }
    #revealScreen h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 0.06em; color: var(--text-primary); }
    #revealScreen p { max-width: 520px; line-height: 1.8; color: rgba(220, 215, 230, 0.85); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div id="selectScreen">
    <h1 style="font-family:'Cormorant Garamond',serif;color:#e8e4df;font-size:2rem;font-weight:400;letter-spacing:0.05em;margin-bottom:2rem;">The Etched Mutation</h1>
    <select id="memorySelect" style="background:#111;color:#e8e4df;border:1px solid rgba(196,168,130,0.3);padding:0.6rem 1.2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;border-radius:4px;margin-bottom:1rem;min-width:250px;"></select>
    <button id="startBtn" type="button" style="background:transparent;border:1px solid rgba(196,168,130,0.3);color:#c4a882;padding:0.6rem 2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;cursor:pointer;border-radius:4px;letter-spacing:0.05em;">Enter the memory</button>
  </div>

  <div id="mapMode">
    <div class="map-canvas-area" id="mapCanvasArea">
      <canvas id="contourCanvas"></canvas>
      <div class="map-pins-layer" id="mapPinsLayer"></div>
      <div class="emotion-cursor" id="emotionCursor" style="display:none;"></div>
    </div>
    <div class="map-bar">
      <span class="map-status" id="mapStatus">탐색: 0개 | 오염도: 0%</span>
      <button type="button" class="seal-btn" id="sealBtn" disabled>Seal this memory</button>
    </div>
  </div>

  <div id="sceneMode">
    <div class="wave-top" id="waveTop"><canvas id="waveCanvas"></canvas></div>
    <div class="scene-content-area">
      <div class="scene-main">
        <div id="sceneNpc"></div>
        <div id="sceneText"></div>
        <div id="emotionInputArea">
          <div id="emotionChips" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;"></div>
          <div id="sliderArea" style="margin-bottom:12px;"></div>
          <div id="reasonArea" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;"></div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button type="button" id="submitBtn" class="action-btn" disabled>입력</button>
            <button type="button" id="voidBtn" class="action-btn void">Leave it unsaid</button>
          </div>
        </div>
      </div>
    </div>
    <div id="terrainBar">
      <canvas id="terrainCanvas"></canvas>
      <div id="terrainClickHint"><div class="hint-txt">지형을 탐색하세요</div></div>
    </div>
  </div>

  <div id="revealScreen">
    <h2 id="revealTitle">Memory sealed</h2>
    <p id="revealBody"></p>
    <p id="revealStats" style="font-size:0.85rem;color:var(--text-muted);"></p>
    <button type="button" class="action-btn" id="revealRestart" style="margin-top:1.5rem;">다시 시작</button>
  </div>

  <script>
  /* ========== PLAY-TEST BUNDLE (inline, no project imports) ========== */
  const SUPABASE_URL = 'https://bxmppaxpzbkwebfbgpsm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bXBwYXhwemJrd2ViZmJncHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMTcyMTEsImV4cCI6MjA4MDU5MzIxMX0.vv6Bmi2rZdx_HzLcxuw1wxfN_fvQYiigQz11KPNxH2M';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const LOG = (...a) => console.log('[play-test]', ...a);

  function safeParseEmotion(val) {
    if (!val) return {};
    if (typeof val === 'object' && !Array.isArray(val)) return val;
    if (typeof val === 'string') { try { return JSON.parse(val); } catch (_) { return {}; } }
    return {};
  }

  const EMOTIONS_UI = [
    { key: 'fear', label: '공포' }, { key: 'sadness', label: '슬픔' }, { key: 'anger', label: '분노' }, { key: 'longing', label: '그리움' },
    { key: 'guilt', label: '죄책감' }, { key: 'shame', label: '수치심' }, { key: 'numbness', label: '무감각' }, { key: 'isolation', label: '고립' },
  ];
  const REASONS = [
    { key: 'self_blame', label: '내 잘못인 것 같아서' },
    { key: 'helpless', label: '어쩔 수 없었어' },
    { key: 'fear_driven', label: '무서웠어' },
    { key: 'unknown', label: '모르겠어' },
  ];
  const EMOTION_COLORS = {
    fear: [100, 80, 180], sadness: [80, 100, 160], anger: [200, 80, 80], joy: [200, 180, 100], longing: [80, 180, 180],
    guilt: [150, 130, 100], shame: [160, 100, 130], numbness: [90, 90, 110], isolation: [70, 90, 130],
  };
  const DEFAULT_ANCHOR_KEYS = ['fear','sadness','anger','guilt','shame','isolation','numbness','moral_pain','helplessness','despair','joy','hope','relief','gratitude','love','peace','comfort','longing','nostalgia','acceptance','confusion'];

  function cosineSimilarity(vec1, vec2, keys) {
    const ks = keys || DEFAULT_ANCHOR_KEYS;
    let dot = 0, m1 = 0, m2 = 0;
    ks.forEach(k => {
      const a = vec1[k] || 0, b = vec2[k] || 0;
      dot += a * b; m1 += a * a; m2 += b * b;
    });
    if (!m1 || !m2) return 0;
    return dot / Math.sqrt(m1 * m2);
  }

  function emotionVectorToRGB(ev) {
    if (!ev || typeof ev !== 'object') return [120, 120, 140];
    const base = ev.base || ev;
    const entries = Object.entries(base).filter(([, v]) => v != null && v > 0);
    if (!entries.length) return [120, 120, 140];
    const dom = entries.sort((a, b) => b[1] - a[1])[0];
    return EMOTION_COLORS[dom[0]] || [120, 120, 140];
  }

  /* —— strataSection: noise + profile —— */
  function _hs(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
  function _sn(x, y) {
    const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return _hs(i, j) + (_hs(i + 1, j) - _hs(i, j)) * sx + (_hs(i, j + 1) - _hs(i, j)) * sy + (_hs(i, j) - _hs(i + 1, j) - _hs(i, j + 1) + _hs(i + 1, j + 1)) * sx * sy;
  }
  function _fm(x, y, o) {
    o = o || 4; let v = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) { v += a * _sn(x * f, y * f); a *= 0.5; f *= 2.1; }
    return v;
  }
  const ANCHOR_COLORS = {
    anger: [140, 20, 20], fear: [60, 20, 80], shame: [100, 30, 60], moral_pain: [70, 30, 50], sadness: [30, 50, 100],
    guilt: [80, 50, 30], isolation: [20, 20, 40], numbness: [60, 60, 65], longing: [80, 60, 100], joy: [180, 140, 60],
    hope: [140, 160, 80], love: [140, 60, 80],
  };

  function buildProfileFromScenes(scenes, sampleCount) {
    const n = scenes.length;
    if (!n) {
      const pts = [];
      for (let i = 0; i < sampleCount; i++) pts.push({ h: 0.3, r: 0.1, g: 0.1, b: 0.13 });
      return pts;
    }
    const raw = [];
    for (let si = 0; si < n; si++) {
      const em = safeParseEmotion(scenes[si].original_emotion);
      let totalW = 0, wH = 0, cr = 0.1, cg = 0.1, cb = 0.13;
      for (const [name, val] of Object.entries(em)) {
        if (!val || val <= 0) continue;
        const anc = ANCHOR_COLORS[name];
        wH += val * 15 * val;
        if (anc) { cr += (anc[0] / 255) * val * 0.6; cg += (anc[1] / 255) * val * 0.6; cb += (anc[2] / 255) * val * 0.6; }
        totalW += val;
      }
      const h = totalW > 0 ? wH / Math.sqrt(totalW) : 2;
      raw.push({ h: Math.max(0.5, Math.min(12, h)), r: Math.min(1, cr), g: Math.min(1, cg), b: Math.min(1, cb) });
    }
    const pts = [];
    for (let i = 0; i < sampleCount; i++) {
      const t = (i / (sampleCount - 1)) * (n - 1);
      const lo = Math.floor(t), hi = Math.min(lo + 1, n - 1);
      const frac = t - lo;
      const a = raw[lo], b = raw[hi];
      const noise = (_fm(i * 0.12, 0.5, 5) - 0.35) * 2.8;
      pts.push({
        h: a.h * (1 - frac) + b.h * frac + noise,
        r: a.r * (1 - frac) + b.r * frac, g: a.g * (1 - frac) + b.g * frac, b: a.b * (1 - frac) + b.b * frac,
      });
    }
    return pts;
  }

  function setupTerrainCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    if (w <= 0 || h <= 0) return null;
    const nw = Math.round(w * dpr), nh = Math.round(h * dpr);
    if (canvas.width !== nw || canvas.height !== nh) { canvas.width = nw; canvas.height = nh; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  function renderTerrainProfile(canvas, scenes, traces, currentSceneIndex, tintRGB) {
    if (!canvas) return;
    const setup = setupTerrainCanvas(canvas);
    if (!setup) return;
    const { ctx, w, h } = setup;
    ctx.fillStyle = '#09090d';
    ctx.fillRect(0, 0, w, h);
    const n = Math.max(1, scenes.length);
    const sampleCount = Math.max(n * 8, 60);
    const profile = buildProfileFromScenes(scenes, sampleCount);
    const profileTop = h * 0.12, profileBottom = h * 0.4, profileRange = profileBottom - profileTop;
    let minH = Infinity, maxH = -Infinity;
    profile.forEach(p => { minH = Math.min(minH, p.h); maxH = Math.max(maxH, p.h); });
    const rangeH = maxH - minH || 1;
    const profileY = [];
    for (let i = 0; i < sampleCount; i++) {
      const norm = Math.pow((profile[i].h - minH) / rangeH, 0.85);
      profileY.push(profileBottom - norm * profileRange * 0.9);
    }
    const UNDER_LAYERS = 4;
    const underStart = profileBottom, underEnd = h * 0.92;
    const layerGap = (underEnd - underStart) / UNDER_LAYERS;
    for (let li = UNDER_LAYERS - 1; li >= 0; li--) {
      const layerTopBase = underStart + li * layerGap, layerBotBase = underStart + (li + 1) * layerGap;
      const dampening = 1 - (li / UNDER_LAYERS) * 0.8, darkness = 0.08 + (li / UNDER_LAYERS) * 0.06;
      ctx.beginPath();
      for (let i = 0; i < sampleCount; i++) {
        const x = (i / (sampleCount - 1)) * w;
        const y = layerTopBase + (profileY[i] - profileBottom) * dampening * 0.25 + (_fm(i * 0.08 + li * 2.7, li * 1.3, 5) - 0.35) * layerGap * 0.32 * dampening;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      for (let i = sampleCount - 1; i >= 0; i--) {
        const x = (i / (sampleCount - 1)) * w;
        const y = layerBotBase + (profileY[i] - profileBottom) * dampening * 0.15 + (_fm(i * 0.07 + li * 3.1 + 5, li * 1.7 + 2, 5) - 0.35) * layerGap * 0.18 * dampening;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      const av = profile[Math.floor(sampleCount / 2)];
      const avgR = Math.round(av.r * 255 * darkness), avgG = Math.round(av.g * 255 * darkness), avgB = Math.round(av.b * 255 * darkness);
      ctx.fillStyle = 'rgba(' + avgR + ',' + avgG + ',' + avgB + ',' + (0.35 - li * 0.06) + ')';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(0, profileY[0]);
    for (let i = 1; i < sampleCount; i++) {
      const x = (i / (sampleCount - 1)) * w, px = ((i - 1) / (sampleCount - 1)) * w;
      ctx.quadraticCurveTo(px, profileY[i - 1], (px + x) / 2, (profileY[i - 1] + profileY[i]) / 2);
    }
    ctx.lineTo(w, profileBottom + 4); ctx.lineTo(0, profileBottom + 4); ctx.closePath();
    const midP = profile[Math.floor(sampleCount / 2)];
    let pR = Math.round(midP.r * 255 * 0.4 + 10), pG = Math.round(midP.g * 255 * 0.4 + 10), pB = Math.round(midP.b * 255 * 0.4 + 10);
    if (tintRGB) {
      pR = Math.round(tintRGB[0] * 0.55 + pR * 0.45);
      pG = Math.round(tintRGB[1] * 0.55 + pG * 0.45);
      pB = Math.round(tintRGB[2] * 0.55 + pB * 0.45);
    }
    const fillGrad = ctx.createLinearGradient(0, profileTop, 0, profileBottom + 4);
    fillGrad.addColorStop(0, 'rgba(' + pR + ',' + pG + ',' + pB + ',0.35)');
    fillGrad.addColorStop(1, 'rgba(' + pR + ',' + pG + ',' + pB + ',0.08)');
    ctx.fillStyle = fillGrad; ctx.fill();

    const segW = w / n;
    (traces || []).forEach(tr => {
      const si = tr.sceneIndex;
      if (si < 0 || si >= n) return;

    <div id="sliderArea" style="margin-bottom:12px;"></div>
    <div id="reasonArea" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button type="button" id="submitBtn" class="action-btn" disabled>입력</button>
      <button type="button" id="voidBtn" class="action-btn void">Leave it unsaid</button>
    </div>
  `;

  const game = {
    memoryId: null,
    memories: [],
    scenes: [],
    plays: [],
    anchors: buildAnchors(),
    caches: {},
    agg: null,
    pins: [],
    coreVisitCount: 0,
    visitedCore: {},
    previousBucket: null,
    emotionHistory: [],
    skipCount: 0,
    sealed: false,
    currentSceneIndex: null,
    lastResult: null,
    lastTintRGB: null,
    traces: [],
    waveT: 0,
    waveRaf: null,
    voidTimeout: null,
    inputDeadline: null,
    cursorPos: { x: 50, y: 50 },
    cursorTarget: { x: 50, y: 50 },
    cursorRaf: null,
    lastUserEmotion: null,
    accessiblePinIds: null,
    currentPinId: null,
  };

  const TRANSITION_RULES = {
    echo_follow: { radius: 0.42 },
    bridge: { radius: 0.62 },
    contradiction: { radius: 0.36 },
    displacement: { radius: 0.48 },
    avoidance: { radius: 0.24 },
    fixation: { radius: 0.09 },
  };

  function emotionToMapCoords(emotion) {
    const vad = projectEmotionToVADContour(emotion || {});
    const nx = (vad.v * HALF) / SIZE + 0.5;
    const ny = (vad.a * HALF) / SIZE + 0.5;
    return {
      x: Math.max(0, Math.min(1, nx)),
      y: Math.max(0, Math.min(1, ny)),
    };
  }

  function mapCoordsSpread(baseX, baseY, idx, sceneId) {
    const s = String(sceneId != null ? sceneId : idx);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    const ang = (Math.abs(h) % 628) / 100;
    const mag = 0.012 + (Math.abs(h) % 23) / 2300;
    let nx = baseX + Math.cos(ang) * mag;
    let ny = baseY + Math.sin(ang * 1.07) * mag;
    nx = Math.max(0.03, Math.min(0.97, nx));
    ny = Math.max(0.03, Math.min(0.97, ny));
    return { x: nx, y: ny };
  }

  function distMap(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function updateAccess(pattern, emotionPosition, originSceneId) {
    const cores = game.pins.filter(p => p.type === 'core' || p.type === 'bridge');
    const originPin = cores.find(p => p.sceneId === originSceneId) || null;
    const rule = TRANSITION_RULES[pattern] || TRANSITION_RULES.bridge;
    let center = emotionPosition && (emotionPosition.x != null)
      ? { x: emotionPosition.x, y: emotionPosition.y }
      : { x: 0.5, y: 0.5 };
    if (originPin && originPin.mapX != null) {
      center = {
        x: (center.x + originPin.mapX) / 2,
        y: (center.y + originPin.mapY) / 2,
      };
    }
    let withDist = cores.map(p => ({
      pin: p,
      d: distMap(center, { x: p.mapX, y: p.mapY }),
    }));
    console.log('[DEBUG] updateAccess center', center, 'pattern', pattern, 'withDist count', withDist.length);

    let selected = [];
    if (pattern === 'fixation' && originPin) {
      selected = [originPin];
    } else {
      selected = withDist.filter(o => o.d <= rule.radius).map(o => o.pin);
      if (!selected.length) {
        const r2 = rule.radius * 1.85;
        selected = withDist.filter(o => o.d <= r2).map(o => o.pin);
      }
      if (!selected.length) {
        selected = cores.filter(p => !game.visitedCore[p.sceneId]);
      }
      if (!selected.length) {
        selected = cores.slice();
      }
    }

    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene && (pattern === 'avoidance' || pattern === 'contradiction')) {
      const vp = game.pins.find(p => p.type === 'voidPin');
      if (vp) selected.push(vp);
    }

    game.accessiblePinIds = new Set(selected.map(p => p.id));
    console.log('[DEBUG] updateAccess selected ids', Array.from(game.accessiblePinIds));
  }

  function handleEmotionResult(ctx) {
    const userEmotion = ctx.userEmotion || {};
    const result = ctx.result || {};
    const originSceneId = ctx.originSceneId;
    const emotionPosition = emotionToMapCoords(userEmotion);
    const bucket = result.alignment_bucket;
    const mismatch = result.mismatch_type;
    const alignment = result.alignment_score;
    const pattern = result.transition_pattern != null
      ? result.transition_pattern
      : getTransitionPattern(bucket, mismatch);

    console.log('[DEBUG] userEmotion:', userEmotion);
    console.log('[DEBUG] emotionPosition:', emotionPosition);
    console.log('[DEBUG] alignment:', alignment, 'bucket:', bucket, 'mismatch:', mismatch);
    console.log('[DEBUG] pattern:', pattern);
    console.log('[DEBUG] 핀 좌표들:', game.pins.map(p => ({
      id: p.id,
      x: (p.mapX != null ? p.mapX : p.x / 100).toFixed(3),
      y: (p.mapY != null ? p.mapY : p.y / 100).toFixed(3),
      type: p.type,
    })));

    if (!game.pins.length) {
      game.accessiblePinIds = new Set();
      return;
    }
    updateAccess(pattern, emotionPosition, originSceneId);
    syncPinStateFlags();
    console.log('[DEBUG] updateAccess 후 active:', game.pins.filter(p => p.state === 'active').map(p => p.id));
  }

  function syncPinStateFlags() {
    game.pins.forEach(p => {
      if (p.type === 'core' || p.type === 'bridge') {
        const can = !!game.visitedCore[p.sceneId] || !!(game.accessiblePinIds && game.accessiblePinIds.has(p.id));
        p.state = can ? 'active' : 'locked';
      } else if (p.type === 'voidPin') {
        const can = !!(game.accessiblePinIds && game.accessiblePinIds.has(p.id)) || !!game.visitedCore[p.sceneId];
        p.state = can ? 'active' : 'locked';
      } else {
        p.state = 'locked';
      }
    });
  }

  function applyInitialAccess() {
    const cores = game.pins.filter(p => p.type === 'core' || p.type === 'bridge');
    const unvisited = cores.filter(p => !game.visitedCore[p.sceneId]);
    const picked = unvisited.length ? unvisited : cores.slice();
    game.accessiblePinIds = new Set(picked.map(p => p.id));
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vp = game.pins.find(p => p.type === 'voidPin');
      if (vp) game.accessiblePinIds.add(vp.id);
    }
  }

  function getAttributionDirection(attribution) {
    if (!attribution) return null;
    const internal = ['self_blame', 'self_doubt', 'self_punishment', 'guilt_driven', 'unknown'];
    const external = ['other_blame', 'betrayal', 'external_threat', 'abandonment_by_other'];
    const situational = ['fate', 'circumstance', 'helpless_situation', 'inevitable', 'helpless'];
    if (internal.includes(attribution)) return 'internal';
    if (external.includes(attribution)) return 'external';
    if (situational.includes(attribution)) return 'situational';
    return null;
  }

  function getFearCategory(coreFear) {
    if (!coreFear) return null;
    const loss = ['abandonment', 'loss', 'separation', 'death_of_loved'];
    const worthlessness = ['inadequacy', 'failure', 'shame', 'not_enough'];
    const powerlessness = ['helplessness', 'loss_of_control', 'entrapment', 'vulnerability'];
    const punishment = ['punishment', 'rejection', 'judgment', 'exposure'];
    if (loss.includes(coreFear)) return 'loss';
    if (worthlessness.includes(coreFear)) return 'worthlessness';
    if (powerlessness.includes(coreFear)) return 'powerlessness';
    if (punishment.includes(coreFear)) return 'punishment';
    return null;
  }

  function calculateEmbeddingSimilarity(vecA, vecB) {
    if (!vecA || !vecB || !Array.isArray(vecA) || !Array.isArray(vecB) || vecA.length === 0 || vecA.length !== vecB.length) return 0;
    let dot = 0, ma = 0, mb = 0;
    for (let i = 0; i < vecA.length; i++) {
      const a = Number(vecA[i]) || 0, b = Number(vecB[i]) || 0;
      dot += a * b; ma += a * a; mb += b * b;
    }
    if (!ma || !mb) return 0;
    return Math.max(0, dot / Math.sqrt(ma * mb));
  }

  function calculateEmotionScore(userVector, originalVector, anchorEmotions) {
    if (!userVector || !originalVector) return 0;
    const userEmb = userVector.embedding;
    const origEmb = originalVector.embedding;
    if (userEmb && origEmb && Array.isArray(userEmb) && Array.isArray(origEmb) && userEmb.length && origEmb.length) {
      return calculateEmbeddingSimilarity(userEmb, origEmb);
    }
    const userBase = userVector.base || userVector;
    const origBase = originalVector.base || originalVector;
    return Math.max(0, cosineSimilarity(userBase, origBase, anchorEmotions));
  }

  function calculateReasonScore(userVector, originalVector, emotionScoreFallback) {
    const fb = emotionScoreFallback || 0;
    const userReason = userVector && userVector.reason_analysis;
    const origReason = originalVector && originalVector.reason_analysis;
    if (!userReason && !origReason) return fb * 0.3;
    if (!userReason || !origReason) return 0.15;
    let score = 0;
    if (userReason.attribution && origReason.attribution) {
      if (userReason.attribution === origReason.attribution) score += 0.45;
      else {
        const ud = getAttributionDirection(userReason.attribution);
        const od = getAttributionDirection(origReason.attribution);
        if (ud && ud === od) score += 0.20;
      }
    } else if (!userReason.attribution && !origReason.attribution) score += 0.15;
    if (userReason.core_fear && origReason.core_fear) {
      if (userReason.core_fear === origReason.core_fear) score += 0.35;
      else {
        const uc = getFearCategory(userReason.core_fear);
        const oc = getFearCategory(origReason.core_fear);
        if (uc && uc === oc) score += 0.15;
      }
    } else if (!userReason.core_fear && !origReason.core_fear) score += 0.10;
    if (userReason.target && origReason.target) {
      if (userReason.target === origReason.target) score += 0.20;
    } else if (!userReason.target && !origReason.target) score += 0.05;
    return Math.min(1, score);
  }

  function calculateAttitudeScore(userVector, originalVector, attitudeContext) {
    attitudeContext = attitudeContext || {};
    let score = 0.5;
    const userReason = (userVector && userVector.reason_analysis) || {};
    const origReason = (originalVector && originalVector.reason_analysis) || {};
    const userVoid = !!userReason.is_void;
    const origVoid = !!origReason.is_void;
    if (userVoid && origVoid) score = 0.8;
    else if (userVoid && !origVoid) score = 0.2;
    else if (!userVoid && origVoid) score = 0.6;
    else score = 0.7;
    const rawHistory = attitudeContext.emotionHistory;
    const emotionHistory = rawHistory || [];
    if (emotionHistory.length >= 2) {
      const fixationLevel = calculateFixationLevel(emotionHistory);
      score -= fixationLevel * 0.3;
    }
    const skipCount = attitudeContext.skipCount || 0;
    if (skipCount > 0) score -= Math.min(0.2, skipCount * 0.05);
    return Math.max(0, Math.min(1, score));
  }

  function calculateAlignment(emotionScore, reasonScore, attitudeScore) {
    return Math.max(0, Math.min(1, emotionScore * 0.4 + reasonScore * 0.4 + attitudeScore * 0.2));
  }

  function calculateFixationLevel(emotionHistory) {
    if (!emotionHistory || emotionHistory.length < 2) return 0;
    const recent = emotionHistory.slice(-3);
    if (recent.length < 2) return 0;
    let totalSim = 0, pairs = 0;
    for (let i = 0; i < recent.length - 1; i++) {
      for (let j = i + 1; j < recent.length; j++) {
        const a = recent[i], b = recent[j];
        if (!a || !b) continue;
        if (typeof a === 'object' && typeof b === 'object') {
          totalSim += Math.max(0, cosineSimilarity(a, b));
        } else if (typeof a === 'string' && typeof b === 'string') {
          totalSim += (a === b) ? 1.0 : 0.0;
        }
        pairs++;
      }
    }
    if (!pairs) return 0;
    return totalSim / pairs;
  }

  function getBucket(alignment, previousBucket, emotionHistory) {
    if (emotionHistory && emotionHistory.length >= 3) {
      const fixLevel = calculateFixationLevel(emotionHistory);
      if (fixLevel >= 0.85) return 'FIXATED';
    }
    if (previousBucket === 'HIGH' && alignment >= 0.45) return 'HIGH';
    if (previousBucket === 'LOW' && alignment <= 0.42) return 'LOW';
    if (alignment >= 0.55) return 'HIGH';
    if (alignment < 0.35) return 'LOW';
    return 'MID';
  }

  function getMismatchType(userVector, originalVector) {
    if (!userVector || !originalVector) return null;
    const userReason = userVector.reason_analysis || {};
    const origReason = originalVector.reason_analysis || {};
    if (!!userReason.is_void !== !!origReason.is_void) return 'void_mismatch';
    if (userReason.attribution && origReason.attribution && userReason.attribution !== origReason.attribution) {
      return 'attribution_mismatch';
    }
    if (userReason.target && origReason.target && userReason.target !== origReason.target) {
      const emotionSim = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
      if (emotionSim >= 0.5) return 'target_displacement';
    }
    const emotionSimilarity = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
    if (emotionSimilarity < 0.5) return 'emotion_mismatch';
    return null;
  }

  function getTransitionPattern(bucket, mismatchType) {
    if (bucket === 'FIXATED') return 'fixation';
    if (bucket === 'HIGH') return 'echo_follow';
    if (bucket === 'MID') return 'bridge';
    if (bucket === 'LOW') {
      switch (mismatchType) {
        case 'void_mismatch': return 'avoidance';
        case 'target_displacement': return 'displacement';
        case 'emotion_mismatch': return 'contradiction';
        case 'attribution_mismatch': return 'contradiction';
        default: return 'bridge';
      }
    }
    return null;
  }

  function byeoriCalculateStep(input, context) {
    context = context || {};
    const { userVector, originalVector, anchorEmotions = null } = input;
    const { previousBucket = null, emotionHistory = null, skipCount = 0 } = context;
    if (!userVector || !originalVector) {
      return { affective_position: { v: 0, a: 0, d: 0 }, alignment_score: 0, alignment_bucket: 'LOW', transition_pattern: null, mismatch_type: null, debug: {} };
    }
    const emotionScore = calculateEmotionScore(userVector, originalVector, anchorEmotions);
    const reasonScore = calculateReasonScore(userVector, originalVector, emotionScore);
    const attitudeScore = calculateAttitudeScore(userVector, originalVector, { emotionHistory, skipCount });
    const alignmentScore = calculateAlignment(emotionScore, reasonScore, attitudeScore);
    const alignmentBucket = getBucket(alignmentScore, previousBucket, emotionHistory);
    const mismatchType = getMismatchType(userVector, originalVector);
    const baseVec = userVector.base || userVector;
    const affectivePosition = projectEmotionToVADContour(baseVec);
    const transitionPattern = getTransitionPattern(alignmentBucket, mismatchType);
    const debug = {
      emotion_score: emotionScore,
      reason_score: reasonScore,
      attitude_score: attitudeScore,
      formula: 'E×.4+R×.4+A×.2',
      fixation_level: emotionHistory ? calculateFixationLevel(emotionHistory) : 0,
      has_reason_data: !!(userVector.reason_analysis && originalVector.reason_analysis),
      has_embedding: !!(userVector.embedding && originalVector.embedding),
    };
    return {
      affective_position: affectivePosition,
      alignment_score: alignmentScore,
      alignment_bucket: alignmentBucket,
      transition_pattern: transitionPattern,
      mismatch_type: mismatchType,
      debug,
    };
  }

  function buildOriginalVectorFromScene(scene) {
    const base = safeParseEmotion(scene.original_emotion);
    const voidInfo = scene.void_info || {};
    const isVoidScene = !!(voidInfo && voidInfo.sceneVoid);
    return {
      base,
      reason_analysis: {
        attribution: scene.original_reason || null,
        target: voidInfo.target || null,
        core_fear: voidInfo.coreFear || voidInfo.core_fear || null,
        is_void: isVoidScene,
      },
    };
  }

  function reasonKeyToAttribution(key) {
    const m = { self_blame: 'self_blame', helpless: 'helpless_situation', fear_driven: 'external_threat', unknown: 'unknown' };
    return m[key] || key;
  }

  function buildTerrainFromData() {
    const bedrockEvents = game.scenes.map(scene => ({
      scene_id: scene.id,
      timestamp: 0,
      vad: projectEmotionToVADContour(safeParseEmotion(scene.original_emotion)),
      alignment_score: 1.0,
      void_mismatch: !!(scene.void_info && scene.void_info.sceneVoid),
    })).map(ev => Object.assign(mapEventToRender(ev, game.anchors), { vad: ev.vad }));

    const globalEvents = game.plays.map(play => ({
      scene_id: play.scene_id,
      timestamp: play.created_at ? new Date(play.created_at).getTime() : Date.now(),
      vad: projectEmotionToVADContour(safeParseEmotion(play.user_emotion)),
      alignment_score: play.alignment != null ? play.alignment : 0.5,
      void_mismatch: play.mismatch_type === 'void_mismatch',
    })).map(ev => Object.assign(mapEventToRender(ev, game.anchors), { vad: ev.vad }));

    const layers = recomputeLayers(globalEvents, bedrockEvents);
    game.caches = {};
    for (let i = 0; i < layers.length; i++) {
      game.caches[layers[i].id] = bakeLayer(layers[i], i, game.anchors, BANDWIDTH);
    }
    game.agg = aggregateLayerCaches(game.caches, ENABLED_LAYERS);

    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    return pollution;
  }

  function renderContourCanvas() {
    const canvas = document.getElementById('contourCanvas');
    if (!canvas || !game.agg) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(2, Math.floor(rect.width * dpr));
    canvas.height = Math.max(2, Math.floor(rect.height * dpr));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const W = Math.floor(canvas.width), H = Math.floor(canvas.height);
    ctx.clearRect(0, 0, W, H);
    drawRaster(ctx, game.agg, W, H);
    const minH = game.agg.min, maxH = game.agg.max, range = (maxH - minH) || 1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function strokeContourPass(strokeStyle, lineW) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineW;
      for (let i = 1; i <= CONTOUR_LEVELS; i++) {
        const t = i / (CONTOUR_LEVELS + 1);
        const th = minH + range * t;
        const segs = marchingSquaresSegments(game.agg.heights, th);
        ctx.beginPath();
        segs.forEach(pair => {
          const p1 = toCanvas(pair[0], W, H), p2 = toCanvas(pair[1], W, H);
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        });
        ctx.stroke();
      }
    }
    strokeContourPass('rgba(12, 8, 22, 0.42)', 1.05 * dpr);
    strokeContourPass('rgba(232, 224, 252, 0.48)', 0.62 * dpr);
  }

  function vadToPercent(vad) {
    const gx = ((vad.v * HALF) / SIZE + 0.5) * (GRID - 1);
    const gz = ((vad.a * HALF) / SIZE + 0.5) * (GRID - 1);
    return {
      x: (gx / (GRID - 1)) * 100,
      y: (gz / (GRID - 1)) * 100,
    };
  }

  function buildPins() {
    game.pins = [];
    game.scenes.forEach((scene, idx) => {
      const emotion = safeParseEmotion(scene.original_emotion);
      const base = emotionToMapCoords(emotion);
      const spread = mapCoordsSpread(base.x, base.y, idx, scene.id);
      const isBridge = scene.scene_role === 'residual';
      const pinType = isBridge ? 'bridge' : 'core';
      const pinId = pinType + '-' + (scene.id != null ? scene.id : idx);
      const pinText = scene.text || scene.text_stage_1 || scene.text_stage_2 || '…';
      game.pins.push({
        id: pinId,
        type: pinType,
        sceneId: scene.id,
        sceneIndex: idx,
        memoryId: game.memoryId,
        role: scene.scene_role || 'anchor',
        mapX: spread.x,
        mapY: spread.y,
        x: spread.x * 100,
        y: spread.y * 100,
        text: pinText,
        label: isBridge ? '·' : ('#' + (scene.scene_order != null ? scene.scene_order : idx + 1)),
        originalEmotion: emotion,
        sceneOrder: scene.scene_order != null ? scene.scene_order : idx,
        state: 'locked',
        visited: false,
      });
    });
    const recent = game.plays.slice(-40);
    recent.forEach((pl, i) => {
      const vad = projectEmotionToVADContour(safeParseEmotion(pl.user_emotion));
      const p = vadToPercent(vad);
      const j = (i % 7) * 0.4;
      game.pins.push({
        id: 'echo-' + i + '-' + (pl.scene_id || i),
        type: 'echo',
        x: Math.max(2, Math.min(98, p.x + Math.sin(i * 1.7) * j)),
        y: Math.max(2, Math.min(98, p.y + Math.cos(i * 1.3) * j)),
        label: '',
        state: 'locked',
      });
    });
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vidx = game.scenes.findIndex(s => s.id === voidScene.id);
      game.pins.push({
        id: 'void-' + voidScene.id,
        type: 'voidPin',
        sceneId: voidScene.id,
        sceneIndex: vidx >= 0 ? vidx : 0,
        text: voidScene.text || voidScene.text_stage_1 || '…',
        originalEmotion: safeParseEmotion(voidScene.original_emotion),
        x: 88,
        y: 78,
        label: '∅',
        mapX: 0.88,
        mapY: 0.78,
        state: 'locked',
      });
    }
  }

  function finalizePinAccess() {
    syncPinStateFlags();
    applyPinVisualFlags();
  }

  function applyPinVisualFlags() {
    game.pins.forEach(pin => {
      pin.visited = false;
      pin.entrance = false;
      pin.active = false;
      pin.locked = false;
      if (pin.type === 'echo') {
        pin.locked = true;
        return;
      }
      if (pin.type === 'core' || pin.type === 'bridge') {
        pin.visited = !!game.visitedCore[pin.sceneId];
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
        return;
      }
      if (pin.type === 'voidPin') {
        pin.visited = !!(game.visitedCore[pin.sceneId]);
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
      }
    });
  }

  function renderPins() {
    const layer = document.getElementById('mapPinsLayer');
    if (!layer) return;
    layer.innerHTML = '';
    game.pins.forEach(pin => {
      const el = document.createElement('div');
      let cls = 'map-pin ' + pin.type;
      if (pin.active) cls += ' active';
      if (pin.entrance) cls += ' entrance';
      if (pin.visited) cls += ' visited';
      if (pin.locked) cls += ' locked';
      el.className = cls;
      el.style.left = pin.x + '%';
      el.style.top = pin.y + '%';
      if (pin.label) {
        const lb = document.createElement('div');
        lb.className = 'map-pin-label';
        lb.textContent = pin.label;
        el.appendChild(lb);
      }
      el.addEventListener('click', () => onPinClick(pin));
      layer.appendChild(el);
    });
  }

  function onPinClick(pin) {
    if (game.sealed) return;
    if (pin.locked) {
      LOG('pin locked');
      return;
    }
    if (pin.type === 'core') {
      enterSceneMode(pin);
    } else if (pin.type === 'bridge') {
      enterSceneMode(pin);
    } else if (pin.type === 'voidPin') {
      enterSceneMode(pin);
    }
  }

  const NPC_LINES = [
    '…그 감각의 잔향이, 지형에 남았습니다.',
    '기록은 스스로의 속도로 굳어집니다.',
    '말하지 않은 것도, 여기엔 무게가 있습니다.',
  ];

  function stopWave() {
    if (game.waveRaf) {
      cancelAnimationFrame(game.waveRaf);
      game.waveRaf = null;
    }
  }

  function startWaveLoop(rgb) {
    const canvas = document.getElementById('waveCanvas');
    if (!canvas) return;
    stopWave();
    const r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    function frame() {
      const ctx = canvas.getContext('2d');
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      const w = canvas.width, h = canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0a0a0e';
      ctx.fillRect(0, 0, w, h);
      game.waveT += 0.02;
      ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.35)';
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      const cy = h * 0.55;
      for (let x = 0; x <= w; x += 2) {
        const y = cy + Math.sin(x * 0.006 + game.waveT) * h * 0.08 + Math.sin(x * 0.014 + game.waveT * 0.7) * h * 0.04;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(' + Math.round(r * 200 + 40) + ',' + Math.round(g * 200 + 40) + ',' + Math.round(b * 200 + 60) + ',0.2)';
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const y = cy + Math.sin(x * 0.009 + game.waveT * 1.1) * h * 0.06;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      game.waveRaf = requestAnimationFrame(frame);
    }
    game.waveRaf = requestAnimationFrame(frame);
  }

  function clearTimers() {
    if (game.voidTimeout) {
      clearTimeout(game.voidTimeout);
      game.voidTimeout = null;
    }
    if (game.inputDeadline) {
      clearInterval(game.inputDeadline);
      game.inputDeadline = null;
    }
  }

  function enterSceneMode(pinOrId) {
    const pin = typeof pinOrId === 'string' ? game.pins.find(p => p.id === pinOrId) : pinOrId;
    if (!pin || (pin.type !== 'core' && pin.type !== 'bridge' && pin.type !== 'voidPin')) return;
    const scene = game.scenes.find(s => s.id === pin.sceneId);
    if (!scene) return;
    clearTimers();
    game.currentPinId = pin.id;
    game.currentSceneIndex = pin.sceneIndex;
    document.getElementById('mapMode').classList.remove('active');
    const sm = document.getElementById('sceneMode');
    sm.classList.add('active');
    const _ia = document.getElementById('emotionInputArea');
    _ia.style.opacity = '0';
    _ia.innerHTML = '';
    const tint = emotionVectorToRGB(pin.originalEmotion || safeParseEmotion(scene.original_emotion));
    startWaveLoop(tint);

    const textEl = document.getElementById('sceneText');
    textEl.textContent = '';
    const fullText = pin.text || scene.text || scene.text_stage_1 || '…';
    const _typeStart = performance.now();
    const _charMs = 28;
    (function _typeFrame(now) {
      const elapsed = now - _typeStart;
      const chars = Math.min(fullText.length, Math.floor(elapsed / _charMs) + 1);
      textEl.textContent = fullText.slice(0, chars);
      if (chars >= fullText.length) {
        setupEmotionInputByPinType(pin, scene);
        return;
      }
      requestAnimationFrame(_typeFrame);
    })(performance.now());

    document.getElementById('sceneNpc').textContent = '';
    document.getElementById('terrainClickHint').style.display = 'none';
    document.getElementById('terrainBar').classList.remove('clickable');
    renderTerrainBar(pin.sceneIndex, null);
  }

  function armTimers(scene) {
    clearTimers();
    const voidMs = (scene.void_info && scene.void_info.voidLevel === 'high') ? 12000 : 20000;
    game.voidTimeout = setTimeout(() => {
      LOG('void timeout → unsaid');
      leaveSceneUnsaid();
    }, voidMs);
  }

  function resetEmotionInputSkeleton() {
    const area = document.getElementById('emotionInputArea');
    area.innerHTML = EMOTION_INPUT_SKELETON;
  }

  function setupEmotionInputByPinType(pin, scene) {
    if (pin.type === 'core') {
      setupCoreInput(pin, scene);
      return;
    }
    if (pin.type === 'bridge') {
      setupBridgeInput(pin, scene);
      return;
    }
    resetEmotionInputSkeleton();
    setupEmotionUI(scene);
    document.getElementById('emotionInputArea').style.opacity = '1';
    document.getElementById('submitBtn').disabled = false;
    armTimers(scene);
  }

    inputArea.innerHTML = `
      <p style="font-size:13px;opacity:0.5;margin-bottom:12px;">이 장면을 읽고 무엇이 떠올랐나요?</p>
      <textarea id="coreTextInput" placeholder="자유롭게 쓰세요..."
        style="width:100%;background:rgba(196,168,130,0.05);border:1px solid rgba(196,168,130,0.15);
        color:#c4a882;font-family:inherit;font-size:15px;padding:12px;resize:none;border-radius:4px;min-height:80px;"></textarea>

    `;

            user_text: text,
          }),
        });

    const BRIDGE_CHIPS = [
      { label: 'guilt', key: 'guilt' },
      { label: 'fear', key: 'fear' },
      { label: 'anger', key: 'anger' },
      { label: 'sadness', key: 'sadness' },
      { label: 'longing', key: 'longing' },
      { label: 'relief', key: 'relief' },
      { label: 'confusion', key: 'confusion' },
      { label: 'emptiness', key: 'emptiness' },
    ];
    const CHIP_VECTORS = {
      guilt: { fear: 0.1, sadness: 0.3, anger: 0, joy: 0, longing: 0.1, guilt: 0.8 },
      fear: { fear: 0.8, sadness: 0.2, anger: 0, joy: 0, longing: 0, guilt: 0.1 },
      anger: { fear: 0.1, sadness: 0.1, anger: 0.8, joy: 0, longing: 0, guilt: 0 },
      sadness: { fear: 0, sadness: 0.8, anger: 0, joy: 0, longing: 0.3, guilt: 0.1 },
      longing: { fear: 0, sadness: 0.4, anger: 0, joy: 0.1, longing: 0.8, guilt: 0 },
      relief: { fear: 0, sadness: 0.1, anger: 0, joy: 0.5, longing: 0, guilt: 0.3 },
      confusion: { fear: 0.3, sadness: 0.2, anger: 0.1, joy: 0, longing: 0.1, guilt: 0.2 },
      emptiness: { fear: 0, sadness: 0.4, anger: 0, joy: 0, longing: 0.2, guilt: 0.1 },
    };
    const inputArea = document.getElementById('emotionInputArea');
    const selected = [];
    let html = '<p style="font-size:13px;opacity:0.5;margin-bottom:12px;">이 조각에서 어떤 감정이 느껴지나요? (1~2개)</p>';

    BRIDGE_CHIPS.forEach(chip => {
      html += `<button class="bridge-chip" data-key="${chip.key}"
        style="background:rgba(122,154,122,0.08);border:1px solid rgba(122,154,122,0.2);

        border-radius:20px;">${chip.label}</button>`;

    html += '</div>';
    html += `<button id="bridgeConfirmBtn" style="margin-top:12px;float:right;background:none;
      border:1px solid rgba(122,154,122,0.3);color:#7a9a7a;padding:8px 24px;cursor:pointer;
      font-family:inherit;font-size:13px;opacity:0;">확인</button>`;
    inputArea.innerHTML = html;
    inputArea.style.opacity = '1';
    inputArea.querySelectorAll('.bridge-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const idx = selected.indexOf(key);
        if (idx >= 0) {
          selected.splice(idx, 1);
          btn.style.background = 'rgba(122,154,122,0.08)';
          btn.style.borderColor = 'rgba(122,154,122,0.2)';
          btn.style.color = '#a0b8a0';

          selected.push(key);
          btn.style.background = 'rgba(122,154,122,0.25)';

      });

      const keys = ['fear', 'sadness', 'anger', 'joy', 'longing', 'guilt'];
      const blended = {};
      keys.forEach(k => { blended[k] = 0; });
      selected.forEach(chipKey => {
        const vec = CHIP_VECTORS[chipKey] || {};
        keys.forEach(k => { blended[k] += (vec[k] || 0) / selected.length; });
      });
      const userVector = {
        base: blended,
        reason_analysis: {
          attribution: 'unknown', core_fear: 'none', target: 'unknown',
          is_void: false, is_compound: selected.length > 1, emotions: selected,

  function setupEmotionUI(scene) {
    const chips = document.getElementById('emotionChips');
    const sliders = document.getElementById('sliderArea');
    const reasons = document.getElementById('reasonArea');
    chips.innerHTML = '';
    sliders.innerHTML = '';
    reasons.innerHTML = '';
    const orig = safeParseEmotion(scene.original_emotion);
    EMOTIONS_UI.forEach(def => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emotion-chip';
      b.textContent = def.label;
      b.dataset.key = def.key;
      if (orig[def.key] > 0.2) b.classList.add('selected');
      b.addEventListener('click', () => {
        b.classList.toggle('selected');
        validateSubmit();
      });
      chips.appendChild(b);
    });
    EMOTIONS_UI.forEach(def => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin:4px 0;';
      const lab = document.createElement('span');
      lab.style.cssText = 'font-size:0.75rem;color:#888;width:72px;';
      lab.textContent = def.label;
      const input = document.createElement('input');
      input.type = 'range';
      input.min = '0';
      input.max = '1';
      input.step = '0.05';
      input.dataset.key = def.key;
      input.value = String(orig[def.key] != null ? orig[def.key] : 0);
      input.style.width = '160px';
      input.addEventListener('input', validateSubmit);
      wrap.appendChild(lab);
      wrap.appendChild(input);
      sliders.appendChild(wrap);
    });
    REASONS.forEach(def => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emotion-chip';
      b.textContent = def.label;
      b.dataset.reason = def.key;
      b.addEventListener('click', () => {
        reasons.querySelectorAll('.emotion-chip').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        validateSubmit();
      });
      reasons.appendChild(b);
    });
    document.getElementById('submitBtn').onclick = () => submitScene(scene);
    const vb = document.getElementById('voidBtn');
    vb.disabled = false;
    vb.onclick = () => leaveSceneVoid(scene);
    validateSubmit();
  }

  function collectUserEmotionVector() {
    const vec = {};
    document.querySelectorAll('#sliderArea input[type="range"]').forEach(el => {
      const k = el.dataset.key;
      vec[k] = parseFloat(el.value) || 0;
    });
    return vec;
  }

  function collectReason() {
    const sel = document.querySelector('#reasonArea .emotion-chip.selected');
    return sel ? sel.dataset.reason : null;
  }

  function validateSubmit() {
    const vec = collectUserEmotionVector();
    const sum = Object.values(vec).reduce((a, b) => a + b, 0);
    document.getElementById('submitBtn').disabled = sum <= 0;
  }

  function leaveSceneUnsaid() {
    const scene = game.scenes[game.currentSceneIndex];
    if (!scene) return;
    game.skipCount++;
    const vec = {};
    EMOTIONS_UI.forEach(d => { vec[d.key] = 0; });
    const userVector = {
      base: vec,
      reason_analysis: { is_void: true, attribution: null, target: null, core_fear: null },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    finishScene(scene, result, vec, 'timeout_void', true);
  }

  function leaveSceneVoid(scene) {
    game.skipCount++;
    const vec = collectUserEmotionVector();
    const userVector = {
      base: vec,
      reason_analysis: { is_void: true, attribution: null, target: null, core_fear: null },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    finishScene(scene, result, vec, 'void', true);
  }

  function parseAnchorEmotions(scene) {
    let a = scene.anchor_emotions;
    if (typeof a === 'string') {
      try { a = JSON.parse(a); } catch (_) { a = null; }
    }
    if (Array.isArray(a) && a.length) return a.map(String);
    return null;
  }

  function submitScene(scene) {
    clearTimers();
    const vec = collectUserEmotionVector();
    const reasonKey = collectReason();
    const userVector = {
      base: vec,
      reason_analysis: {
        is_void: false,
        attribution: reasonKey ? reasonKeyToAttribution(reasonKey) : null,
        target: 'scene',
        core_fear: null,
      },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    game.emotionHistory.push(Object.assign({}, vec));
    finishScene(scene, result, vec, reasonKey || '', false);
  }

  function processEmotionResult(pin, scene, userVector) {
    clearTimers();
    const origVector = {
      base: pin.originalEmotion || safeParseEmotion(scene.original_emotion),
      reason_analysis: scene.original_reason_vector || null,
    };
    const engineResult = byeoriCalculateStep({
      userVector,
      originalVector: origVector,
      anchorEmotions: parseAnchorEmotions(scene),
    }, {
      previousBucket: game.previousBucket || null,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });

    pin.visited = true;
    pin.emotion_data = userVector;
    pin.engine_result = engineResult;
    game.visitedCore[pin.sceneId] = true;
    if (pin.type === 'core') game.coreVisitCount++;
    game.previousBucket = engineResult.alignment_bucket;
    if (userVector.base) game.emotionHistory.push(Object.assign({}, userVector.base));

    const baseEmotion = userVector.base || {};
    game.traces.push({
      pinType: pin.type,
      sceneId: pin.sceneId || scene.id,
      sceneText: scene.text || '',
      userVector,
      userEmotion: baseEmotion,
      alignment: engineResult.alignment_score,
      bucket: engineResult.alignment_bucket,
      pattern: engineResult.transition_pattern,
      mismatch: engineResult.mismatch_type,
      sceneIndex: pin.sceneIndex,
    });

    const pos = engineResult.affective_position;
    if (!game.emotionCursor) game.emotionCursor = { v: 0, a: 0, d: 0 };
    if (pos) {
      game.emotionCursor.v = game.emotionCursor.v * 0.3 + pos.v * 0.7;
      game.emotionCursor.a = game.emotionCursor.a * 0.3 + pos.a * 0.7;
      game.emotionCursor.d = (game.emotionCursor.d || 0) * 0.3 + (pos.d || 0) * 0.7;
      if (!game.emotionTrajectory) game.emotionTrajectory = [];
      game.emotionTrajectory.push({ ...game.emotionCursor });
    }

    const reasonLabel = userVector.reason_analysis?.attribution || '';
    insertPlay(scene, baseEmotion, reasonLabel, engineResult, !!userVector.reason_analysis?.is_void).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        renderContourCanvas();
        updateMapStatus();
        updateSealButton();
        LOG('engine', engineResult);
        setTimeout(() => {
          stopWave();
          document.getElementById('sceneMode').classList.remove('active');
          document.getElementById('mapMode').classList.add('active');
          buildPins();
          handleEmotionResult({
            userEmotion: baseEmotion,
            result: engineResult,
            originSceneId: scene.id,
          });
          finalizePinAccess();
          renderPins();
          startCursorLerp();
          game.currentSceneIndex = null;
          game.currentPinId = null;
        }, 1500);
      });
    });
  }

  function finishScene(scene, result, vec, reasonLabel, isVoid) {
    LOG('engine', result);
    game.lastResult = result;
    game.lastUserEmotion = Object.assign({}, vec);
    const rgb = emotionVectorToRGB(vec);
    game.lastTintRGB = rgb;
    const vad = projectEmotionToVADContour(vec);
    game.cursorTarget = vadToPercent(vad);

    insertPlay(scene, vec, reasonLabel, result, isVoid).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        renderContourCanvas();
        showPostSubmitNPC(result, rgb);
      });
    });
  }

  async function insertPlay(scene, vec, reasonLabel, result, isVoid) {
    const row = {
      memory_id: game.memoryId,
      scene_id: scene.id,
      user_emotion: vec,
      user_reason: isVoid ? 'void' : (reasonLabel || ''),
      alignment: result.alignment_score,
      mismatch_type: isVoid ? 'void_mismatch' : (result.mismatch_type || null),
      wave_data: null,
      layer_id: 0,
    };
    const { error } = await sb.from('plays').insert(row);
    if (error) LOG('plays insert error', error);
    else LOG('plays saved', row);
  }

  async function reloadPlaysOnly() {
    const { data, error } = await sb.from('plays')
      .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
      .eq('memory_id', game.memoryId)
      .order('created_at');
    if (!error) game.plays = data || [];
  }

  function showPostSubmitNPC(result, rgb) {
    const npc = document.getElementById('sceneNpc');
    npc.textContent = NPC_LINES[Math.floor(Math.random() * NPC_LINES.length)];
    renderTerrainBar(game.currentSceneIndex, rgb);
    document.getElementById('terrainBar').classList.add('clickable');
    document.getElementById('terrainClickHint').style.display = 'block';
    document.getElementById('emotionInputArea').style.opacity = '0.3';
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('voidBtn').disabled = true;

    const hint = document.querySelector('#terrainClickHint .hint-txt');
    hint.textContent = 'alignment ' + (result.alignment_score * 100).toFixed(0) + ' · ' + (result.alignment_bucket || '') + ' — 지형을 눌러 지도로';

    const goMap = () => {
      document.getElementById('terrainBar').removeEventListener('click', goMap);
      document.getElementById('terrainClickHint').removeEventListener('click', goMap);
      afterTerrainReturn(result);
    };
    document.getElementById('terrainBar').addEventListener('click', goMap);
    document.getElementById('terrainClickHint').addEventListener('click', goMap);
  }

  function afterTerrainReturn(result) {
    const scene = game.scenes[game.currentSceneIndex];
    const originSceneId = scene ? scene.id : null;
    stopWave();
    game.traces.push({ sceneIndex: game.currentSceneIndex, alignment: result.alignment_score });
    if (scene && !game.visitedCore[scene.id]) {
      game.visitedCore[scene.id] = true;
      game.coreVisitCount++;
    }
    document.getElementById('sceneMode').classList.remove('active');
    document.getElementById('mapMode').classList.add('active');
    document.getElementById('terrainBar').classList.remove('clickable');
    document.getElementById('terrainClickHint').style.display = 'none';
    buildTerrainFromData();
    buildPins();
    handleEmotionResult({
      userEmotion: game.lastUserEmotion || {},
      result: result || game.lastResult || {},
      originSceneId,
    });
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    updateMapStatus();
    updateSealButton();
    startCursorLerp();
    game.currentSceneIndex = null;
    game.currentPinId = null;
  }

  function renderTerrainBar(sceneIndex, tintRGB) {
    const canvas = document.getElementById('terrainCanvas');
    renderTerrainProfile(canvas, game.scenes, game.traces, sceneIndex, tintRGB);
  }

  function updateMapStatus() {
    const el = document.getElementById('mapStatus');
    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    el.textContent = '탐색: ' + game.coreVisitCount + '개 | 오염도: ' + pollution + '%';
  }

  function updateSealButton() {
    const btn = document.getElementById('sealBtn');
    if (!btn) return;
    btn.disabled = game.sealed || game.coreVisitCount < 3;
  }

  function startCursorLerp() {
    const cursor = document.getElementById('emotionCursor');
    if (!cursor) return;
    cursor.style.display = 'block';
    if (game.cursorRaf) cancelAnimationFrame(game.cursorRaf);
    function tick() {
      game.cursorPos.x += (game.cursorTarget.x - game.cursorPos.x) * 0.08;
      game.cursorPos.y += (game.cursorTarget.y - game.cursorPos.y) * 0.08;
      cursor.style.left = game.cursorPos.x + '%';
      cursor.style.top = game.cursorPos.y + '%';
      if (game.lastTintRGB) {
        cursor.style.boxShadow = '0 0 12px rgba(' + game.lastTintRGB[0] + ',' + game.lastTintRGB[1] + ',' + game.lastTintRGB[2] + ',0.45)';
      }
      game.cursorRaf = requestAnimationFrame(tick);
    }
    tick();
  }

  async function loadMemories() {
    const { data, error } = await sb.from('memories').select('id, title').order('id');
    if (error) throw error;
    game.memories = data || [];
    const sel = document.getElementById('memorySelect');
    sel.innerHTML = '';
    game.memories.forEach(m => {
      const op = document.createElement('option');
      op.value = m.id;
      op.textContent = (m.title || '(untitled)') + ' · ' + String(m.id).slice(0, 8) + '…';
      sel.appendChild(op);
    });
  }

  async function loadMemoryData(memoryId) {
    game.memoryId = memoryId;
    if (window.memoriesData) {
      const found = window.memoriesData.find(function(m) { return m.id === memoryId; });
      if (found) game.memoryTitle = found.title || '';
    }
    const scenesRes = await sb.from('scenes').select('*').eq('memory_id', memoryId).order('scene_order');
    const playsRes = await sb.from('plays')
      .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
      .eq('memory_id', memoryId)
      .order('created_at');
    if (scenesRes.error) throw scenesRes.error;
    if (playsRes.error) throw playsRes.error;
    game.scenes = scenesRes.data || [];
    game.plays = playsRes.data || [];

    if (!game.scenes.length && window._simulatedScenesMap && window._simulatedScenesMap[memoryId]) {
      LOG('Supabase scenes empty, using local fallback for', memoryId);
      game.scenes = window._simulatedScenesMap[memoryId].map(function(s) {
        return Object.assign({}, s, { memory_id: memoryId });
      });
    }
    if (!game.plays.length && window._simulatedPlaysMap && window._simulatedPlaysMap[memoryId]) {
      LOG('Supabase plays empty, using local fallback for', memoryId);
      game.plays = window._simulatedPlaysMap[memoryId];
    }
    game.visitedCore = {};
    game.coreVisitCount = 0;
    game.traces = [];
    game.previousBucket = null;
    game.emotionHistory = [];
    game.accessiblePinIds = null;
    game.lastUserEmotion = null;
    const pollution = buildTerrainFromData();
    buildPins();
    applyInitialAccess();
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    updateMapStatus();
    updateSealButton();
    LOG('loaded scenes', game.scenes.length, 'plays', game.plays.length, 'pollution', pollution);
  }

  function bindMapResize() {
    window.addEventListener('resize', () => {
      if (document.getElementById('mapMode').classList.contains('active')) renderContourCanvas();
    });
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const id = document.getElementById('memorySelect').value;
    if (!id) return;
    document.getElementById('selectScreen').style.display = 'none';
    document.getElementById('mapMode').classList.add('active');
    try {
      await loadMemoryData(id);
      startCursorLerp();
    } catch (e) {
      console.error(e);
      alert('로드 실패: ' + (e.message || e));
    }
  });
  document.getElementById('sealBtn').addEventListener('click', async () => {
    if (game.sealed || game.coreVisitCount < 3) return;
    game.sealed = true;
    document.getElementById('mapMode').classList.remove('active');
    const rev = document.getElementById('revealScreen');
    rev.classList.add('active');
    document.getElementById('revealTitle').textContent = '기억을 재구성하고 있습니다...';
    document.getElementById('revealBody').textContent = '';
    const avgAlign = game.traces.length
      ? game.traces.reduce((s, t) => s + t.alignment, 0) / game.traces.length
      : 0;
    const visits = game.traces.map((t, i) => ({
      pin_type: t.pinType || 'core',
      scene_id: t.sceneId,
      scene_text: t.sceneText || '',
      order: i + 1,
      emotion_data: t.userVector || { base: t.userEmotion || {} },
      engine_result: { alignment_score: t.alignment, alignment_bucket: t.bucket || 'MID', transition_pattern: t.pattern || 'bridge', mismatch_type: t.mismatch || null }
    }));
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/generate-reveal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ visits, memory_title: game.memoryTitle || '', emotion_trajectory: game.emotionTrajectory || [] })
      });
      const data = await res.json();
      if (data.narrative) {
        document.getElementById('revealTitle').textContent = 'Memory sealed';
        document.getElementById('revealBody').textContent = data.narrative;
      } else {
        document.getElementById('revealTitle').textContent = 'Memory sealed';
        document.getElementById('revealBody').textContent = '이 기억은 더 이상 열리지 않을 수 있습니다. 남겨진 파동은 흙 아래로 가라앉습니다.';
      }
    } catch (e) {
      console.error('Reveal error:', e);
      document.getElementById('revealTitle').textContent = 'Memory sealed';
      document.getElementById('revealBody').textContent = '이 기억은 더 이상 열리지 않을 수 있습니다. 남겨진 파동은 흙 아래로 가라앉습니다.';
    }
    document.getElementById('revealStats').textContent =
      '평균 정렬도: ' + (avgAlign * 100).toFixed(1) + '% · 코어 방문 ' + game.coreVisitCount + '회';

    const _urlParams = new URLSearchParams(window.location.search);
    const _fromDemo = _urlParams.get('memory');
    if (_fromDemo) {
      document.getElementById('revealRestart').style.display = 'none';
      const continueBtn = document.createElement('button');
      continueBtn.textContent = 'Continue';
      continueBtn.className = 'action-btn';
      continueBtn.style.marginTop = '1.5rem';
      continueBtn.addEventListener('click', () => {
        try {
          localStorage.setItem('tem_play_traces', JSON.stringify(game.traces));
          localStorage.setItem('tem_play_memory_id', game.memoryId || _fromDemo);
          localStorage.setItem('tem_play_memory_title', game.memoryTitle || '');
        } catch (e) {
          console.warn('localStorage save failed:', e);
        }
        window.location.href = '/index.html?strata=1&memory=' + encodeURIComponent(_fromDemo);
      });
      const restartBtn = document.getElementById('revealRestart');
      restartBtn.parentNode.insertBefore(continueBtn, restartBtn.nextSibling);
    }
  });

  document.getElementById('revealRestart').addEventListener('click', () => {
    location.reload();
  });

  (async function init() {
    bindMapResize();
    const urlParams = new URLSearchParams(window.location.search);
    const urlMemoryId = urlParams.get('memory');

    if (urlMemoryId) {
      document.getElementById('selectScreen').style.display = 'none';
      document.getElementById('mapMode').classList.add('active');
      try {
        await loadMemoryData(urlMemoryId);
        startCursorLerp();
      } catch (e) {
        console.error(e);
        alert('로드 실패: ' + (e.message || e));
      }
    } else {
      try {
        await loadMemories();
      } catch (e) {
        console.error(e);
      }
    }
  })();

  </script>
</body>
</html>
