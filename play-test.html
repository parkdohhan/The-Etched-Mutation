<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEM — Play Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/data/memories.js"></script>
  <script src="js/contamination.js"></script>
  <script src="js/shared/tem_af_strata_terrain.js"></script>
  <script src="js/ui/strataSection.js"></script>
  <script src="js/ui/floatingAnchor.js"></script>
  <style>
    :root {
      --bg-deep: #0a0a0c;
      --text-primary: #e8e4df;
      --text-muted: #6b6b7b;
      --accent-memory: #c4a882;
      --bg-surface: rgba(15, 15, 20, 0.95);
      --ghost: rgba(196, 168, 130, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0a0a0e; color: var(--text-primary); font-family: 'Noto Serif KR', 'Cormorant Garamond', serif; }
    #selectScreen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0e; }
    #mapMode {
      position: fixed; inset: 0; background: #0a0a0e; display: none; flex-direction: column; z-index: 50;
    }
    #mapMode.active { display: flex; }
    .map-canvas-area { flex: 1; position: relative; min-height: 0; }
    #contourCanvas { width: 100%; height: 100%; display: block; }
    .map-pins-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .map-pin {
      position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
      border-radius: 50%; transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .map-pin.core { width: 16px; height: 16px; border: 2px solid var(--accent-memory); background: rgba(232, 228, 220, 0.95); }
    .map-pin.core.active { box-shadow: 0 0 14px rgba(196,168,130,0.6); }
    .map-pin.echo { width: 7px; height: 7px; background: rgba(180, 160, 200, 0.85); border: 1px solid rgba(200, 180, 220, 0.5); }
    .map-pin.bridge {
      width: 12px; height: 12px; border: 1.5px solid #7a9a7a; background: rgba(122, 154, 122, 0.22);
      box-shadow: 0 0 12px rgba(122,154,122,0.5);
    }
    .map-pin.bridge.active { box-shadow: 0 0 12px rgba(122,154,122,0.5); }
    .map-pin.voidPin { width: 11px; height: 11px; background: transparent; border: 1.5px dashed rgba(200, 150, 140, 0.6); }
    .map-pin.active { box-shadow: 0 0 16px rgba(196, 168, 130, 0.55); opacity: 1; }
    .map-pin.current { box-shadow: 0 0 22px rgba(255, 220, 180, 0.8); }
    /* 방문한 핀: 뚜렷한 시각 구분 — 속이 비고 테두리만 남음 */
    .map-pin.visited { opacity: 0.6; background: transparent !important; }
    .map-pin.visited.core { border-color: rgba(160, 150, 140, 0.5); border-style: solid; }
    .map-pin.visited.bridge { border-color: rgba(122, 154, 122, 0.35); background: transparent; box-shadow: none; }
    .map-pin.visited::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; background: rgba(160, 150, 140, 0.6);
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    .map-pin.locked { opacity: 0.38; pointer-events: none; filter: grayscale(0.35); }
    .map-pin:not(.locked):not(.echo):hover {
      transform: translate(-50%, -50%) scale(1.35);
      box-shadow: 0 0 18px rgba(196, 168, 130, 0.7);
      filter: brightness(1.3);
      z-index: 10;
    }
    .map-pin.entrance { animation: entrancePulse 1.5s ease-in-out infinite; }
    @keyframes entrancePulse {
      0% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
      50% { box-shadow: 0 0 22px rgba(196, 168, 130, 0.65); transform: translate(-50%, -50%) scale(1.15); }
      100% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
    }
    .map-pin.unlocking { animation: pinUnlock 0.5s ease forwards; }
    .map-pin.locking { animation: pinLock 0.5s ease forwards; }
    @keyframes pinUnlock {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes pinLock { from { opacity: 1; } to { opacity: 0.06; } }
    /* ── 패턴별 unlock 애니메이션 ── */
    .map-pin.unlock-bridge { animation: unlockBridge 1s ease-out forwards; }
    @keyframes unlockBridge {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0); box-shadow: 0 0 0 0 rgba(196,168,130,0); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); box-shadow: 0 0 20px 4px rgba(196,168,130,0.5); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(196,168,130,0.3); }
    }
    .map-pin.unlock-contradiction { animation: unlockContradiction 0.8s ease-out forwards; }
    @keyframes unlockContradiction {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(2); box-shadow: 0 0 30px 8px rgba(200,80,80,0.6); filter: brightness(2); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.8); filter: brightness(1.2); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(200,80,80,0.3); filter: none; }
    }
    .map-pin.unlock-displacement { animation: unlockDisplacement 1s ease-out forwards; }
    @keyframes unlockDisplacement {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      15% { opacity: 0.7; transform: translate(-44%,-56%) scale(1.1); box-shadow: 0 0 16px rgba(160,120,200,0.5); }
      30% { transform: translate(-56%,-44%) scale(0.9); }
      50% { transform: translate(-47%,-53%) scale(1.05); }
      70% { transform: translate(-53%,-47%) scale(0.97); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 10px rgba(160,120,200,0.2); }
    }
    .map-pin.unlock-avoidance { animation: unlockAvoidance 2s ease-out forwards; }
    @keyframes unlockAvoidance {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
      60% { opacity: 0.2; }
      80% { opacity: 0.5; }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 6px rgba(196,168,130,0.15); }
    }
    .map-pin.unlock-echo_follow { animation: unlockEchoFollow 1s ease-out forwards; }
    @keyframes unlockEchoFollow {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0); box-shadow: 0 0 0 0 rgba(196,168,130,0); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); box-shadow: 0 0 24px 6px rgba(196,168,130,0.6); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 12px rgba(196,168,130,0.3); }
    }
    /* ── 핀 호버 카드 (또다른 나의 속삭임) ── */
    .pin-hover-card {
      position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
      width: max-content; max-width: 160px; padding: 6px 10px;
      font-family: 'Cormorant Garamond', serif; font-size: 0.72rem; font-style: italic;
      line-height: 1.4; letter-spacing: 0.03em; color: rgba(200, 195, 210, 0.85);
      background: rgba(18, 18, 26, 0.92); border: 1px solid rgba(120, 120, 140, 0.25);
      border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
      white-space: normal; z-index: 20;
    }
    .pin-hover-card.visited-card {
      color: rgba(160, 150, 140, 0.75); border-color: rgba(140, 130, 120, 0.3);
    }
    .map-pin:not(.locked):not(.echo):hover .pin-hover-card { opacity: 1; }
    .pin-hover-card.flip-left { left: auto; right: calc(100% + 8px); }
    .pin-hover-card .whisper-label {
      font-size: 0.6rem; color: rgba(196, 168, 130, 0.5); letter-spacing: 0.08em; margin-bottom: 2px;
      font-style: normal;
    }
    .map-pin-label { position: absolute; left: 14px; top: -6px; font-size: 10px; color: rgba(200, 190, 220, 0.7); white-space: nowrap; font-style: italic; pointer-events: none; }
    .emotion-cursor {
      position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(196, 168, 130, 0.15);
      transform: translate(-50%, -50%); pointer-events: none; animation: cursorPulse 2s infinite; z-index: 1;
    }
    @keyframes cursorPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    }
    .map-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem;
      border-top: 1px solid rgba(196, 168, 130, 0.12); background: rgba(8, 8, 12, 0.92);
    }
    .map-status { font-size: 0.75rem; color: rgba(200, 195, 210, 0.65); letter-spacing: 0.04em; }
    .seal-btn {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.45rem 1rem; border-radius: 6px; border: 1px solid rgba(200, 180, 230, 0.35);
      background: rgba(60, 45, 85, 0.45); color: rgba(232, 224, 252, 0.35); cursor: not-allowed;
    }
    .seal-btn:not(:disabled) { color: rgba(248, 240, 255, 0.95); background: rgba(100, 70, 130, 0.55); cursor: pointer; border-color: rgba(210, 190, 255, 0.55); }

    #sceneMode { display: none; position: fixed; inset: 0; background: var(--bg-deep); z-index: 50; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
    #sceneMode.active { display: flex; opacity: 1; }
    .wave-top { width: 100%; min-height: 140px; max-height: 220px; position: relative; overflow: hidden; flex-shrink: 0; background: var(--bg-deep); transition: box-shadow 0.4s ease-in; }
    .wave-top.wave-draining { /* box-shadow set dynamically via JS */ }
    .play-alignment-header {
      display: flex; align-items: baseline; justify-content: space-between; padding: 0.55rem 1rem 0.15rem;
      border-bottom: 1px solid rgba(196, 168, 130, 0.12);
    }
    .play-alignment-label { font-size: 0.72rem; color: rgba(200, 195, 210, 0.55); letter-spacing: 0.12em; text-transform: uppercase; }
    .play-alignment-pct {
      font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; color: var(--accent-memory);
    }
    .play-alignment-sub {
      font-size: 0.62rem; color: rgba(180, 175, 195, 0.45); letter-spacing: 0.08em;
      padding: 0 1rem 0.35rem;
    }
    .alignment-wave-container {
      width: 100%; height: 120px; background: var(--bg-deep); position: relative; overflow: hidden;
    }
    .alignment-wave-container canvas.alignment-wave-canvas { width: 100%; height: 100%; display: block; transform: scale(1.15); transform-origin: center center; }
    .scene-content-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1rem; overflow-y: auto; }
    .scene-main { width: 100%; max-width: 560px; text-align: center; }
    #sceneNpc { font-family: 'Cormorant Garamond', serif; font-style: italic; color: rgba(196, 168, 130, 0.5); font-size: 0.9rem; min-height: 1.2em; margin-bottom: 0.8rem; }
    #sceneText { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; line-height: 2; letter-spacing: 0.03em; color: var(--text-primary); margin-bottom: 1.5rem; }
    #emotionInputArea { opacity: 0; transition: opacity 0.6s; }
    #emotionInputArea.warn-border { box-shadow: 0 0 0 1px rgba(196, 168, 130, 0.15); border-radius: 8px; padding: 8px; }
    .emotion-chip {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.35); color: #ccc;
      padding: 10px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; cursor: pointer; transition: all 0.3s;
      border-radius: 4px; user-select: none; margin: 3px;
    }
    .emotion-chip:hover { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.08); }
    .emotion-chip.selected { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.1); }
    .action-btn {
      background: rgba(196, 168, 130, 0.1); border: 1px solid rgba(196, 168, 130, 0.25); color: #e8e4df;
      padding: 8px 24px; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; cursor: pointer; border-radius: 4px;
    }
    .action-btn:disabled { opacity: 0.3; cursor: default; }
    .action-btn.void { background: transparent; border-color: rgba(200, 150, 140, 0.3); color: rgba(200, 150, 140, 0.7); font-style: italic; }
    .typing::after { content: '|'; animation: blink 500ms step-end infinite; color: rgba(196, 168, 130, 0.6); }
    @keyframes blink { 50% { opacity: 0; } }

    #terrainBar {
      width: 100%; height: 120px; position: relative; flex-shrink: 0;
      border-top: none;
      background: #09090d;
      box-shadow: none;
      transition: box-shadow 0.5s ease-out;
    }
    #terrainBar.terrain-absorbing { /* box-shadow set dynamically via JS */ }
    #terrainBar.awaiting-terrain { animation: none; }
    @keyframes terrainBarGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
      50% { box-shadow: 0 -6px 24px rgba(100, 140, 200, 0.12); }
    }
    #terrainCanvas {
      width: 100%; height: 100%; display: block;
      pointer-events: none;
      vertical-align: top;
    }
    #terrainCanvas.clickable {
      pointer-events: auto !important;
      cursor: pointer;
      opacity: 0.98;
      transition: opacity 0.2s;
      filter: none;
    }
    #terrainCanvas.clickable:hover {
      opacity: 1;
      filter: none;
    }
    #terrainClickHint { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    /* 힌트를 하단(밀폐 fill의 직선과 겹침)이 아니라 상단·곡선 근처로 — 지형 stroke와 시각적으로 연결 */
    #terrainClickHint .hint-txt {
      position: absolute;
      top: 6px;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      color: rgba(200, 210, 235, 0.55);
      letter-spacing: 0.04em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      max-width: 96%;
      text-align: center;
      pointer-events: none;
    }

    #revealScreen {
      display: none; position: fixed; inset: 0; z-index: 60; background: #08080c; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    #revealScreen.active { display: flex; }
    #revealScreen h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 0.06em; color: var(--text-primary); }
    #revealScreen p { max-width: 520px; line-height: 1.8; color: rgba(220, 215, 230, 0.85); font-size: 0.95rem; }

    /* ================================================================
       STRATA — overlay HUD styles (copied from css/index.css minimal)
       ================================================================ */
    .strata-hud { position: fixed; z-index: 100; pointer-events: none; }
    .strata-h-tl { top: 20px; left: 28px; }
    .strata-h-tr {
      top: 20px; right: 28px; text-align: right; font-size: 11px;
      color: rgba(196, 168, 130, 0.4); line-height: 1.8; font-style: italic;
    }
    .strata-h-bl { bottom: 20px; left: 28px; }
    .strata-h-br { bottom: 20px; right: 28px; pointer-events: auto; }
    .strata-h-br input,
    .strata-h-br button,
    .strata-h-br select { pointer-events: auto; }
    .strata-tsm {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(196, 168, 130, 0.4); font-weight: 300;
    }
    .strata-tlg { font-size: 22px; letter-spacing: 8px; color: #c4a882; font-weight: 300; margin-top: 4px; }
    .strata-dlb { font-size: 10px; letter-spacing: 2px; color: rgba(196, 168, 130, 0.4); text-transform: uppercase; }
    .strata-dvl { font-size: 14px; color: #c4a882; font-weight: 300; margin-top: 2px; line-height: 1.5; }
    .strata-ct { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(196, 168, 130, 0.4); }
    .strata-ct-tk { width: 80px; height: 2px; background: rgba(196, 168, 130, 0.08); }
    .strata-ct-fl { height: 100%; background: #c4a882; transition: width 0.6s; }
    .strata-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 9px; letter-spacing: 3px;
      color: rgba(196, 168, 130, 0.12); text-transform: uppercase;
      animation: strata-pulse 4s ease-in-out infinite; pointer-events: none;
    }
    @keyframes strata-pulse { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.25; } }
    .strata-grain {
      position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0.018;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E") repeat;
      background-size: 256px;
    }
    /* ── "또다른 나" whisper ── */
    .another-me-label {
      display: block; font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(196,168,130,0.35);
      margin-bottom: 0.25rem; font-family: 'Cormorant Garamond', serif; font-style: normal;
    }
    .another-me-whisper { animation: whisper-in 0.8s ease-out; }
    @keyframes whisper-in {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ── 모바일/태블릿 핀 크기 확대 ── */
    @media (max-width: 768px) {
      .map-pin.core { width: 22px; height: 22px; border-width: 2.5px; }
      .map-pin.bridge { width: 16px; height: 16px; border-width: 2px; }
      .map-pin.voidPin { width: 15px; height: 15px; border-width: 2px; }
      .map-pin.echo { width: 9px; height: 9px; }
      .map-pin.visited::after { width: 5px; height: 5px; }
      .map-pin-label { font-size: 11px; left: 18px; }
      .pin-hover-card { max-width: 140px; font-size: 0.68rem; padding: 5px 8px; }
    }
    @media (max-width: 480px) {
      .map-pin.core { width: 26px; height: 26px; border-width: 3px; }
      .map-pin.bridge { width: 20px; height: 20px; border-width: 2.5px; }
      .map-pin.voidPin { width: 18px; height: 18px; border-width: 2.5px; }
      .map-pin.echo { width: 10px; height: 10px; }
      .map-pin.visited::after { width: 6px; height: 6px; }
      .map-pin-label { font-size: 12px; left: 22px; }
    }
  </style>
</head>
<body>
  <div id="selectScreen">
    <h1 style="font-family:'Cormorant Garamond',serif;color:#e8e4df;font-size:2rem;font-weight:400;letter-spacing:0.05em;margin-bottom:2rem;">The Etched Mutation</h1>
    <select id="memorySelect" style="background:#111;color:#e8e4df;border:1px solid rgba(196,168,130,0.3);padding:0.6rem 1.2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;border-radius:4px;margin-bottom:1rem;min-width:250px;"></select>
    <button id="startBtn" type="button" style="background:transparent;border:1px solid rgba(196,168,130,0.3);color:#c4a882;padding:0.6rem 2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;cursor:pointer;border-radius:4px;letter-spacing:0.05em;">Enter the memory</button>
  </div>

  <div id="mapMode">
    <div class="map-canvas-area" id="mapCanvasArea">
      <canvas id="contourCanvas"></canvas>
      <svg id="mapTraceLayer" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;"></svg>
      <div class="map-pins-layer" id="mapPinsLayer"></div>
      <div class="emotion-cursor" id="emotionCursor" style="display:none;"></div>
    </div>
    <div class="map-bar">
      <span class="map-status" id="mapStatus"></span>
      <button type="button" class="seal-btn" id="sealBtn" disabled></button>
    </div>
  </div>

  <div id="sceneMode">
    <div class="wave-top" id="waveTop">
      <div class="play-alignment-header">
        <span class="play-alignment-label">Alignment</span>
        <span class="play-alignment-pct" id="playAlignmentPct">00%</span>
      </div>
      <div class="play-alignment-sub">각인(상) · 나의 응답(하)</div>
      <div class="alignment-wave-container">
        <canvas class="alignment-wave-canvas" id="alignmentWaveCanvas"></canvas>
      </div>
    </div>
    <div class="scene-content-area">
      <div class="scene-main">
        <div id="sceneNpc"></div>
        <div id="sceneText"></div>
        <div id="emotionInputArea">
          <div id="emotionChips" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;"></div>
          <div id="sliderArea" style="margin-bottom:12px;"></div>
          <div id="reasonArea" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;"></div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button type="button" id="submitBtn" class="action-btn" disabled></button>

  const LOG = (...a) => console.log('[play-test]', ...a);

  const SFX = {
    ambient: null,

    _loaded: false,
  };

  function initAudio() {
    if (SFX._loaded) return;
    SFX._loaded = true;

    function makeAudio(src, loop, vol) {
      const a = new Audio(src);
      a.loop = !!loop;
      a.volume = vol || 0;
      a.preload = 'auto';
      a.addEventListener('error', () => { a._broken = true; });
      return a;
    }

    SFX.ambient = makeAudio('sounds/ambient-opening.mp3', true, 0);
    SFX.white = makeAudio('sounds/Base_white.mp3', true, 0);
    SFX.void = makeAudio('sounds/Base_Void.mp3', false, 0);
    SFX.rain = makeAudio('sounds/Rain_indoor.mp3', true, 0);
    SFX.footstep = makeAudio('sounds/footstep.mp3', false, 0.4);
  }

  function playOnce(audio) {
    if (!audio || audio._broken) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }

  function fadeIn(audio, targetVol, durationMs) {
    if (!audio || audio._broken) return;
    audio.volume = 0;
    audio.play().catch(() => {});
    const steps = 20;
    const stepMs = durationMs / steps;
    const stepVol = targetVol / steps;
    let current = 0;
    const interval = setInterval(() => {
      current += stepVol;
      if (current >= targetVol) {
        audio.volume = targetVol;
        clearInterval(interval);
      } else {
        audio.volume = current;
      }
    }, stepMs);
  }

  function fadeOut(audio, durationMs, pauseAfter) {
    if (!audio || audio._broken || audio.paused) return;
    const startVol = audio.volume;
    const steps = 20;
    const stepMs = durationMs / steps;
    const stepVol = startVol / steps;
    let current = startVol;
    const interval = setInterval(() => {
      current -= stepVol;
      if (current <= 0) {
        audio.volume = 0;
        if (pauseAfter) audio.pause();
        clearInterval(interval);
      } else {
        audio.volume = current;
      }
    }, stepMs);
  }

  function stopAll() {
    ['ambient', 'white', 'void', 'rain', 'footstep'].forEach((key) => {
      const a = SFX[key];
      if (a && a.pause) { a.pause(); a.volume = 0; }
    });
  }

  function typeRevealText(el, text) {
    el.textContent = '';
    let i = 0;
    const speed = 22;
    function tick() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        requestAnimationFrame(() => setTimeout(tick, speed));
      }
    }
    tick();
  }

  function safeParseEmotion(val) {
    if (!val) return {};
    if (typeof val === 'object' && !Array.isArray(val)) return val;
    if (typeof val === 'string') { try { return JSON.parse(val); } catch (_) { return {}; } }
    return {};
  }

  const PT_EMOTION_COLORS = {
    fear: [100, 80, 180], sadness: [80, 100, 160], anger: [200, 80, 80], joy: [200, 180, 100], longing: [80, 180, 180],
    guilt: [150, 130, 100], shame: [160, 100, 130], numbness: [90, 90, 110], isolation: [70, 90, 130],
    emptiness: [90, 90, 110], confusion: [120, 100, 140], relief: [140, 180, 120],
  };

  function getDominantColor(emotionBase) {
    if (!emotionBase || typeof emotionBase !== 'object') return [120, 120, 140];
    let maxKey = 'sadness';
    let maxVal = 0;
    Object.entries(emotionBase).forEach(([k, v]) => {
      const n = Number(v) || 0;
      if (n > maxVal) {
        maxVal = n;
        maxKey = k;
      }
    });
    return PT_EMOTION_COLORS[maxKey] || [120, 120, 140];
  }

  // ── 핀 호버 속삭임 (또다른 나) ──
  var PIN_WHISPERS = {
    visited: {
      ko: ['이미 지나온 기억이야', '네 발자국이 남아있다', '한번 걸었던 길이야'],

    },

      en: ['...deep', '...something heavy has sunk here', '...the bottom is not visible']

  };

  function getWhisperText(pin) {
    var pool = LANG === 'ko' ? 'ko' : 'en';
    if (pin.visited) {
      var arr = PIN_WHISPERS.visited[pool];
      return arr[Math.floor(Math.random() * arr.length)];
    }
    var scenePlayCount = game.plays.filter(function (p) { return p.scene_id === pin.sceneId; }).length;
    var scene = game.scenes.find(function (s) { return s.id === pin.sceneId; });
    var baseEmo = scene ? safeParseEmotion(scene.original_emotion) : {};
    var maxIntensity = 0;
    Object.values(baseEmo).forEach(function (v) { var n = Number(v) || 0; if (n > maxIntensity) maxIntensity = n; });

    var category;
    if (maxIntensity > 0.7) category = 'unvisited_deep';
    else if (scenePlayCount >= 3) category = 'unvisited_warm';
    else category = 'unvisited_cold';

    var arr = PIN_WHISPERS[category][pool];
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function lerpRgb(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ];
  }

  function lerpNumber(a, b, t) {
    return a + (b - a) * t;
  }

  function makeWaveProfile(overrides) {
    return Object.assign({
      amp1: 0.08,
      amp2: 0.04,
      amp3: 0.045,
      freq1: 0.006,
      freq2: 0.014,
      freq3: 0.011,
      speedMul: 1,
      jitter: 0,
      alphaMul: 1,
    }, overrides || {});
  }

  function lerpWaveProfile(fromP, toP, t) {
    const a = fromP || makeWaveProfile();
    const b = toP || makeWaveProfile();
    return {
      amp1: lerpNumber(a.amp1, b.amp1, t),
      amp2: lerpNumber(a.amp2, b.amp2, t),
      amp3: lerpNumber(a.amp3, b.amp3, t),
      freq1: lerpNumber(a.freq1, b.freq1, t),
      freq2: lerpNumber(a.freq2, b.freq2, t),
      freq3: lerpNumber(a.freq3, b.freq3, t),
      speedMul: lerpNumber(a.speedMul, b.speedMul, t),
      jitter: lerpNumber(a.jitter, b.jitter, t),
      alphaMul: lerpNumber(a.alphaMul, b.alphaMul, t),
    };
  }

  function emotionVectorToWaveStylePT(emotionVector) {
    const ev = (emotionVector && typeof emotionVector === 'object') ? emotionVector : {};
    const total = Object.values(ev).reduce((a, b) => a + (Number(b) || 0), 0);
    const intensity = Math.max(0, Math.min(1, total / 6));
    let dominant = 'sadness';
    let maxVal = -1;
    Object.entries(ev).forEach(([k, v]) => {
      const n = Number(v) || 0;
      if (n > maxVal) {
        maxVal = n;
        dominant = k;
      }
    });
    const colors = {
      fear: [100, 80, 180],
      sadness: [80, 100, 160],
      anger: [200, 80, 80],
      joy: [200, 180, 100],
      longing: [80, 180, 180],
      guilt: [150, 130, 100],
      shame: [160, 100, 130],
      numbness: [90, 90, 110],
      isolation: [70, 90, 130],
      confusion: [120, 100, 140],
    };
    return {
      color: colors[dominant] || colors.sadness,
      speed: 0.3 + intensity * 0.9,
      amplitude: 30 + intensity * 50,
      frequency: 0.008 + intensity * 0.012,
      chaos: 0.1 + intensity * 0.7,
      dominant,
      intensity,
    };
  }

  function buildWaveProfileFromEmotion(emotionBase, bucket) {
    const style = emotionVectorToWaveStylePT(emotionBase || {});
    const ampNorm = Math.max(0.05, Math.min(0.2, style.amplitude / 400));
    let p = makeWaveProfile({
      amp1: ampNorm,
      amp2: ampNorm * 0.42,
      amp3: ampNorm * 0.33,
      freq1: style.frequency * 0.9,
      freq2: style.frequency * 2.3,
      freq3: style.frequency * 0.4,
      speedMul: Math.max(0.65, Math.min(1.8, style.speed * 2.1)),
      jitter: style.chaos * 2.6,
      alphaMul: 0.92 + style.intensity * 0.2,
    });
    if (style.dominant === 'numbness' || style.dominant === 'emptiness' || style.dominant === 'isolation') {
      p = makeWaveProfile(Object.assign({}, p, {
        amp1: p.amp1 * 0.65,
        amp2: p.amp2 * 0.55,
        amp3: p.amp3 * 0.5,
        speedMul: p.speedMul * 0.72,
        jitter: p.jitter * 0.45,
      }));
    }
    if (bucket === 'LOW') {
      p = makeWaveProfile(Object.assign({}, p, { speedMul: p.speedMul * 1.15, jitter: p.jitter + 0.9 }));
    } else if (bucket === 'HIGH') {
      p = makeWaveProfile(Object.assign({}, p, { speedMul: p.speedMul * 0.95, alphaMul: p.alphaMul * 1.08 }));
    } else if (bucket === 'FIXATED') {
      p = makeWaveProfile(Object.assign({}, p, { speedMul: p.speedMul * 0.6, amp2: p.amp2 * 0.68, jitter: p.jitter * 0.42 }));
    }
    return p;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  const DEFAULT_ANCHOR_KEYS = ['fear','sadness','anger','guilt','shame','isolation','numbness','moral_pain','helplessness','despair','joy','hope','relief','gratitude','love','peace','comfort','longing','nostalgia','acceptance','confusion'];

      void_rupture: voidM ? Math.max(0.3, deviation) : 0,
      erosion: Math.min(1, erosion),
      intensity: 0.5 + align * 0.5,
      _alignment: align,
    };
  }

  function recomputeLayers(events, bedrockEvents) {
    const now = Date.now();
    const layers = LAYER_DEFS.map(def => {
      const l = Object.assign({}, def, { events: [] });
      if (def.id === 'bedrock') l.events = bedrockEvents.slice();
      else {
        const minAge = def.windowDays[0] * DAY_MS, maxAge = def.windowDays[1] * DAY_MS;
        l.events = events.filter(ev => {
          const age = now - ev.timestamp;
          return age >= minAge && age < maxAge;
        });
      }
      let totalPoll = 0;
      l.events.forEach(ev => { totalPoll += (1 - (ev._alignment || 0.5)); });
      l.pollution = l.events.length ? totalPoll / l.events.length : 0;
      if (l.events.length > 0) {
        let avgA = 0;
        l.events.forEach(ev => { avgA += Math.abs((ev.vad && ev.vad.a) || 0); });
        avgA /= l.events.length;
        l.thickness *= (1.0 + avgA * 0.6);
      }
      return l;
    });
    const totalPlayEvents = events.length;
    const bedrockLayer = layers[layers.length - 1];
    bedrockLayer.compaction = 1.0 / (1.0 + totalPlayEvents * 0.1);
    bedrockLayer.opacity = Math.max(0.30, 0.95 - totalPlayEvents * 0.02);
    if (totalPlayEvents === 0) bedrockLayer.thickness = Math.max(bedrockLayer.thickness, 3.5);
    return layers;
  }

  function bakeLayer(layer, li, anchors, bandwidthScale) {
    const comp = layer.compaction, opa = layer.opacity, events = layer.events || [];
    const total = GRID * GRID;
    const heights = new Float32Array(total);
    const colors = new Float32Array(total * 3);
    const pollField = new Float32Array(total);
    const domIdx = new Int16Array(total).fill(-1);
    const domScore = new Float32Array(total);
    const anchorKeys = Object.keys(anchors);

    for (let ei = 0; ei < events.length; ei++) {
      const ev = events[ei];
      const evPoll = 1 - (ev._alignment || 0.5);
      if (evPoll < 0.1) continue;
      for (const eName in ev.weights) {
        const ew = ev.weights[eName];
        if (!ew || !anchors[eName]) continue;
        const anc = anchors[eName];
        const ancIx = Math.round(((anc.v * HALF) / SIZE + 0.5) * (GRID - 1));
        const ancIz = Math.round(((anc.a * HALF) / SIZE + 0.5) * (GRID - 1));
        const radius = Math.ceil(2 + ew * 6);
        for (let dz = -radius; dz <= radius; dz++) {
          for (let dx = -radius; dx <= radius; dx++) {
            const gix = ancIx + dx, giz = ancIz + dz;
            if (gix < 0 || gix >= GRID || giz < 0 || giz >= GRID) continue;
            const d = Math.sqrt(dx * dx + dz * dz);
            if (d > radius) continue;
            const sig = (radius * 0.4) * bandwidthScale;
            const falloff = Math.exp(-(d * d) / (2 * sig * sig));
            pollField[giz * GRID + gix] += evPoll * ew * falloff * 0.3;
          }
        }
      }
    }
    for (let i = 0; i < total; i++) pollField[i] = Math.min(1, pollField[i]);

    for (let iz = 0; iz < GRID; iz++) {
      for (let ix = 0; ix < GRID; ix++) {
        const idx = iz * GRID + ix;
        const gx = (ix / (GRID - 1) - 0.5) * SIZE;
        const gz = (iz / (GRID - 1) - 0.5) * SIZE;
        const localPoll = pollField[idx];
        let h = 0, cr = 0.10, cg = 0.10, cb = 0.13;

        for (let ei = 0; ei < events.length; ei++) {
          const ev = events[ei], evInt = ev.intensity ?? 1.0, weights = ev.weights || {};
          for (const eName in weights) {
            const ew = weights[eName];
            if (!ew || !anchors[eName]) continue;
            const anc = anchors[eName];
            const ax = anc.v * HALF, az = anc.a * HALF;
            const ddx = gx - ax, ddz = gz - az;
            const dist = Math.sqrt(ddx * ddx + ddz * ddz);
            const radius = 3 + ew * 9;
            if (dist >= radius * 1.5) continue;
            const sig = (radius * 0.4) * bandwidthScale;
            const inf = Math.exp(-(dist * dist) / (2 * sig * sig)) * ew * evInt * comp;
            let dh = ew * 38 * inf;
            dh += ev.deviation * fm(gx * 0.15 + ei * 3 + li, gz * 0.15 + ei * 2, 4) * 4 * inf;
            dh += ev.erosion * (hs(gx * 0.3 + ei + li, gz * 0.3) - 0.5) * 2.5 * inf;
            const vrEff = ev.void_rupture + localPoll * 0.15;
            if (vrEff > 0.15) {
              const vn = fm(gx * 0.2 + ei * 5 + li, gz * 0.2, 3);
              if (vn > (1 - vrEff * 0.6)) dh -= 4 * vrEff * inf;
            }
            h += dh;
            cr += (anc.color[0] / 255) * (0.3 + ew * 0.7) * inf;
            cg += (anc.color[1] / 255) * (0.3 + ew * 0.7) * inf;
            cb += (anc.color[2] / 255) * (0.3 + ew * 0.7) * inf;
            if (inf > domScore[idx]) {
              domScore[idx] = inf;
              domIdx[idx] = anchorKeys.indexOf(eName);
            }
          }
        }

        h += fm(gx * 0.05 + li * 0.5, gz * 0.05 + li * 0.3, 5) * 1.0 - 0.5;
        h *= comp;
        heights[idx] = h;

        const cn = fm(gx * 0.08 + li, gz * 0.08 + li, 3), hBr = 1 + Math.abs(h) * 0.03;
        let pr = (cr + cn * 0.05) * hBr * opa;
        let pg = (cg + cn * 0.03) * hBr * opa;
        let pb = (cb + cn * 0.06) * hBr * opa;
        if (localPoll > 0.01) {
          const grey = (pr + pg + pb) / 3, boneTint = 0.08, mix = localPoll * 0.6;
          pr = pr * (1 - mix) + (grey * 0.7 + boneTint) * mix;
          pg = pg * (1 - mix) + (grey * 0.6 + boneTint * 0.8) * mix;
          pb = pb * (1 - mix) + (grey * 0.5 + boneTint * 0.6) * mix;
        }
        if (comp < 0.3) {
          const fossil = (0.3 - comp) / 0.3, avg = (pr + pg + pb) / 3;
          pr = pr * (1 - fossil * 0.5) + (avg + 0.04) * fossil * 0.5;
          pg = pg * (1 - fossil * 0.5) + (avg + 0.03) * fossil * 0.5;
          pb = pb * (1 - fossil * 0.5) + (avg + 0.02) * fossil * 0.5;
        }
        colors[idx * 3] = Math.min(1, pr);
        colors[idx * 3 + 1] = Math.min(1, pg);
        colors[idx * 3 + 2] = Math.min(1, pb);
      }
    }
    return { heights, colors, domIdx };
  }

  function aggregateLayerCaches(caches, enabledLayerIds) {
    const total = GRID * GRID;
    const aggH = new Float32Array(total);
    const aggC = new Float32Array(total * 3);
    const aggW = new Float32Array(total);
    const domIdx = new Int16Array(total).fill(-1);
    const domScore = new Float32Array(total);

    enabledLayerIds.forEach(id => {
      const c = caches[id]; if (!c) return;
      for (let i = 0; i < total; i++) {
        const h = c.heights[i];
        aggH[i] += h;
        const w = Math.abs(h) + 0.2;
        aggW[i] += w;
        aggC[i * 3] += c.colors[i * 3] * w;
        aggC[i * 3 + 1] += c.colors[i * 3 + 1] * w;
        aggC[i * 3 + 2] += c.colors[i * 3 + 2] * w;
        const s = Math.abs(h);
        if (s > domScore[i]) { domScore[i] = s; domIdx[i] = c.domIdx[i]; }
      }
    });
    for (let i = 0; i < total; i++) {
      const w = aggW[i] || 1;
      aggC[i * 3] /= w; aggC[i * 3 + 1] /= w; aggC[i * 3 + 2] /= w;
    }
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < total; i++) {
      if (aggH[i] < min) min = aggH[i];
      if (aggH[i] > max) max = aggH[i];
    }
    return { heights: aggH, colors: aggC, domIdx, min, max };
  }

  function toPastelTone(r, g, b, scale) {
    const rr = Math.max(0, Math.min(1, r * scale));
    const gg = Math.max(0, Math.min(1, g * scale));
    const bb = Math.max(0, Math.min(1, b * scale));
    const lum = rr * 0.299 + gg * 0.587 + bb * 0.114;
    const desat = 0.35;
    let pr = rr * (1 - desat) + lum * desat;
    let pg = gg * (1 - desat) + lum * desat;
    let pb = bb * (1 - desat) + lum * desat;
    const pastelBase = [0.22, 0.16, 0.30];
    const pastelMix = 0.20;
    pr = pr * (1 - pastelMix) + pastelBase[0] * pastelMix;
    pg = pg * (1 - pastelMix) + pastelBase[1] * pastelMix;
    pb = pb * (1 - pastelMix) + pastelBase[2] * pastelMix;
    const channelCap = 0.62;
    pr = Math.min(channelCap, Math.max(0, pr));
    pg = Math.min(channelCap, Math.max(0, pg));
    pb = Math.min(channelCap, Math.max(0, pb));
    pr = pr * 0.92 + 0.08 * 0.18;
    pg = pg * 0.90 + 0.08 * 0.12;
    pb = pb * 0.94 + 0.08 * 0.28;
    return [pr, pg, pb];
  }

  function lerp2(a, b, c, d, tx, ty) {
    const u = a * (1 - tx) + b * tx;
    const v = c * (1 - tx) + d * tx;
    return u * (1 - ty) + v * ty;
  }

  function sampleHeightBilinear(heights, ix, iz, tx, ty, Gn) {
    const Gc = Gn != null ? Gn : GRID;
    const i00 = iz * Gc + ix;
    const h00 = heights[i00];
    const h10 = heights[i00 + 1];
    const h01 = heights[i00 + Gc];
    const h11 = heights[i00 + Gc + 1];
    return lerp2(h00, h10, h01, h11, tx, ty);
  }

  function applyElevationTint(pr, pg, pb, hNorm) {
    const t = Math.max(0, Math.min(1, hNorm));
    // 저지대: 어둡게 가라앉음, 고지대: 부드럽게 떠오름
    // easeIn 커브로 저지대 어둠을 더 강조 (선형보다 깊은 계곡)
    const tCurve = t * t * 0.4 + t * 0.6; // 0→0, 0.5→0.5, 1→1 근사하지만 저지대가 더 눌림
    const lumBoost = 0.45 + 0.75 * tCurve;  // 0.45 (깊은 저지대) ~ 1.20 (고지대)
    let r = pr * lumBoost;
    let g = pg * lumBoost;
    let b = pb * lumBoost;
    // 고지대: 따뜻한 톤 쪽으로 미세 shift, 저지대: 차가운 깊이감
    const shift = (t - 0.4) * 0.18;
    r += shift * 0.5;
    g += shift * 0.1;
    b -= shift * 0.35;
    return [r, g, b];
  }

  function drawRaster(ctx, agg, W, H) {
    const Gc = agg.gridG != null ? agg.gridG : GRID;
    const maxChannel = (() => {
      let m = 0;
      for (let i = 0; i < agg.colors.length; i++) m = Math.max(m, agg.colors[i]);
      return m || 1;
    })();
    const globalScale = Math.min(1.0, 0.65 / maxChannel);
    const hMin = agg.min;
    const hRange = (agg.max - hMin) || 1;
    const img = ctx.createImageData(W, H);
    const p = img.data;
    for (let y = 0; y < H; y++) {
      const gy = (y / (H - 1)) * (Gc - 1);
      const iz = Math.max(0, Math.min(Gc - 2, Math.floor(gy)));
      const tz = gy - iz;
      for (let x = 0; x < W; x++) {
        const gx = (x / (W - 1)) * (Gc - 1);
        const ix = Math.max(0, Math.min(Gc - 2, Math.floor(gx)));
        const tx = gx - ix;
        const c00 = (iz * Gc + ix) * 3, c10 = c00 + 3, c01 = ((iz + 1) * Gc + ix) * 3, c11 = c01 + 3;
        const r = lerp2(agg.colors[c00], agg.colors[c10], agg.colors[c01], agg.colors[c11], tx, tz);
        const g = lerp2(agg.colors[c00 + 1], agg.colors[c10 + 1], agg.colors[c01 + 1], agg.colors[c11 + 1], tx, tz);
        const b = lerp2(agg.colors[c00 + 2], agg.colors[c10 + 2], agg.colors[c01 + 2], agg.colors[c11 + 2], tx, tz);
        let [pr, pg, pb] = toPastelTone(r, g, b, globalScale);
        const hSample = sampleHeightBilinear(agg.heights, ix, iz, tx, tz, Gc);
        const hNorm = (hSample - hMin) / hRange;
        [pr, pg, pb] = applyElevationTint(pr, pg, pb, hNorm);
        pr = Math.max(0, Math.min(1, pr));
        pg = Math.max(0, Math.min(1, pg));
        pb = Math.max(0, Math.min(1, pb));
        const i = (y * W + x) * 4;
        p[i] = Math.max(0, Math.min(255, Math.round(pr * 255)));
        p[i + 1] = Math.max(0, Math.min(255, Math.round(pg * 255)));
        p[i + 2] = Math.max(0, Math.min(255, Math.round(pb * 255)));
        p[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function marchingSquaresSegments(heights, threshold, Gn) {
    const Gc = Gn != null ? Gn : GRID;
    const segs = [];
    const edgePoint = (a, b, va, vb) => {
      const t = (threshold - va) / ((vb - va) || 1e-6);
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    };
    for (let z = 0; z < Gc - 1; z++) {
      for (let x = 0; x < Gc - 1; x++) {
        const i0 = z * Gc + x, i1 = i0 + 1, i2 = i0 + Gc + 1, i3 = i0 + Gc;
        const v0 = heights[i0], v1 = heights[i1], v2 = heights[i2], v3 = heights[i3];
        let c = 0;
        if (v0 >= threshold) c |= 1; if (v1 >= threshold) c |= 2; if (v2 >= threshold) c |= 4; if (v3 >= threshold) c |= 8;
        if (c === 0 || c === 15) continue;
        const p0 = { x, y: z }, p1 = { x: x + 1, y: z }, p2 = { x: x + 1, y: z + 1 }, p3 = { x, y: z + 1 };
        const e0 = edgePoint(p0, p1, v0, v1), e1 = edgePoint(p1, p2, v1, v2), e2 = edgePoint(p3, p2, v3, v2), e3 = edgePoint(p0, p3, v0, v3);
        const lut = {
          1: [[e3, e0]], 2: [[e0, e1]], 3: [[e3, e1]], 4: [[e1, e2]], 5: [[e3, e2], [e0, e1]], 6: [[e0, e2]], 7: [[e3, e2]],
          8: [[e2, e3]], 9: [[e0, e2]], 10: [[e0, e3], [e1, e2]], 11: [[e1, e2]], 12: [[e1, e3]], 13: [[e0, e1]], 14: [[e0, e3]],
        };
        (lut[c] || []).forEach(pair => segs.push(pair));
      }
    }
    return segs;
  }

  function emotionToMapCoords(emotion) {

  function mapCoordsSpread(baseX, baseY, idx, sceneId) {
    const s = String(sceneId != null ? sceneId : idx);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    const ang = (Math.abs(h) % 628) / 100;
    const mag = 0.012 + (Math.abs(h) % 23) / 2300;
    let nx = baseX + Math.cos(ang) * mag;
    let ny = baseY + Math.sin(ang * 1.07) * mag;
    nx = Math.max(0.03, Math.min(0.97, nx));
    ny = Math.max(0.03, Math.min(0.97, ny));
    return { x: nx, y: ny };
  }

  function updateAccess(pattern, emotionPosition, originSceneId) {
    const cores = game.pins.filter(p => p.type === 'core' || p.type === 'bridge');
    const originPin = cores.find(p => p.sceneId === originSceneId) || null;
    const rule = TRANSITION_RULES[pattern] || TRANSITION_RULES.bridge;
    let center = emotionPosition && (emotionPosition.x != null)
      ? { x: emotionPosition.x, y: emotionPosition.y }
      : { x: 0.5, y: 0.5 };
    if (originPin && originPin.mapX != null) {
      center = {
        x: (center.x + originPin.mapX) / 2,
        y: (center.y + originPin.mapY) / 2,
      };
    }
    let withDist = cores.map(p => ({
      pin: p,
      d: distMap(center, { x: p.mapX, y: p.mapY }),
    }));
    console.log('[DEBUG] updateAccess center', center, 'pattern', pattern, 'withDist count', withDist.length);

    let selected = [];
    if (pattern === 'fixation' && originPin) {
      selected = [originPin];
    } else {
      selected = withDist.filter(o => o.d <= rule.radius).map(o => o.pin);
      if (!selected.length) {
        const r2 = rule.radius * 1.85;
        selected = withDist.filter(o => o.d <= r2).map(o => o.pin);

      if (!selected.length) {
        selected = cores.filter(p => !game.visitedCore[p.sceneId]);

      if (vp) selected.push(vp);

  function syncPinStateFlags() {

  function applyInitialAccess() {

    const unvisited = cores.filter(p => !game.visitedCore[p.sceneId]);
    const pool = unvisited.length ? unvisited : cores.slice();
    const sorted = pool.slice().sort((a, b) => (a.sceneOrder || 0) - (b.sceneOrder || 0));
    const initialCount = Math.min(3, sorted.length);
    const picked = sorted.slice(0, initialCount);
    game.accessiblePinIds = new Set(picked.map(p => p.id));
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vp = game.pins.find(p => p.type === 'voidPin');
      if (vp) game.accessiblePinIds.add(vp.id);
    }
  }

  function getAttributionDirection(attribution) {
    if (!attribution) return null;
    const internal = ['self_blame', 'self_doubt', 'self_punishment', 'guilt_driven', 'unknown'];
    const external = ['other_blame', 'betrayal', 'external_threat', 'abandonment_by_other'];
    const situational = ['fate', 'circumstance', 'helpless_situation', 'inevitable', 'helpless'];
    if (internal.includes(attribution)) return 'internal';
    if (external.includes(attribution)) return 'external';
    if (situational.includes(attribution)) return 'situational';
    return null;
  }

  function getFearCategory(coreFear) {
    if (!coreFear) return null;
    const loss = ['abandonment', 'loss', 'separation', 'death_of_loved'];
    const worthlessness = ['inadequacy', 'failure', 'shame', 'not_enough'];
    const powerlessness = ['helplessness', 'loss_of_control', 'entrapment', 'vulnerability'];
    const punishment = ['punishment', 'rejection', 'judgment', 'exposure'];
    if (loss.includes(coreFear)) return 'loss';
    if (worthlessness.includes(coreFear)) return 'worthlessness';
    if (powerlessness.includes(coreFear)) return 'powerlessness';
    if (punishment.includes(coreFear)) return 'punishment';
    return null;
  }

  function calculateEmbeddingSimilarity(vecA, vecB) {
    if (!vecA || !vecB || !Array.isArray(vecA) || !Array.isArray(vecB) || vecA.length === 0 || vecA.length !== vecB.length) return 0;
    let dot = 0, ma = 0, mb = 0;
    for (let i = 0; i < vecA.length; i++) {
      const a = Number(vecA[i]) || 0, b = Number(vecB[i]) || 0;
      dot += a * b; ma += a * a; mb += b * b;
    }
    if (!ma || !mb) return 0;
    return Math.max(0, dot / Math.sqrt(ma * mb));
  }

  function calculateEmotionScore(userVector, originalVector, anchorEmotions) {
    if (!userVector || !originalVector) return 0;
    const userEmb = userVector.embedding;
    const origEmb = originalVector.embedding;
    if (userEmb && origEmb && Array.isArray(userEmb) && Array.isArray(origEmb) && userEmb.length && origEmb.length) {
      return calculateEmbeddingSimilarity(userEmb, origEmb);
    }
    const userBase = userVector.base || userVector;
    const origBase = originalVector.base || originalVector;
    return Math.max(0, cosineSimilarity(userBase, origBase, anchorEmotions));
  }

  function subtractVectors(vecA, vecB) {
    const result = {};
    const keys = new Set([...Object.keys(vecA || {}), ...Object.keys(vecB || {})]);
    for (const k of keys) {
      result[k] = (vecA?.[k] || 0) - (vecB?.[k] || 0);
    }
    return result;
  }

  function flattenDeltas(deltas, emotionKeys = null) {
    const keys = emotionKeys || [
      'fear','sadness','anger','guilt','shame','longing','numbness','isolation','moral_pain',
      'joy','hope','relief','gratitude','love','peace','comfort','despair','helplessness',
      'grief','tenderness','confusion','emptiness'
    ];
    const arr = [];
    for (const d of deltas) {
      for (const k of keys) arr.push(d[k] || 0);
    }
    return arr;
  }

  function cosineFlat(a, b) {
    if (!a || !b || a.length === 0 || b.length === 0 || a.length !== b.length) return 0;
    let dot = 0, mA = 0, mB = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      mA += a[i] * a[i];
      mB += b[i] * b[i];
    }
    mA = Math.sqrt(mA);
    mB = Math.sqrt(mB);
    if (mA === 0 || mB === 0) return 0;
    return dot / (mA * mB);
  }

  function calculateShapeSimilarity(userTrajectory, originalTrajectory) {
    if (!userTrajectory || !originalTrajectory || userTrajectory.length < 3) {
      return { raw: 1.0, clamped: 1.0, active: false };
    }
    const deltaUser = [];
    const deltaOrig = [];
    for (let i = 1; i < userTrajectory.length; i++) {
      deltaUser.push(subtractVectors(userTrajectory[i], userTrajectory[i - 1]));
      deltaOrig.push(subtractVectors(originalTrajectory[i], originalTrajectory[i - 1]));
    }
    const raw = cosineFlat(flattenDeltas(deltaUser), flattenDeltas(deltaOrig));
    return { raw, clamped: Math.max(0, raw), active: true };
  }

  function calculateLevelSimilarity(sceneScores) {
    if (!sceneScores || sceneScores.length === 0) return 0;
    return sceneScores.reduce((a, b) => a + b, 0) / sceneScores.length;
  }

  function calculateTrajectoryAlignment(level, shape, voidMod = 1.0) {
    return Math.max(0, Math.min(1, level * shape * voidMod));
  }

  function calculateFixationLevel(emotionHistory) {
    if (!emotionHistory || emotionHistory.length < 2) return 0;
    const recent = emotionHistory.slice(-3);
    if (recent.length < 2) return 0;
    let totalSim = 0, pairs = 0;
    for (let i = 0; i < recent.length - 1; i++) {
      for (let j = i + 1; j < recent.length; j++) {
        const a = recent[i], b = recent[j];
        if (!a || !b) continue;
        if (typeof a === 'object' && typeof b === 'object') {
          totalSim += Math.max(0, cosineSimilarity(a, b));
        } else if (typeof a === 'string' && typeof b === 'string') {
          totalSim += (a === b) ? 1.0 : 0.0;
        }
        pairs++;
      }
    }
    if (!pairs) return 0;
    return totalSim / pairs;
  }

  function getBucket(alignment, previousBucket, emotionHistory) {
    if (emotionHistory && emotionHistory.length >= 3) {
      const fixLevel = calculateFixationLevel(emotionHistory);
      if (fixLevel >= 0.85) return 'FIXATED';
    }
    if (previousBucket === 'HIGH' && alignment >= 0.40) return 'HIGH';
    if (previousBucket === 'LOW' && alignment <= 0.15) return 'LOW';
    if (alignment >= 0.50) return 'HIGH';
    if (alignment < 0.10) return 'LOW';
    return 'MID';
  }

  function getMismatchType(userVector, originalVector) {
    if (!userVector || !originalVector) return null;
    const userReason = userVector.reason_analysis || {};
    const origReason = originalVector.reason_analysis || {};
    if (!!userReason.is_void !== !!origReason.is_void) return 'void_mismatch';
    if (userReason.attribution && origReason.attribution && userReason.attribution !== origReason.attribution) {
      return 'attribution_mismatch';
    }
    if (userReason.target && origReason.target && userReason.target !== origReason.target) {
      const emotionSim = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
      if (emotionSim >= 0.5) return 'target_displacement';
    }
    const emotionSimilarity = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
    if (emotionSimilarity < 0.5) return 'emotion_mismatch';
    return null;
  }

  function getTransitionPattern(bucket, mismatchType, level, shape, userTraj) {
    if (bucket === 'FIXATED') return 'fixation';
    if (level >= 0.5 && shape < 0.3 && userTraj && userTraj.length >= 3) return 'displacement';
    if (bucket === 'HIGH') return 'echo_follow';
    if (bucket === 'MID') return 'bridge';
    if (bucket === 'LOW') {
      switch (mismatchType) {
        case 'void_mismatch': return 'avoidance';
        case 'target_displacement': return 'displacement';
        case 'emotion_mismatch': return 'contradiction';
        case 'attribution_mismatch': return 'contradiction';
        default: return 'bridge';
      }
    }
    return null;
  }

  function byeoriCalculateStep(input, context) {
    context = context || {};
    const {
      userVector, originalVector, anchorEmotions = null,
      userTrajectory = null, originalTrajectory = null,
      sceneScores = null
    } = input;
    const { previousBucket = null, emotionHistory = null } = context;
    if (!userVector || !originalVector) {
      return { affective_position: { v: 0, a: 0, d: 0 }, alignment_score: 0, alignment_bucket: 'LOW', transition_pattern: null, mismatch_type: null, current_scene_score: 0, debug: {} };
    }
    const currentSceneScore = calculateEmotionScore(userVector, originalVector, anchorEmotions);
    const allSceneScores = sceneScores ? [...sceneScores, currentSceneScore] : [currentSceneScore];
    const level = calculateLevelSimilarity(allSceneScores);
    const userTraj = userTrajectory ? [...userTrajectory, userVector.base || userVector] : [userVector.base || userVector];
    const origTraj = originalTrajectory ? [...originalTrajectory, originalVector.base || originalVector] : [originalVector.base || originalVector];
    const shapeResult = calculateShapeSimilarity(userTraj, origTraj);
    const userReason = userVector.reason_analysis || {};
    const origReason = originalVector.reason_analysis || {};
    const voidMod = (!!userReason.is_void && !origReason.is_void) ? 0.7 : 1.0;
    const alignmentScore = calculateTrajectoryAlignment(level, shapeResult.clamped, voidMod);
    const alignmentBucket = getBucket(alignmentScore, previousBucket, emotionHistory);
    const mismatchType = getMismatchType(userVector, originalVector);
    const baseVec = userVector.base || userVector;
    const affectivePosition = projectEmotionToVADContour(baseVec);
    const transitionPattern = getTransitionPattern(alignmentBucket, mismatchType, level, shapeResult.clamped, userTraj);
    const debug = {
      current_scene_score: currentSceneScore,
      level,
      shape_raw: shapeResult.raw,
      shape: shapeResult.clamped,
      shape_active: shapeResult.active,
      void_mod: voidMod,
      scenes_played: allSceneScores.length,
      formula: `L${level.toFixed(2)} × S${shapeResult.clamped.toFixed(2)} × V${voidMod.toFixed(2)} = ${alignmentScore.toFixed(3)}`,
      fixation_level: emotionHistory ? calculateFixationLevel(emotionHistory) : 0,
      scene_scores: allSceneScores
    };
    return {
      affective_position: affectivePosition,
      alignment_score: alignmentScore,
      alignment_bucket: alignmentBucket,
      transition_pattern: transitionPattern,
      mismatch_type: mismatchType,
      current_scene_score: currentSceneScore,
      debug,
    };
  }

  function buildOriginalVectorFromScene(scene) {
    const base = safeParseEmotion(scene.original_emotion);
    const voidInfo = scene.void_info || {};
    const isVoidScene = !!(voidInfo && voidInfo.sceneVoid);
    return {
      base,
      reason_analysis: {
        attribution: scene.original_reason || null,
        target: voidInfo.target || null,
        core_fear: voidInfo.coreFear || voidInfo.core_fear || null,
        is_void: isVoidScene,
      },
    };
  }

  function reasonKeyToAttribution(key) {
    const m = { self_blame: 'self_blame', helpless: 'helpless_situation', fear_driven: 'external_threat', unknown: 'unknown' };
    return m[key] || key;
  }

  // ── Text contamination per Presentation Spec v1 ──────────────
  // Consumes stage + intensity. Does NOT re-compute stage.
  //
  // stable:              원문 유지, 단어 단위 미세 흔들림만
  // biased_inclination:  핵심 단어 편향 치환 (방향성)
  // hypercompletion:     확정 표현/연결어 삽입
  //
  // Intensity bands: weak(0~0.33), medium(0.34~0.66), strong(0.67~1.0)

  const GLITCH_CHARS = '░▒▓█▪▫';

  // Seeded PRNG (mulberry32) — same text always produces same effect
  function _seedFromText(text) {
    let h = 0;
    for (let i = 0; i < text.length; i++) {
      h = ((h << 5) - h + text.charCodeAt(i)) | 0;
    }
    return function () {
      h |= 0; h = h + 0x6D2B79F5 | 0;
      let t = Math.imul(h ^ h >>> 15, 1 | h);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function applyStageText(originalText, scene, pres) {
    const { stage, intensity, band } = pres;
    if (stage === 'stable' || intensity < 0.01) return originalText;

    // Pre-generated stage text: DB text_stage_1/2/3 mapped to contamination state
    if (stage === 'biased_inclination') {
      if (band === 'strong' && scene.text_stage_2) return scene.text_stage_2;
      if (band !== 'weak'  && scene.text_stage_1) return scene.text_stage_1;
    }
    if (stage === 'hypercompletion') {
      if (band === 'strong' && scene.text_stage_3) return scene.text_stage_3;
      if (band !== 'weak'  && scene.text_stage_2) return scene.text_stage_2;
    }

    // Client-side fallback effects (until anchor-based semantic mutation is built)
    // Seeded RNG ensures determinism per QA spec §6
    const rng = _seedFromText(originalText + stage + band);
    const isKo = /[가-힣]/.test(originalText);
    const words = originalText.split(/(\s+)/);

    // Effect probability scales with intensity band
    const prob = band === 'strong' ? 0.18
      : band === 'medium' ? 0.10
      : 0.04;

    let out = '';
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (/^\s+$/.test(w)) { out += w; continue; }
      if (rng() >= prob) { out += w; continue; }

      if (stage === 'biased_inclination') {
        // Directional erosion: trailing chars dissolve (Korean particles/endings fade)
        // Spec: "핵심 단어만 편향 방향으로 치환", "기억이 한 방향으로 틀어지고 있다"
        const fadeStart = isKo
          ? Math.max(1, Math.floor(w.length * 0.5))  // Korean: keep first half, fade tail
          : Math.max(1, Math.floor(w.length * 0.6));  // English: keep more, fade ending
        let result = w.slice(0, fadeStart);
        for (let c = fadeStart; c < w.length; c++) {
          result += rng() < 0.5 ? '·' : w[c];  // middle-dot for subtle erosion
        }
        out += result;
      } else if (stage === 'hypercompletion') {
        // Over-solidification: text becomes too certain, too fixed
        // Spec: "기억이 스스로 답을 확정하고 있다", "반복성 누적"
        if (rng() < 0.3 && w.length > 1) {
          // Word echo: repeat the word (memory over-confirming itself)
          out += w + w;
        } else {
          // Glitch solidification: block chars replace parts
          let result = '';
          for (let c = 0; c < w.length; c++) {
            result += rng() < 0.4
              ? GLITCH_CHARS[Math.floor(rng() * GLITCH_CHARS.length)]
              : w[c];
          }
          out += result;
        }
      }
    }
    return out;
  }

  function buildTerrainFromData() {
    const T = window.TemAfStrataTerrain;
    if (!T || !game.memoryId) {
      console.warn('[play-test] TemAfStrataTerrain 또는 memoryId 없음 — 등고선 스킵');
      game.agg = null;
      let pollution = 0;
      if (game.plays.length) {
        let s = 0;
        game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
        pollution = Math.round((s / game.plays.length) * 100);
      }
      return pollution;
    }
    const memRow = {
      id: game.memoryId,
      title: game.memoryTitle || '',
      memory_words: '',
      completed_sentence: '',
    };
    const playsByMem = {};
    playsByMem[game.memoryId] = game.plays || [];
    const P = T.buildMemoryItems([memRow], playsByMem);
    const field = T.computeAfTerrainFields(P, null);
    const total = field.G * field.G;
    game.agg = {
      heights: field.hts,
      colors: field.cls,
      min: field.minH,
      max: field.maxH,
      domIdx: new Int16Array(total).fill(-1),
      gridG: field.G,
    };

    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    return pollution;
  }

  function renderContourCanvas() {
    const canvas = document.getElementById('contourCanvas');
    if (!canvas || !game.agg) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(2, Math.floor(rect.width * dpr));
    canvas.height = Math.max(2, Math.floor(rect.height * dpr));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const W = Math.floor(canvas.width), H = Math.floor(canvas.height);
    ctx.clearRect(0, 0, W, H);
    drawRaster(ctx, game.agg, W, H);
    const minH = game.agg.min, maxH = game.agg.max, range = (maxH - minH) || 1;
    const Gc = game.agg.gridG != null ? game.agg.gridG : GRID;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function strokeContourPass(strokeStyle, lineW) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineW;
      for (let i = 1; i <= CONTOUR_LEVELS; i++) {
        const t = i / (CONTOUR_LEVELS + 1);
        const th = minH + range * t;
        const segs = marchingSquaresSegments(game.agg.heights, th, Gc);
        ctx.beginPath();
        segs.forEach(pair => {
          const p1 = toCanvas(pair[0], W, H, Gc), p2 = toCanvas(pair[1], W, H, Gc);
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        });
        ctx.stroke();
      }
    }
    strokeContourPass('rgba(8, 4, 18, 0.3)', 1.8 * dpr);
    strokeContourPass('rgba(232, 224, 252, 0.85)', 1.2 * dpr);
  }

  function vadToPercent(vad) {
    const Gm = (game.agg && game.agg.gridG) ? game.agg.gridG : GRID;
    const gx = ((vad.x * HALF) / SIZE + 0.5) * (Gm - 1);
    const gz = ((vad.z * HALF) / SIZE + 0.5) * (Gm - 1);
    return {
      x: (gx / (Gm - 1)) * 100,
      y: (gz / (Gm - 1)) * 100,
    };
  }

  function buildPins() {
    game.pins = [];
    game.scenes.forEach((scene, idx) => {
      const emotion = safeParseEmotion(scene.original_emotion);
      const base = emotionToMapCoords(emotion);
      const spread = mapCoordsSpread(base.x, base.y, idx, scene.id);
      const isBridge = scene.scene_role === 'residual';
      const pinType = isBridge ? 'bridge' : 'core';
      const pinId = pinType + '-' + (scene.id != null ? scene.id : idx);
      const pinText = scene.text || scene.text_stage_1 || scene.text_stage_2 || '…';
      game.pins.push({
        id: pinId,
        type: pinType,
        sceneId: scene.id,
        sceneIndex: idx,
        memoryId: game.memoryId,
        role: scene.scene_role || 'anchor',
        mapX: spread.x,
        mapY: spread.y,
        x: spread.x * 100,
        y: spread.y * 100,
        text: pinText,
        label: isBridge ? '·' : '',
        originalEmotion: emotion,
        sceneOrder: scene.scene_order != null ? scene.scene_order : idx,
        state: 'locked',
        visited: false,
      });
    });
    const recent = game.plays.slice(-40);
    recent.forEach((pl, i) => {
      const af = projectEmotionToAFContour(safeParseEmotion(pl.user_emotion));
      const p = vadToPercent(af);
      const j = (i % 7) * 0.4;
      game.pins.push({
        id: 'echo-' + i + '-' + (pl.scene_id || i),
        type: 'echo',
        x: Math.max(2, Math.min(98, p.x + Math.sin(i * 1.7) * j)),
        y: Math.max(2, Math.min(98, p.y + Math.cos(i * 1.3) * j)),
        label: '',
        state: 'locked',
      });
    });
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vidx = game.scenes.findIndex(s => s.id === voidScene.id);
      game.pins.push({
        id: 'void-' + voidScene.id,
        type: 'voidPin',
        sceneId: voidScene.id,
        sceneIndex: vidx >= 0 ? vidx : 0,
        text: voidScene.text || voidScene.text_stage_1 || '…',
        originalEmotion: safeParseEmotion(voidScene.original_emotion),
        x: 88,
        y: 78,
        label: '∅',
        mapX: 0.88,
        mapY: 0.78,
        state: 'locked',
      });
    }
  }

  function finalizePinAccess() {
    syncPinStateFlags();
    applyPinVisualFlags();
  }

  function applyPinVisualFlags() {
    game.pins.forEach(pin => {
      pin.visited = false;
      pin.entrance = false;
      pin.active = false;
      pin.locked = false;
      if (pin.type === 'echo') {
        pin.locked = true;
        return;
      }
      if (pin.type === 'core' || pin.type === 'bridge') {
        pin.visited = !!game.visitedCore[pin.sceneId];
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
        return;
      }
      if (pin.type === 'voidPin') {
        pin.visited = !!(game.visitedCore[pin.sceneId]);
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
      }
    });
  }

  /** 핀 DOM에 호버 카드(또다른 나 속삭임) 부착 */
  function attachHoverCard(pinEl, pin) {
    if (pin.type === 'echo') return;
    var card = document.createElement('div');
    card.className = 'pin-hover-card' + (pin.visited ? ' visited-card' : '');

    // 미방문 핀: 감정색 테두리
    if (!pin.visited && pin.originalEmotion) {
      var scene = game.scenes.find(function (s) { return s.id === pin.sceneId; });
      var baseEmo = scene ? safeParseEmotion(scene.original_emotion) : {};
      var rgb = getDominantColor(baseEmo);
      card.style.borderColor = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.45)';
    }

    var label = document.createElement('div');
    label.className = 'whisper-label';
    label.textContent = LANG === 'ko' ? '또다른 나' : 'Another Me';
    card.appendChild(label);

    var txt = document.createElement('div');
    txt.textContent = getWhisperText(pin);
    card.appendChild(txt);

    if (pin.x > 75) card.classList.add('flip-left');
    pinEl.appendChild(card);
  }

  function renderPins() {
    const layer = document.getElementById('mapPinsLayer');
    if (!layer) return;
    layer.innerHTML = '';
    const unlockInfo = game._unlockAnimInfo;
    game.pins.forEach(pin => {
      const el = document.createElement('div');
      let cls = 'map-pin ' + pin.type;
      const isNewlyUnlocked = unlockInfo && unlockInfo.newPinIds.has(pin.id);
      if (isNewlyUnlocked) {
        // 새 핀은 처음에 숨김 — trace line 도착 시 unlock 애니메이션 시작
        cls += ' locked';
        el.style.opacity = '0';
        el.dataset.pendingUnlock = unlockInfo.pattern;
      } else {
        if (pin.active) cls += ' active';
        if (pin.entrance) cls += ' entrance';
        if (pin.locked) cls += ' locked';
        // 잠기지 않은 핀에만 호버 카드 부착
        if (!pin.locked) attachHoverCard(el, pin);
      }
      if (pin.visited) cls += ' visited';
      el.className = cls;
      el.style.left = pin.x + '%';
      el.style.top = pin.y + '%';
      el.dataset.pinId = pin.id;
      const _hasLabel = pin.label || (pin.visited && pin.sceneId);
      if (_hasLabel) {
        const lb = document.createElement('div');
        lb.className = 'map-pin-label';
        if (pin.label) {
          lb.textContent = pin.label; // bridge: '·'
        } else if (pin.visited && pin.sceneId) {
          const _vi = game.visitOrder.indexOf(pin.sceneId);
          if (_vi >= 0) lb.textContent = String(_vi + 1);
        }
        if (lb.textContent) el.appendChild(lb);
      }
      el.addEventListener('click', () => onPinClick(pin));
      layer.appendChild(el);
    });
    // unlock 정보는 renderTraceLines에서 사용 후 초기화
  }

  function renderTraceLines() {
    const svg = document.getElementById('mapTraceLayer');
    if (!svg) return;
    svg.innerHTML = '';
    const lines = game.traceLines || [];
    if (!lines.length) { game._unlockAnimInfo = null; return; }
    const rect = svg.parentElement ? svg.parentElement.getBoundingClientRect() : { width: 1, height: 1 };
    const w = rect.width || 1;
    const h = rect.height || 1;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const total = lines.length;
    const unlockInfo = game._unlockAnimInfo;
    // 새 선 = 이번에 추가된 것 (unlockInfo가 있으면 새 선)
    const newLineStartIdx = unlockInfo ? total - unlockInfo.newPinIds.size : total;

    lines.forEach((tr, idx) => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      const x1 = (tr.fromX / 100) * w;
      const y1 = (tr.fromY / 100) * h;
      const x2 = (tr.toX / 100) * w;
      const y2 = (tr.toY / 100) * h;
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      const style = TRACE_STYLES[tr.pattern] || TRACE_STYLES.bridge;
      const age = total - idx;
      const fadeFactor = age <= 3 ? 1 : 0.5;
      const baseOpacity = Math.min(1, style.opacity * fadeFactor * 3);
      line.setAttribute('stroke', style.color);
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('opacity', String(baseOpacity));
      line.setAttribute('stroke-linecap', 'round');

      const isNewLine = idx >= newLineStartIdx;
      if (isNewLine) {
        // 선이 그려지는 애니메이션: stroke-dashoffset
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        const drawDuration = 0.6; // 초
        const staggerDelay = (idx - newLineStartIdx) * 0.3; // 선마다 0.3초 간격
        line.setAttribute('stroke-dasharray', String(len));
        line.setAttribute('stroke-dashoffset', String(len));
        line.style.transition = 'stroke-dashoffset ' + drawDuration + 's ease-out ' + staggerDelay + 's';
        // 패턴별 dash는 선 도착 후 적용
        line.dataset.targetDash = style.dash || '';
        line.dataset.drawDuration = String(drawDuration);
        line.dataset.staggerDelay = String(staggerDelay);
        // 선 도착 시 → 핀 unlock 트리거
        line.addEventListener('transitionend', () => {
          // dash 스타일 복원
          if (line.dataset.targetDash) {
            line.setAttribute('stroke-dasharray', line.dataset.targetDash);
            line.removeAttribute('stroke-dashoffset');
          } else {
            line.removeAttribute('stroke-dasharray');
            line.removeAttribute('stroke-dashoffset');
          }
          // 이 선의 target 핀을 unlock
          const pinEl = document.querySelector('[data-pin-id="' + tr._targetPinId + '"]');
          if (pinEl && pinEl.dataset.pendingUnlock) {
            const pat = pinEl.dataset.pendingUnlock;
            pinEl.style.opacity = '';
            pinEl.classList.remove('locked');
            pinEl.classList.add('unlock-' + pat);
            pinEl.addEventListener('animationend', () => {
              pinEl.classList.remove('unlock-' + pat);
              pinEl.classList.add('active', 'entrance');
              delete pinEl.dataset.pendingUnlock;
              // unlock 완료 후 호버 카드 부착
              var _pin = game.pins.find(function (p) { return p.id === tr._targetPinId; });
              if (_pin) attachHoverCard(pinEl, _pin);
            }, { once: true });
          }
        }, { once: true });
        // 렌더 후 다음 프레임에서 dashoffset을 0으로 → 애니메이션 시작
        requestAnimationFrame(() => { requestAnimationFrame(() => { line.setAttribute('stroke-dashoffset', '0'); }); });
      } else {
        // 기존 선: dash 패턴 그대로
        if (style.dash) line.setAttribute('stroke-dasharray', style.dash);
      }
      svg.appendChild(line);
    });
    game._unlockAnimInfo = null;
  }

  async function startPlayTestAlignmentWaves(originalVec, userVec, alignmentScore, waveOpts) {
    waveOpts = waveOpts || {};

    const viz = await ensurePlayTestAlignVisualizer();

    const orig = normalizeOriginalEmotionForWave(originalVec || {});
    const user = (userVec && typeof userVec === 'object') ? userVec : {};
    const align = alignmentScore != null ? Number(alignmentScore) : 0;
    const narratorWaveStyle = vecToVizWaveStyle(orig);
    const experiencerWaveStyle = userIdle ? idleExperiencerWaveStyle() : vecToVizWaveStyle(user);
    viz.startAlignmentWaveAnimation(canvas, null, {
      alignment: align,
      narratorEmotionVector: orig,
      experiencerEmotionVector: userIdle ? {} : user,
      narratorWaveStyle,

  /** Core 제출 직후 API 응답 전, 한·영 키워드로 감정파동 색을 바로 반영. 매칭 시 true. */
  function previewWaveFromCoreUserText(text) {
    if (!text || typeof text !== 'string') return false;
    const t = text;
    if (/슬프|슬퍼|슬펐|우울|눈물|울었|비통|슬픔|서글|애처/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.sadness, 'MID', { sadness: 0.92, longing: 0.34 });
      return true;
    }
    if (/무섭|무서|두려|공포|불안|조마|오싹|겁/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.fear, 'MID', { fear: 0.9, confusion: 0.28 });
      return true;
    }
    if (/화나|분노|열받|짜증|격분|빡|욕나와/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.anger, 'MID', { anger: 0.94, fear: 0.16 });
      return true;
    }
    if (/그립|그리워|보고\s*싶/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.longing, 'MID', { longing: 0.88, sadness: 0.42 });
      return true;
    }
    if (/미안|죄책|내\s*탓/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.guilt, 'MID', { guilt: 0.9, sadness: 0.26 });
      return true;
    }
    if (/\bsad\b|sorrow|grief|depressed|unhappy/i.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.sadness, 'MID', { sadness: 0.9, longing: 0.22 });
      return true;
    }
    return false;
  }

  /**
   * 파동 흡수 연출: 움직이던 파형 그대로 굳음 (속도→0) + 탈채도 (emotion RGB → gray)
   * @param {number} durationMs - 굳는 시간 (ms)
   * @param {number[]} emotionRgb - 감정색 [r, g, b]
   * @returns {Promise<void>}
   */
  function collapseWaveAnimation(durationMs, emotionRgb) {
    const v = getPlayTestAlignVisualizerSync();
    if (!v) return Promise.resolve();

    const startTime = performance.now();
    const gray = { r: 90, g: 90, b: 100 };
    return new Promise(function (resolve) {
      function tick() {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(1, elapsed / durationMs);
        const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic

        var spdMul = 1 - eased; // 1 → 0: 파동이 서서히 멈춤
        var r = Math.round(emotionRgb[0] + (gray.r - emotionRgb[0]) * eased);
        var g = Math.round(emotionRgb[1] + (gray.g - emotionRgb[1]) * eased);
        var b = Math.round(emotionRgb[2] + (gray.b - emotionRgb[2]) * eased);

        v.setWaveOverride({ speedMultiplier: spdMul, colorOverride: { r: r, g: g, b: b } });

        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          // 파동 완전 정지 상태 유지 (굳은 형태로 남김)
          v.setWaveOverride({ speedMultiplier: 0, colorOverride: gray });
          resolve();
        }
      }
      requestAnimationFrame(tick);
    });
  }
