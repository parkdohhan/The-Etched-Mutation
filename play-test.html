  function enterSceneMode(pinOrId) {
    const pin = typeof pinOrId === 'string' ? game.pins.find(p => p.id === pinOrId) : pinOrId;
    if (!pin || (pin.type !== 'core' && pin.type !== 'bridge' && pin.type !== 'voidPin')) return;
    const scene = game.scenes.find(s => s.id === pin.sceneId);
    if (!scene) return;
    clearTimers();
    if (typeof window.destroyFloatingAnchor === 'function') window.destroyFloatingAnchor();
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    game.postSubmitTerrainCleanup = null;
    stopTerrainAnimLoop();
    const _tc = document.getElementById('terrainCanvas');
    if (_tc) _tc.classList.remove('clickable');
    document.getElementById('terrainBar').classList.remove('awaiting-terrain');
    game.currentPinId = pin.id;
    game.currentSceneIndex = pin.sceneIndex;
    document.getElementById('mapMode').classList.remove('active');
    const sm = document.getElementById('sceneMode');
    sm.classList.add('active');
    const _ia = document.getElementById('emotionInputArea');
    _ia.style.opacity = '0';
    _ia.innerHTML = '';
    game.playTestWaveUserIdle = true;
    // 이전 장면의 파동 굳음(override) 해제 — 새 장면에서 파동 다시 살아남
    var _v = getPlayTestAlignVisualizerSync();
    if (_v) _v.clearWaveOverride();
    const origBase = normalizeOriginalEmotionForWave(pin.originalEmotion || safeParseEmotion(scene.original_emotion));
    const alignInit = (game.lastResult && typeof game.lastResult.alignment_score === 'number')
      ? game.lastResult.alignment_score
      : 0;
    void startPlayTestAlignmentWaves(origBase, {}, alignInit, { userIdle: true });

    const textEl = document.getElementById('sceneText');
    textEl.textContent = '';
    // Apply contamination per Presentation spec (dominant stage + intensity band)
    const _pres = game.contPresentation || { stage: 'stable', intensity: 0, band: 'weak' };
    let fullText = applyStageText(pin.text || scene.text || '…', scene, _pres);
    const _typeStart = performance.now();
    const _charMs = 28;
    (function _typeFrame(now) {
      const elapsed = now - _typeStart;
      const chars = Math.min(fullText.length, Math.floor(elapsed / _charMs) + 1);
      textEl.textContent = fullText.slice(0, chars);
      if (chars >= fullText.length) {
        setupEmotionInputByPinType(pin, scene);
        return;
      }
      requestAnimationFrame(_typeFrame);
    })(performance.now());

    // Phase 0: 첫 core 씬 진입 시 "또다른 나" 안내
    const _npcClear = document.getElementById('sceneNpc');
    if (game.coreVisitCount === 0 && pin.type === 'core' && T.anotherMeIntro) {
      const _introLabel = LANG === 'ko' ? '또다른 나' : 'Another Me';
      _npcClear.innerHTML =
        '<span class="another-me-label">' + _introLabel + '</span>' +
        '<span class="another-me-whisper">' + T.anotherMeIntro + '</span>';
    } else {
      _npcClear.textContent = '';
    }
    document.getElementById('terrainClickHint').style.display = 'none';
    document.getElementById('terrainBar').classList.remove('clickable');
    game.lastTerrainTint = null;
    renderTerrainBar(pin.sceneIndex, null);

    // Contamination monologue — "또다른 나" whisper (Presentation Spec §5)
    if (_pres.stage !== 'stable') {
      const _monoText = getMonologue(_pres, game.contMismatch, pin.sceneIndex, game.contState?.cont_depth || 0);
      if (_monoText) {
        const _anotherMeLabel = LANG === 'ko' ? '또다른 나' : 'Another Me';
        setTimeout(() => {
          const npcEl = document.getElementById('sceneNpc');
          if (npcEl) {
            npcEl.innerHTML =
              '<span class="another-me-label">' + _anotherMeLabel + '</span>' +
              '<span class="another-me-whisper">' + _monoText + '</span>';
          }
        }, 1500);
      }
    }

    // Echo words — 잔향단어 floating anchor (독백 뒤 staggered 등장)
    const _echoWords = scene.echo_words || [];
    if (_echoWords.length > 0) {
      const _echoContainer = document.querySelector('.scene-content-area') || document.querySelector('.scene-main');
      if (_echoContainer) {
        const _contDepth = game.contState?.cont_depth || 0;
        const _echoCount = (_pres.band === 'strong') ? Math.min(2, _echoWords.length) : Math.min(1, _echoWords.length);
        // seeded PRNG (독백 seed와 분리: offset +7)
        const _echoSeedVal = (pin.sceneIndex * 2654435761 ^ (_contDepth + 7) * 40503) | 0;
        let _echoHash = _echoSeedVal;
        function _echoRng() {
          _echoHash |= 0; _echoHash = _echoHash + 0x6D2B79F5 | 0;
          let et = Math.imul(_echoHash ^ _echoHash >>> 15, 1 | _echoHash);
          et = et + Math.imul(et ^ et >>> 7, 61 | et) ^ et;
          return ((et ^ et >>> 14) >>> 0) / 4294967296;
        }
        const _echoPool = [..._echoWords];
        const _echoPicked = [];
        for (let ei = 0; ei < _echoCount && _echoPool.length > 0; ei++) {
          const eidx = Math.floor(_echoRng() * _echoPool.length);
          _echoPicked.push(_echoPool.splice(eidx, 1)[0]);
        }
        const _echoAlignment = game.lastResult?.alignment_score ?? 0.5;
        _echoPicked.forEach((word, i) => {
          setTimeout(() => {
            if (typeof window.startFloatingAnchor === 'function') {
              window.startFloatingAnchor(_echoContainer, word, _echoAlignment);
            }
          }, 2200 + i * 800);
        });
      }
    }
  }

  function setupCoreInput(pin, scene) {

    const submitBtn = document.getElementById('coreSubmitBtn');
    const coreTextInput = document.getElementById('coreTextInput');
    const submitCoreInput = async () => {

      previewWaveFromCoreUserText(text);
      try {

          body: JSON.stringify({
            type: 'emotion_extract',

          }),

        const userVector = raw?.base ? raw : (raw?.data?.base ? raw.data : { base: {} });
        if (!userVector.reason_analysis) userVector.reason_analysis = { attribution: 'unknown', core_fear: 'none', target: 'unknown', is_void: false };

      } catch (e) {

    coreTextInput.addEventListener('input', function () {
      var v = (coreTextInput.value || '').trim();
      if (!v) return;
      if (game.playTestWaveUserIdle) {
        game.playTestWaveUserIdle = false;
        var matched = previewWaveFromCoreUserText(v);
        if (!matched) {
          var sc = game.scenes[game.currentSceneIndex];
          var pin2 = game.currentPinId ? game.pins.find(function (p) { return p.id === game.currentPinId; }) : null;
          var orig2 = normalizeOriginalEmotionForWave((pin2 && pin2.originalEmotion) ? pin2.originalEmotion : safeParseEmotion(sc.original_emotion));
          var align2 = (game.lastResult && typeof game.lastResult.alignment_score === 'number') ? game.lastResult.alignment_score : 0;
          void startPlayTestAlignmentWaves(orig2, { confusion: 0.22, sadness: 0.18 }, align2, { userIdle: false });
        }
      } else {

  function wirePlayTestWaveEngagement(scene) {
    const chips = document.getElementById('emotionChips');
    const sliders = document.getElementById('sliderArea');
    const reasons = document.getElementById('reasonArea');
    if (!chips || !sliders) return;
    const bump = function () {
      if (!game.playTestWaveUserIdle) return;
      game.playTestWaveUserIdle = false;
      const pin = game.currentPinId ? game.pins.find(function (p) { return p.id === game.currentPinId; }) : null;
      const sc = game.scenes[game.currentSceneIndex];
      if (!sc) return;
      const orig = normalizeOriginalEmotionForWave((pin && pin.originalEmotion) ? pin.originalEmotion : safeParseEmotion(sc.original_emotion));
      let user = {};
      try { user = collectUserEmotionVector(); } catch (_) {}
      const align = (game.lastResult && typeof game.lastResult.alignment_score === 'number') ? game.lastResult.alignment_score : 0;
      void startPlayTestAlignmentWaves(orig, user, align, { userIdle: false });
    };
    chips.addEventListener('click', bump);
    sliders.addEventListener('input', bump);
    if (reasons) reasons.addEventListener('click', bump);

      vec[k] = parseFloat(el.value) || 0;
    });

  function parseAnchorEmotions(scene) {
    let a = scene.anchor_emotions;
    if (typeof a === 'string') {
      try { a = JSON.parse(a); } catch (_) { a = null; }
    }
    if (Array.isArray(a) && a.length) return a.map(String);
    return null;
  }

  function submitScene(scene) {
    clearTimers();
    const vec = collectUserEmotionVector();
    const reasonKey = collectReason();
    const userVector = {
      base: vec,
      reason_analysis: {
        is_void: false,
        attribution: reasonKey ? reasonKeyToAttribution(reasonKey) : null,
        target: 'scene',
        core_fear: null,
      },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({
      userVector, originalVector: orig, anchorEmotions: anchors,
      userTrajectory: game.userEmotionTrajectory || [],
      originalTrajectory: game.originalEmotionTrajectory || [],
      sceneScores: game.sceneScores || [],
    }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
    });
    game.previousBucket = result.alignment_bucket;
    game.emotionHistory.push(Object.assign({}, vec));
    game.userEmotionTrajectory.push(Object.assign({}, vec));
    game.originalEmotionTrajectory.push(Object.assign({}, orig.base || {}));
    game.sceneScores.push(result.current_scene_score || 0);
    finishScene(scene, result, vec, reasonKey || '', false);
  }

  function processEmotionResult(pin, scene, userVector) {
    fadeOut(SFX.white, 500, true);
    clearTimers();
    const origVector = {
      base: pin.originalEmotion || safeParseEmotion(scene.original_emotion),
      reason_analysis: scene.original_reason_vector || null,
    };
    const engineResult = byeoriCalculateStep({
      userVector,
      originalVector: origVector,
      anchorEmotions: parseAnchorEmotions(scene),
      userTrajectory: game.userEmotionTrajectory || [],
      originalTrajectory: game.originalEmotionTrajectory || [],
      sceneScores: game.sceneScores || [],
    }, {
      previousBucket: game.previousBucket || null,
      emotionHistory: game.emotionHistory,
    });

    pin.visited = true;
    pin.emotion_data = userVector;
    pin.engine_result = engineResult;
    game.visitedCore[pin.sceneId] = true;
    if (!game.visitOrder.includes(pin.sceneId)) game.visitOrder.push(pin.sceneId);
    if (pin.type === 'core') game.coreVisitCount++;
    game.previousBucket = engineResult.alignment_bucket;
    if (userVector.base) game.emotionHistory.push(Object.assign({}, userVector.base));
    if (userVector.base) game.userEmotionTrajectory.push(Object.assign({}, userVector.base));
    game.originalEmotionTrajectory.push(Object.assign({}, origVector.base || {}));
    game.sceneScores.push(engineResult.current_scene_score || 0);

    const baseEmotion = userVector.base || {};
    game.lastUserEmotion = Object.assign({}, baseEmotion);
    game.traces.push({
      pinType: pin.type,
      sceneId: pin.sceneId || scene.id,
      sceneText: scene.text || '',
      userVector,
      userEmotion: baseEmotion,
      alignment: engineResult.alignment_score,
      bucket: engineResult.alignment_bucket,
      pattern: engineResult.transition_pattern,
      mismatch: engineResult.mismatch_type,
      sceneIndex: pin.sceneIndex,
    });

    const pos = engineResult.affective_position;
    if (!game.emotionCursor) game.emotionCursor = { v: 0, a: 0, d: 0 };
    if (pos) {
      game.emotionCursor.v = game.emotionCursor.v * 0.3 + pos.v * 0.7;
      game.emotionCursor.a = game.emotionCursor.a * 0.3 + pos.a * 0.7;
      game.emotionCursor.d = (game.emotionCursor.d || 0) * 0.3 + (pos.d || 0) * 0.7;
      if (!game.emotionTrajectory) game.emotionTrajectory = [];
      game.emotionTrajectory.push({ ...game.emotionCursor });
    }

    const reasonLabel = userVector.reason_analysis?.attribution || '';
    insertPlay(scene, baseEmotion, reasonLabel, engineResult, !!userVector.reason_analysis?.is_void).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        updateMapStatus();
        updateSealButton();
        LOG('engine', engineResult);
        beginPostSubmitSequence(engineResult, baseEmotion);
      });
    });
  }

  function finishScene(scene, result, vec, reasonLabel, isVoid) {
    if (typeof window.destroyFloatingAnchor === 'function') window.destroyFloatingAnchor();
    fadeOut(SFX.white, 500, true);
    LOG('engine', result);
    game.lastResult = result;
    game.lastUserEmotion = Object.assign({}, vec);
    const rgb = emotionVectorToRGB(vec);
    game.lastTintRGB = rgb;
    const vad = projectEmotionToVADContour(vec);
    game.cursorTarget = vadToPercent(vad);

    insertPlay(scene, vec, reasonLabel, result, isVoid).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        showPostSubmitNPC(result);
      });
    });
  }

  async function insertPlay(scene, vec, reasonLabel, result, isVoid) {
    let userId = null;
    try {
      const { data: { user } } = await sb.auth.getUser();
      userId = user?.id || null;
    } catch (_) {}
    const row = {
      memory_id: game.memoryId,
      scene_id: scene.id,
      user_emotion: vec,
      user_reason: isVoid ? 'void' : (reasonLabel || ''),
      alignment: result.alignment_score,
      mismatch_type: isVoid ? 'void_mismatch' : (result.mismatch_type || null),
      wave_data: null,
      layer_id: 0,
      user_id: userId,
    };
    const { error } = await sb.from('plays').insert(row);
    if (error) LOG('plays insert error', error);
    else LOG('plays saved', row);
  }

  async function reloadPlaysOnly() {
    const { data, error } = await sb.from('plays')
      .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
      .eq('memory_id', game.memoryId)
      .order('created_at');
    if (!error) game.plays = data || [];
  }

  function afterTerrainReturn(result) {
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    game.postSubmitTerrainCleanup = null;
    stopTerrainAnimLoop();
    game.terrainRipple = 0;
    const tc = document.getElementById('terrainCanvas');
    if (tc) {
      tc.classList.remove('clickable');
      tc.style.opacity = '';
      tc.style.filter = '';
    }
    document.getElementById('terrainBar').classList.remove('awaiting-terrain');
    const scene = game.scenes[game.currentSceneIndex];
    const originSceneId = scene ? scene.id : null;
    stopWave();
    const lastTr = game.traces[game.traces.length - 1];
    if (!lastTr || lastTr.userEmotion == null) {
      game.traces.push({ sceneIndex: game.currentSceneIndex, alignment: result.alignment_score });
    }
    if (scene && !game.visitedCore[scene.id]) {
      game.visitedCore[scene.id] = true;
      if (!game.visitOrder.includes(scene.id)) game.visitOrder.push(scene.id);
      const pin = game.currentPinId ? game.pins.find(p => p.id === game.currentPinId) : null;
      if (!pin || pin.type === 'core') game.coreVisitCount++;
    }
    document.getElementById('sceneMode').classList.remove('active');
    document.getElementById('mapMode').classList.add('active');
    document.getElementById('terrainBar').classList.remove('clickable');
    document.getElementById('terrainClickHint').style.display = 'none';
    buildTerrainFromData();
    buildPins();
    // 이전 accessible 상태 저장 (unlock 차집합 계산용)
    game._prevAccessiblePinIds = new Set(game.accessiblePinIds || []);
    handleEmotionResult({
      userEmotion: game.lastUserEmotion || {},
      result: result || game.lastResult || {},
      originSceneId,
    });
    // 차집합: 새로 열린 핀 계산
    const _pattern = (result && result.transition_pattern) || 'bridge';
    const _newPinIds = new Set();
    if (game.accessiblePinIds) {
      game.accessiblePinIds.forEach(id => {
        if (!game._prevAccessiblePinIds.has(id)) {
          const p = game.pins.find(pp => pp.id === id);
          if (p && !game.visitedCore[p.sceneId]) _newPinIds.add(id);
        }
      });
    }
    game._unlockAnimInfo = _newPinIds.size > 0 ? { newPinIds: _newPinIds, pattern: _pattern } : null;
    console.log('[UNLOCK] pattern:', _pattern, 'prev:', Array.from(game._prevAccessiblePinIds), 'new:', Array.from(game.accessiblePinIds || []), 'diff:', Array.from(_newPinIds), 'animInfo:', game._unlockAnimInfo);
    // trace lines 추가 (origin → 새 핀)
    const _originPin = game.currentPinId ? game.pins.find(p => p.id === game.currentPinId) : null;
    if (_originPin && _newPinIds.size > 0 && _pattern !== 'fixation') {
      _newPinIds.forEach(nid => {
        const np = game.pins.find(p => p.id === nid);
        if (np) {
          game.traceLines.push({ fromX: _originPin.x, fromY: _originPin.y, toX: np.x, toY: np.y, pattern: _pattern, _targetPinId: nid });
        }
      });
      // 오래된 선 제거 (최대 6개 유지)
      while (game.traceLines.length > 6) game.traceLines.shift();
    }
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    renderTraceLines();
    updateMapStatus();
    updateSealButton();
    startCursorLerp();
    game.currentSceneIndex = null;
    game.currentPinId = null;
  }

  function renderTerrainBar(sceneIndex, tintRGB, opts) {
    const canvas = document.getElementById('terrainCanvas');
    renderTerrainProfile(canvas, game.scenes, game.traces, sceneIndex, tintRGB, opts);
    if (tintRGB && tintRGB.length === 3) game.lastTerrainTint = tintRGB.slice();
  }

  function stopTerrainAnimLoop() {
    if (game.terrainAnimRaf) {
      cancelAnimationFrame(game.terrainAnimRaf);
      game.terrainAnimRaf = null;
    }
  }

  function ensureTerrainAnimLoop() {
    if (game.terrainAnimRaf) return;
    function tick() {
      let tint = null;
      if (game.terrainTintFrom && game.terrainTintTo && game.terrainTintLerp < 1) {
        game.terrainTintLerp = Math.min(1, game.terrainTintLerp + 0.032);
        tint = lerpRgb(game.terrainTintFrom, game.terrainTintTo, easeOutCubic(game.terrainTintLerp));
      } else if (game.terrainTintTo && game.terrainTintLerp >= 1) {
        tint = game.terrainTintTo.slice();
      } else if (game.lastTerrainTint && game.terrainTintLerp >= 1 && !game.terrainTintTo) {
        tint = game.lastTerrainTint.slice();
      }
      if (game.terrainRipple > 0.002) {
        game.terrainRipple = Math.max(0, game.terrainRipple - game.terrainRippleDecay);
        game.terrainRipplePhase += 0.07;
      }
      const ripplePx = game.terrainRipple * 16;
      renderTerrainBar(game.currentSceneIndex, tint, { rippleAmp: ripplePx, rippleTime: game.terrainRipplePhase });
      const tintAnimating = game.terrainTintFrom && game.terrainTintTo && game.terrainTintLerp < 1;
      if (tintAnimating || game.terrainRipple > 0.004) {
        game.terrainAnimRaf = requestAnimationFrame(tick);
      } else {
        game.terrainAnimRaf = null;
      }
    }
    game.terrainAnimRaf = requestAnimationFrame(tick);
  }

  function enableTerrainCanvasClick(result) {
    const canvas = document.getElementById('terrainCanvas');
    const bar = document.getElementById('terrainBar');
    if (!canvas) return;
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    bar.classList.add('awaiting-terrain');
    canvas.classList.add('clickable');
    try {
      if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
    } catch (_) {}
    function onTerrainClick(e) {
      e.preventDefault();
      e.stopPropagation();
      playOnce(SFX.footstep);
      fadeOut(SFX.void, 400, true);
      fadeIn(SFX.ambient, 0.12, 1000);
      canvas.removeEventListener('click', onTerrainClick);
      game.postSubmitTerrainCleanup = null;
      stopTerrainAnimLoop();
      game.terrainRipple = 0;
      game.terrainTintLerp = 1;
      game.terrainTintFrom = null;
      game.terrainTintTo = null;
      canvas.classList.remove('clickable');
      bar.classList.remove('awaiting-terrain');
      const fadeFrom = game.lastTerrainTint || [196, 168, 130];
      let k = 0;
      function fadeStep() {
        k += 0.12;
        const c = lerpRgb(fadeFrom, [196, 168, 130], Math.min(1, k));
        renderTerrainBar(game.currentSceneIndex, c, { rippleAmp: 0, rippleTime: 0 });
        if (k < 1) requestAnimationFrame(fadeStep);
        else {
          renderTerrainBar(game.currentSceneIndex, null, {});
          afterTerrainReturn(result);
        }
      }
      requestAnimationFrame(fadeStep);
    }
    canvas.addEventListener('click', onTerrainClick);
    game.postSubmitTerrainCleanup = () => {
      canvas.removeEventListener('click', onTerrainClick);
      canvas.classList.remove('clickable');
      bar.classList.remove('awaiting-terrain');
    };
  }

  function beginPostSubmitSequence(result, baseEmotion) {
    const emBase = baseEmotion || {};
    const dom = getDominantColor(emBase);
    const bucket = result.alignment_bucket || 'MID';
    transitionWavePostSubmit(dom, bucket, emBase, result.alignment_score);

    const npc = document.getElementById('sceneNpc');
    const _postPres = game.contPresentation || { stage: 'stable', band: 'weak' };
    const _anotherMeLabel = LANG === 'ko' ? '또다른 나' : 'Another Me';
    let _postLine;
    if (_postPres.stage !== 'stable' && T.anotherMePost && T.anotherMePost[_postPres.band]) {
      _postLine = T.anotherMePost[_postPres.band];
    } else {
      const lines = getNpcLines();
      _postLine = lines[Math.floor(Math.random() * lines.length)];
    }
    npc.innerHTML =
      '<span class="another-me-label">' + _anotherMeLabel + '</span>' +
      '<span class="another-me-whisper">' + _postLine + '</span>';

    renderTerrainBar(game.currentSceneIndex, game.lastTerrainTint || null, {});
    document.getElementById('terrainClickHint').style.display = 'block';
    const sub = document.getElementById('submitBtn');
    const voi = document.getElementById('voidBtn');
    if (sub) sub.disabled = true;
    if (voi) voi.disabled = true;
    document.querySelector('#terrainClickHint .hint-txt').textContent = T.terrainHintAlign(
      (result.alignment_score * 100).toFixed(0),
      result.alignment_bucket || ''
    );

    // 입력 영역을 분석 완료 타이핑 메시지로 교체
    const inputArea = document.getElementById('emotionInputArea');
    inputArea.style.opacity = '1';
    inputArea.innerHTML = '<p id="analysisDoneMsg" style="font-size:14px;color:#c4a882;opacity:0.85;min-height:40px;line-height:1.8;letter-spacing:0.02em;"></p>';
    const msgEl = document.getElementById('analysisDoneMsg');
    const fullText = T.analysisDone;
    let charIdx = 0;
    const typeInterval = setInterval(() => {
      if (charIdx < fullText.length) {
        msgEl.textContent += fullText[charIdx];
        charIdx++;
      } else {
        clearInterval(typeInterval);
      }
    }, 45);

    game.terrainTintFrom = null;
    game.terrainTintTo = null;
    game.terrainTintLerp = 1;
    game.terrainRipple = 0;
    stopTerrainAnimLoop();

    // ── 파동 흡수 시퀀스 (Wave Absorption) ──
    var waveTopEl = document.getElementById('waveTop');
    var terrainBarEl = document.getElementById('terrainBar');
    var _rgb = dom; // emotion RGB [r, g, b]

    // 200ms: Phase 1 — 파동 소멸 시작 + #waveTop 하단 잔광
    setTimeout(function () {
      collapseWaveAnimation(800, _rgb);
      waveTopEl.classList.add('wave-draining');
      waveTopEl.style.boxShadow = 'inset 0 -20px 40px -10px rgba(' + _rgb[0] + ',' + _rgb[1] + ',' + _rgb[2] + ',0.3)';
    }, 200);

    // 600ms: Phase 2 — 잔광 전이 (waveTop → terrainBar)
    setTimeout(function () {
      waveTopEl.classList.remove('wave-draining');
      waveTopEl.style.boxShadow = '';
      terrainBarEl.classList.add('terrain-absorbing');
      terrainBarEl.style.boxShadow = 'inset 0 20px 40px -10px rgba(' + _rgb[0] + ',' + _rgb[1] + ',' + _rgb[2] + ',0.25)';
    }, 600);

    // 700ms: 지형 tint 시작 (감정색으로 물들기, 브라이트 부스트)
    setTimeout(function () {
      var bright = [Math.min(255, Math.round(_rgb[0] * 1.3)), Math.min(255, Math.round(_rgb[1] * 1.3)), Math.min(255, Math.round(_rgb[2] * 1.3))];
      game.terrainTintFrom = (game.lastTerrainTint || [196, 168, 130]).slice();
      game.terrainTintTo = bright;
      game.terrainTintLerp = 0;
      ensureTerrainAnimLoop();
    }, 700);

    // 800ms: 지형 ripple 강화 + terrainBar 잔광 소멸
    setTimeout(function () {
      game.terrainRipple = 1.8;
      game.terrainRipplePhase = performance.now() * 0.001;
      ensureTerrainAnimLoop();
      fadeIn(SFX.void, 0.25, 800);
      // 브라이트 tint를 원래 감정색으로 서서히 되돌림
      game.terrainTintFrom = game.terrainTintTo ? game.terrainTintTo.slice() : _rgb.slice();
      game.terrainTintTo = _rgb.slice();
      game.terrainTintLerp = 0;
    }, 800);

    // 1000ms: terrainBar 잔광 제거
    setTimeout(function () {
      terrainBarEl.classList.remove('terrain-absorbing');
      terrainBarEl.style.boxShadow = '';
    }, 1000);

    // 1400ms: 지형 클릭 활성화
    setTimeout(function () { enableTerrainCanvasClick(result); }, 1400);
  }

  function updateMapStatus() {
    const el = document.getElementById('mapStatus');
    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    el.textContent = T.mapStatus(game.coreVisitCount, pollution);
  }

  function updateSealButton() {
    const btn = document.getElementById('sealBtn');
    if (!btn) return;
    btn.disabled = game.sealed || game.coreVisitCount < 3;
    btn.textContent = T.sealBtn;
    btn.title = btn.disabled && !game.sealed ? T.sealBlocked : '';
  }

  function startCursorLerp() {
    const cursor = document.getElementById('emotionCursor');
    if (!cursor) return;
    cursor.style.display = 'block';
    if (game.cursorRaf) cancelAnimationFrame(game.cursorRaf);
    function tick() {
      game.cursorPos.x += (game.cursorTarget.x - game.cursorPos.x) * 0.08;
      game.cursorPos.y += (game.cursorTarget.y - game.cursorPos.y) * 0.08;
      cursor.style.left = game.cursorPos.x + '%';
      cursor.style.top = game.cursorPos.y + '%';
      if (game.lastTintRGB) {
        cursor.style.boxShadow = '0 0 12px rgba(' + game.lastTintRGB[0] + ',' + game.lastTintRGB[1] + ',' + game.lastTintRGB[2] + ',0.45)';
      }
      game.cursorRaf = requestAnimationFrame(tick);
    }
    tick();
  }

  async function loadMemories() {
    const { data, error } = await sb.from('memories').select('id, title').order('id');
    if (error) throw error;
    game.memories = data || [];
    const sel = document.getElementById('memorySelect');
    sel.innerHTML = '';
    game.memories.forEach(m => {
      const op = document.createElement('option');
      op.value = m.id;
      op.textContent = (m.title || '(untitled)') + ' · ' + String(m.id).slice(0, 8) + '…';
      sel.appendChild(op);
    });
  }

  async function loadMemoryData(memoryId) {
    game.memoryId = memoryId;
    if (window.memoriesData) {
      const found = window.memoriesData.find(function(m) { return m.id === memoryId; });
      if (found) {
        game.memoryTitle = found.title || '';
        game.memoryLayers = found.layers || 0;
      }
    }
    // Fetch scenes, plays, and memory row in parallel
    const [scenesRes, playsRes, memRes] = await Promise.all([
      sb.from('scenes').select('*').eq('memory_id', memoryId).order('scene_order'),
      sb.from('plays')
        .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
        .eq('memory_id', memoryId)
        .order('created_at'),
      sb.from('memories')
        .select('id, title, layers, cont_stage, cont_drift, cont_fixation, cont_depth, cont_last_mismatch')
        .eq('id', memoryId),
    ]);
    if (scenesRes.error) throw scenesRes.error;
    if (playsRes.error) throw playsRes.error;
    game.scenes = scenesRes.data || [];
    game.plays = playsRes.data || [];

    // Extract memory row for cont_* fields
    let memRow = (!memRes.error && memRes.data && memRes.data.length > 0) ? memRes.data[0] : null;
    if (memRow) {
      game.memoryTitle = memRow.title || game.memoryTitle || '';
      game.memoryLayers = memRow.layers || game.memoryLayers || 0;
    }

    if (!game.scenes.length && window._simulatedScenesMap && window._simulatedScenesMap[memoryId]) {
      LOG('Supabase scenes empty, using local fallback for', memoryId);
      game.scenes = window._simulatedScenesMap[memoryId].map(function(s) {
        return Object.assign({}, s, { memory_id: memoryId });
      });
    }
    if (!game.plays.length && window._simulatedPlaysMap && window._simulatedPlaysMap[memoryId]) {
      LOG('Supabase plays empty, using local fallback for', memoryId);
      game.plays = window._simulatedPlaysMap[memoryId];
    }
    // === Contamination (MVP v3 + EMA) ===
    // Priority: URL override > DB cont_* > replayFromPlays
    const _urlP = new URLSearchParams(location.search);
    const urlStage = _urlP.get('cont_stage');
    const dbStage = urlStage || memRow?.cont_stage;
    if (dbStage && dbStage !== 'stable') {
      const base = createEmptyState();
      game.contState = Object.assign(base, {
        cont_drift: parseFloat(_urlP.get('cont_drift')) || memRow?.cont_drift || 0,
        cont_fixation: parseFloat(_urlP.get('cont_fixation')) || memRow?.cont_fixation || 0,
        cont_stage: dbStage,
        cont_depth: parseInt(_urlP.get('cont_depth'), 10) || memRow?.cont_depth || 0,
        cont_last_mismatch: _urlP.get('cont_last_mismatch') || memRow?.cont_last_mismatch || 'none',
      });
      LOG('contamination: using override (cont_stage=' + dbStage + ')');
    } else {
      let _allPlays = game.plays.slice();
      if (window._simulatedPlaysMap && window._simulatedPlaysMap[memoryId]) {
        const sim = window._simulatedPlaysMap[memoryId];
        if (_allPlays.length < sim.length) _allPlays = _allPlays.concat(sim);
      }
      _allPlays.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      game.contState = replayFromPlays(_allPlays);
    }
    game.contPresentation = getPresentationState(game.contState);
    game.contMismatch = _urlP.get('cont_last_mismatch') || memRow?.cont_last_mismatch || getDominantMismatch(game.plays);
    LOG('contamination:', game.contPresentation.stage, '|', game.contPresentation.band,
      '| drift:', game.contState.cont_drift.toFixed(3),
      '| fix:', game.contState.cont_fixation.toFixed(3),
      '| depth:', game.contState.cont_depth,
      '| dir:', game.contPresentation.dominant_emotion_label,
      '| mismatch:', game.contMismatch);

    game.visitedCore = {};
    game.coreVisitCount = 0;
    game.traces = [];
    game.traceLines = [];
    game.visitOrder = [];
    game._unlockAnimInfo = null;
    game._prevAccessiblePinIds = null;
    game.previousBucket = null;
    game.emotionHistory = [];
    game.userEmotionTrajectory = [];
    game.originalEmotionTrajectory = [];
    game.sceneScores = [];
    game.accessiblePinIds = null;
    game.lastUserEmotion = null;
    game.playTestWaveUserIdle = true;
    const pollution = buildTerrainFromData();
    buildPins();
    applyInitialAccess();
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    updateMapStatus();
    updateSealButton();
    LOG('loaded scenes', game.scenes.length, 'plays', game.plays.length, 'pollution', pollution);
  }

  function bindMapResize() {
    window.addEventListener('resize', () => {
      if (document.getElementById('mapMode').classList.contains('active')) renderContourCanvas();
    });
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const id = document.getElementById('memorySelect').value;
    if (!id) return;
    initAudio();
    document.getElementById('selectScreen').style.display = 'none';
    document.getElementById('mapMode').classList.add('active');
    try {
      await loadMemoryData(id);
      fadeIn(SFX.ambient, 0.12, 3000);
      startCursorLerp();
    } catch (e) {
      console.error(e);
      alert('Failed to load: ' + (e.message || e));
    }
  });
  document.getElementById('sealBtn').addEventListener('click', async () => {
    if (game.sealed || game.coreVisitCount < 3) return;
    game.sealed = true;

    // === Session-end contamination update (MVP v3) ===
    // Construct session engine output from last V4 result + traces
    if (game.lastResult && game.contState) {
      const dbg = game.lastResult.debug || {};
      const _vad = game.emotionCursor || { v: 0, a: 0, d: 0 };
      const sessionEngineOutput = {
        alignment: game.lastResult.alignment_score || 0,
        level: dbg.level || 0,
        shape: dbg.shape || 1,
        shape_active: dbg.shape_active || false,
        transition_pattern: game.lastResult.transition_pattern || 'bridge',
        mismatch_type: game.lastResult.mismatch_type || 'none',
        fixation_level: dbg.fixation_level || 0,
        user_valence: _vad.v || 0,
        user_arousal: _vad.a || 0,
        user_dominance: _vad.d || 0,
      };
      game.contState = updateContamination(game.contState, sessionEngineOutput);
      game.contPresentation = getPresentationState(game.contState);
      LOG('seal contamination:', game.contPresentation.stage, '|', game.contPresentation.band,
        '| drift:', game.contState.cont_drift.toFixed(3),
        '| fix:', game.contState.cont_fixation.toFixed(3),
        '| dir:', game.contPresentation.dominant_emotion_label,
        '| vad:', game.contState.drift_dir_v.toFixed(2), game.contState.drift_dir_a.toFixed(2), game.contState.drift_dir_d.toFixed(2));
    }

    initAudio();
    fadeOut(SFX.ambient, 1500, true);
    fadeOut(SFX.void, 500, true);
    fadeOut(SFX.white, 500, true);
    setTimeout(() => {
      if (SFX.void && !SFX.void._broken) {
        SFX.void.currentTime = 0;
        SFX.void.volume = 0.5;
        SFX.void.play().catch(() => {});
        setTimeout(() => fadeOut(SFX.void, 1000, true), 1500);
      }
    }, 2000);
    setTimeout(() => {
      fadeIn(SFX.rain, 0.15, 4000);
    }, 4500);
    document.getElementById('mapMode').classList.remove('active');
    const rev = document.getElementById('revealScreen');
    rev.classList.add('active');
    document.getElementById('revealTitle').textContent = T.revealLoading;
    document.getElementById('revealBody').textContent = '';
    const avgAlign = game.traces.length
      ? game.traces.reduce((s, t) => s + t.alignment, 0) / game.traces.length
      : 0;
    const visits = game.traces.map((t, i) => ({
      pin_type: t.pinType || 'core',
      scene_id: t.sceneId,
      scene_text: t.sceneText || '',
      order: i + 1,
      emotion_data: t.userVector || { base: t.userEmotion || {} },
      engine_result: { alignment_score: t.alignment, alignment_bucket: t.bucket || 'MID', transition_pattern: t.pattern || 'bridge', mismatch_type: t.mismatch || null }
    }));
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/generate-reveal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          visits,
          memory_title: game.memoryTitle || '',
          emotion_trajectory: game.emotionTrajectory || [],
          lang: LANG,
        })
      });
      const data = await res.json();
      if (data.narrative) {
        document.getElementById('revealTitle').textContent = T.revealTitle;
        typeRevealText(document.getElementById('revealBody'), data.narrative);
      } else {
        document.getElementById('revealTitle').textContent = T.revealTitle;
        document.getElementById('revealBody').textContent = T.revealFallback;
      }
    } catch (e) {
      console.error('Reveal error:', e);
      document.getElementById('revealTitle').textContent = T.revealTitle;
      document.getElementById('revealBody').textContent = T.revealFallback;
    }
    document.getElementById('revealStats').textContent = T.stats(avgAlign, game.coreVisitCount);

    const _urlParams = new URLSearchParams(window.location.search);
    const _fromDemo = _urlParams.get('memory');
    const _targetMemoryId = _fromDemo || game.memoryId;
    if (_targetMemoryId) {
      document.getElementById('revealRestart').style.display = 'none';
      if (!document.getElementById('revealContinueBtn')) {
        const continueBtn = document.createElement('button');
        continueBtn.id = 'revealContinueBtn';
        continueBtn.textContent = T.revealContinue;
        continueBtn.className = 'action-btn';
        continueBtn.style.marginTop = '1.5rem';
        continueBtn.addEventListener('click', () => {
          initAudio();
          fadeOut(SFX.rain, 2000, true);
          setTimeout(() => {
            const id = _targetMemoryId;
            if (!id) return;
            const viewEl = document.getElementById('strataView');
            const backBtn = document.getElementById('backToMenu');
            if (backBtn) backBtn.style.display = 'block';
            if (!window.showStrataView) {
              console.warn('[play-test] window.showStrataView가 없습니다. strataView.js 로딩을 확인하세요.');
              if (viewEl) viewEl.style.display = 'none';
              return;
            }
            window.showStrataView(id, null, function () {
              if (backBtn) backBtn.style.display = 'block';
            });
          }, 2000);
        });
        const restartBtn = document.getElementById('revealRestart');
        restartBtn.parentNode.insertBefore(continueBtn, restartBtn.nextSibling);
      }
    }
  });

  document.getElementById('revealRestart').addEventListener('click', () => {
    initAudio();
    fadeOut(SFX.rain, 2000, true);
    setTimeout(() => location.reload(), 2000);
  });

  window.addEventListener('beforeunload', () => { stopAll(); });

  function applyPlayTestI18nLabels() {
    const th = document.querySelector('#terrainClickHint .hint-txt');
    if (th) th.textContent = T.exploreTerrain;
    const ms = document.getElementById('mapStatus');
    if (ms) ms.textContent = T.mapStatus(0, 0);
    const seal = document.getElementById('sealBtn');
    if (seal) {
      seal.textContent = T.sealBtn;
      seal.title = T.sealBlocked;
    }
    const rt = document.getElementById('revealTitle');
    if (rt) rt.textContent = T.revealTitle;
    const rr = document.getElementById('revealRestart');
    if (rr) rr.textContent = T.revealRestart;
    const rc = document.getElementById('revealContinueBtn');
    if (rc) rc.textContent = T.revealContinue;
    const sub = document.getElementById('submitBtn');
    const voi = document.getElementById('voidBtn');
    if (sub) sub.textContent = T.submitBtn;
    if (voi) voi.textContent = T.voidBtn;
  }

  // Console shortcut: temGoStrata() / temGoStrata('memory-uuid')
  window.temGoStrata = function (memoryId) {
    const id = memoryId || game.memoryId || new URLSearchParams(window.location.search).get('memory');
    if (!id) {
      console.warn('[TEM] memoryId가 없습니다. temGoStrata(\"memory-id\")로 호출하세요.');
      return;
    }
    const backBtn = document.getElementById('backToMenu');
    if (backBtn) backBtn.style.display = 'block';
    if (!window.showStrataView) {
      console.warn('[TEM] window.showStrataView가 없습니다. strataView.js 로딩을 확인하세요.');
      return;
    }
    window.showStrataView(id, null, function () {
      if (backBtn) backBtn.style.display = 'block';
    });
  };

  function temMenuHref() {
    try {
      if (location.protocol === 'file:') return 'index.html';
      const h = location.hostname || '';
      const isLocal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || (typeof h === 'string' && h.endsWith('.local'));
      if (isLocal) return new URL('index.html', location.href).href;
      return '/';
    } catch (_) {
      return '/';
    }
  }

  (function bindBackToMenu() {
    var btn = document.getElementById('backToMenu');
    if (btn) btn.addEventListener('click', function () { window.location.href = temMenuHref(); });
  })();

  // ── Strata 퇴장 플로우: 로그인 안내 ──
  (function bindStrataExit() {
    var closeBtn = document.getElementById('strataCloseBtn');
    var modal = document.getElementById('strataExitModal');
    var msgEl = document.getElementById('strataExitMsg');
    var loginBtn = document.getElementById('strataExitLogin');
    var skipBtn = document.getElementById('strataExitSkip');
    if (!closeBtn || !modal) return;

    // i18n 텍스트
    var txt = LANG === 'ko'
      ? { msg: '로그인하면 이 기억에 남긴 흔적을 저장할 수 있습니다.', login: '로그인', skip: '메인 메뉴로' }
      : { msg: 'Sign in to save the traces you left on this memory.', login: 'Sign in', skip: 'Main menu' };

    if (msgEl) msgEl.textContent = txt.msg;
    if (loginBtn) loginBtn.textContent = txt.login;
    if (skipBtn) skipBtn.textContent = txt.skip;

    function goMenu() {
      modal.style.display = 'none';
      window.location.href = temMenuHref();
    }

    closeBtn._strataExitBound = true; // strataView.js 폴백 바인딩 방지
    closeBtn.onclick = null;         // 기존 onclick 제거
    // "Leave strata behind" 클릭 시 — closeStrataView 호출 후 분기
    closeBtn.addEventListener('click', async function (e) {
      e.stopPropagation();
      // 이미 로그인 상태면 바로 메인메뉴
      try {
        var res = await sb.auth.getUser();
        if (res.data && res.data.user) {
          // closeStrataView는 strataView.js에서 바인딩됨 — onclick 그대로 호출
          if (typeof window.closeStrataView === 'function') window.closeStrataView();
          else { var v = document.getElementById('strataView'); if (v) v.style.display = 'none'; }
          goMenu();
          return;
        }
      } catch (_) {}

      // 비로그인 → 모달 표시
      if (typeof window.closeStrataView === 'function') window.closeStrataView();
      else { var v = document.getElementById('strataView'); if (v) v.style.display = 'none'; }
      modal.style.display = 'flex';
    });

    // 로그인 버튼 → index.html의 로그인 모달로 이동 (쿼리 파라미터로 안내)
    if (loginBtn) loginBtn.addEventListener('click', function () {
      var href = temMenuHref();
      var sep = href.indexOf('?') >= 0 ? '&' : '?';
      window.location.href = href + sep + 'action=login';
    });

    // 스킵 → 메인메뉴
    if (skipBtn) skipBtn.addEventListener('click', goMenu);
  })();

  (async function init() {
    applyPlayTestI18nLabels();
    bindMapResize();
    let urlMemoryId = urlParams.get('memory');
    if (!urlMemoryId) {
      try {
        urlMemoryId =
          sessionStorage.getItem('tem_archive_memory_id') ||
          sessionStorage.getItem('demoMemoryId') ||
          '';
      } catch (_) {
        urlMemoryId = '';
      }
    }

    if (urlMemoryId) {
      document.getElementById('selectScreen').style.display = 'none';
      document.getElementById('mapMode').classList.add('active');
      try {
        await loadMemoryData(urlMemoryId);
        try {
          sessionStorage.removeItem('tem_archive_memory_id');
          sessionStorage.removeItem('demoMemoryId');
        } catch (_) {}
        initAudio();
        fadeIn(SFX.ambient, 0.12, 3000);
        startCursorLerp();
      } catch (e) {
        console.error(e);
        alert('Failed to load: ' + (e.message || e));
      }
    } else {
      try {
        await loadMemories();
      } catch (e) {
        console.error(e);
      }
    }
  })();

  </script>
