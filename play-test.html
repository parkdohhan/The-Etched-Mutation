    lastResult: null,
    lastTintRGB: null,
    traces: [],
    waveT: 0,
    waveRaf: null,
    voidTimeout: null,
    inputDeadline: null,
    cursorPos: { x: 50, y: 50 },
    cursorTarget: { x: 50, y: 50 },
    cursorRaf: null,
    lastUserEmotion: null,
    accessiblePinIds: null,
    currentPinId: null,
    waveRgb: [120, 120, 140],
    waveTargetRgb: [120, 120, 140],
    waveBucket: 'MID',
    waveGlitch: 0,
    terrainTintLerp: 0,
    terrainTintFrom: null,
    terrainTintTo: null,
    terrainRipple: 0,
    terrainRippleDecay: 0.018,
    terrainRipplePhase: 0,
    terrainAnimRaf: null,
    lastTerrainTint: null,
    postSubmitTerrainCleanup: null,
  };

  const TRANSITION_RULES = {
    echo_follow: { radius: 0.42 },
    bridge: { radius: 0.62 },
    contradiction: { radius: 0.36 },
    displacement: { radius: 0.48 },
    avoidance: { radius: 0.24 },
    fixation: { radius: 0.09 },
  };

  function emotionToMapCoords(emotion) {
    const af = projectEmotionToAFContour(emotion || {});
    const nx = (af.x * HALF) / SIZE + 0.5;
    const ny = (af.z * HALF) / SIZE + 0.5;
    return {
      x: Math.max(0, Math.min(1, nx)),
      y: Math.max(0, Math.min(1, ny)),
    };
  }

  function mapCoordsSpread(baseX, baseY, idx, sceneId) {
    const s = String(sceneId != null ? sceneId : idx);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    const ang = (Math.abs(h) % 628) / 100;
    const mag = 0.012 + (Math.abs(h) % 23) / 2300;
    let nx = baseX + Math.cos(ang) * mag;
    let ny = baseY + Math.sin(ang * 1.07) * mag;
    nx = Math.max(0.03, Math.min(0.97, nx));
    ny = Math.max(0.03, Math.min(0.97, ny));
    return { x: nx, y: ny };
  }

  function distMap(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function updateAccess(pattern, emotionPosition, originSceneId) {
    const cores = game.pins.filter(p => p.type === 'core' || p.type === 'bridge');
    const originPin = cores.find(p => p.sceneId === originSceneId) || null;
    const rule = TRANSITION_RULES[pattern] || TRANSITION_RULES.bridge;
    let center = emotionPosition && (emotionPosition.x != null)
      ? { x: emotionPosition.x, y: emotionPosition.y }
      : { x: 0.5, y: 0.5 };
    if (originPin && originPin.mapX != null) {
      center = {
        x: (center.x + originPin.mapX) / 2,
        y: (center.y + originPin.mapY) / 2,
      };
    }
    let withDist = cores.map(p => ({
      pin: p,
      d: distMap(center, { x: p.mapX, y: p.mapY }),
    }));
    console.log('[DEBUG] updateAccess center', center, 'pattern', pattern, 'withDist count', withDist.length);

    let selected = [];
    if (pattern === 'fixation' && originPin) {
      selected = [originPin];
    } else {
      selected = withDist.filter(o => o.d <= rule.radius).map(o => o.pin);
      if (!selected.length) {
        const r2 = rule.radius * 1.85;
        selected = withDist.filter(o => o.d <= r2).map(o => o.pin);
      }
      if (!selected.length) {
        selected = cores.filter(p => !game.visitedCore[p.sceneId]);
      }
      if (!selected.length) {
        selected = cores.slice();
      }
    }

    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene && (pattern === 'avoidance' || pattern === 'contradiction')) {
      const vp = game.pins.find(p => p.type === 'voidPin');
      if (vp) selected.push(vp);
    }

    game.accessiblePinIds = new Set(selected.map(p => p.id));
    console.log('[DEBUG] updateAccess selected ids', Array.from(game.accessiblePinIds));
  }

  function handleEmotionResult(ctx) {
    const userEmotion = ctx.userEmotion || {};
    const result = ctx.result || {};
    const originSceneId = ctx.originSceneId;
    const emotionPosition = emotionToMapCoords(userEmotion);
    const bucket = result.alignment_bucket;
    const mismatch = result.mismatch_type;
    const alignment = result.alignment_score;
    const pattern = result.transition_pattern != null
      ? result.transition_pattern
      : getTransitionPattern(bucket, mismatch);

    console.log('[DEBUG] userEmotion:', userEmotion);
    console.log('[DEBUG] emotionPosition:', emotionPosition);
    console.log('[DEBUG] alignment:', alignment, 'bucket:', bucket, 'mismatch:', mismatch);
    console.log('[DEBUG] pattern:', pattern);
    console.log('[DEBUG] pin positions:', game.pins.map(p => ({
      id: p.id,
      x: (p.mapX != null ? p.mapX : p.x / 100).toFixed(3),
      y: (p.mapY != null ? p.mapY : p.y / 100).toFixed(3),
      type: p.type,
    })));

    if (!game.pins.length) {
      game.accessiblePinIds = new Set();
      return;
    }
    updateAccess(pattern, emotionPosition, originSceneId);
    syncPinStateFlags();
    console.log('[DEBUG] active after updateAccess:', game.pins.filter(p => p.state === 'active').map(p => p.id));
  }

  function syncPinStateFlags() {
    game.pins.forEach(p => {
      if (p.type === 'core' || p.type === 'bridge') {
        const can = !!game.visitedCore[p.sceneId] || !!(game.accessiblePinIds && game.accessiblePinIds.has(p.id));
        p.state = can ? 'active' : 'locked';
      } else if (p.type === 'voidPin') {
        const can = !!(game.accessiblePinIds && game.accessiblePinIds.has(p.id)) || !!game.visitedCore[p.sceneId];
        p.state = can ? 'active' : 'locked';
      } else {
        p.state = 'locked';
      }
    });
  }

  function applyInitialAccess() {
    const cores = game.pins.filter(p => p.type === 'core' || p.type === 'bridge');
    const unvisited = cores.filter(p => !game.visitedCore[p.sceneId]);
    const pool = unvisited.length ? unvisited : cores.slice();
    const sorted = pool.slice().sort((a, b) => (a.sceneOrder || 0) - (b.sceneOrder || 0));
    const initialCount = Math.min(3, sorted.length);
    const picked = sorted.slice(0, initialCount);
    game.accessiblePinIds = new Set(picked.map(p => p.id));
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vp = game.pins.find(p => p.type === 'voidPin');
      if (vp) game.accessiblePinIds.add(vp.id);
    }
  }

  function getAttributionDirection(attribution) {
    if (!attribution) return null;
    const internal = ['self_blame', 'self_doubt', 'self_punishment', 'guilt_driven', 'unknown'];
    const external = ['other_blame', 'betrayal', 'external_threat', 'abandonment_by_other'];
    const situational = ['fate', 'circumstance', 'helpless_situation', 'inevitable', 'helpless'];
    if (internal.includes(attribution)) return 'internal';
    if (external.includes(attribution)) return 'external';
    if (situational.includes(attribution)) return 'situational';
    return null;
  }

  function getFearCategory(coreFear) {
    if (!coreFear) return null;
    const loss = ['abandonment', 'loss', 'separation', 'death_of_loved'];
    const worthlessness = ['inadequacy', 'failure', 'shame', 'not_enough'];
    const powerlessness = ['helplessness', 'loss_of_control', 'entrapment', 'vulnerability'];
    const punishment = ['punishment', 'rejection', 'judgment', 'exposure'];
    if (loss.includes(coreFear)) return 'loss';
    if (worthlessness.includes(coreFear)) return 'worthlessness';
    if (powerlessness.includes(coreFear)) return 'powerlessness';
    if (punishment.includes(coreFear)) return 'punishment';
    return null;
  }

  function calculateEmbeddingSimilarity(vecA, vecB) {
    if (!vecA || !vecB || !Array.isArray(vecA) || !Array.isArray(vecB) || vecA.length === 0 || vecA.length !== vecB.length) return 0;
    let dot = 0, ma = 0, mb = 0;
    for (let i = 0; i < vecA.length; i++) {
      const a = Number(vecA[i]) || 0, b = Number(vecB[i]) || 0;
      dot += a * b; ma += a * a; mb += b * b;
    }
    if (!ma || !mb) return 0;
    return Math.max(0, dot / Math.sqrt(ma * mb));
  }

  function calculateEmotionScore(userVector, originalVector, anchorEmotions) {
    if (!userVector || !originalVector) return 0;
    const userEmb = userVector.embedding;
    const origEmb = originalVector.embedding;
    if (userEmb && origEmb && Array.isArray(userEmb) && Array.isArray(origEmb) && userEmb.length && origEmb.length) {
      return calculateEmbeddingSimilarity(userEmb, origEmb);
    }
    const userBase = userVector.base || userVector;
    const origBase = originalVector.base || originalVector;
    return Math.max(0, cosineSimilarity(userBase, origBase, anchorEmotions));
  }

  function calculateReasonScore(userVector, originalVector, emotionScoreFallback) {
    const fb = emotionScoreFallback || 0;
    const userReason = userVector && userVector.reason_analysis;
    const origReason = originalVector && originalVector.reason_analysis;
    if (!userReason && !origReason) return fb * 0.3;
    if (!userReason || !origReason) return 0.15;
    let score = 0;
    if (userReason.attribution && origReason.attribution) {
      if (userReason.attribution === origReason.attribution) score += 0.45;
      else {
        const ud = getAttributionDirection(userReason.attribution);
        const od = getAttributionDirection(origReason.attribution);
        if (ud && ud === od) score += 0.20;
      }
    } else if (!userReason.attribution && !origReason.attribution) score += 0.15;
    if (userReason.core_fear && origReason.core_fear) {
      if (userReason.core_fear === origReason.core_fear) score += 0.35;
      else {
        const uc = getFearCategory(userReason.core_fear);
        const oc = getFearCategory(origReason.core_fear);
        if (uc && uc === oc) score += 0.15;
      }
    } else if (!userReason.core_fear && !origReason.core_fear) score += 0.10;
    if (userReason.target && origReason.target) {
      if (userReason.target === origReason.target) score += 0.20;
    } else if (!userReason.target && !origReason.target) score += 0.05;
    return Math.min(1, score);
  }

  function calculateAttitudeScore(userVector, originalVector, attitudeContext) {
    attitudeContext = attitudeContext || {};
    let score = 0.5;
    const userReason = (userVector && userVector.reason_analysis) || {};
    const origReason = (originalVector && originalVector.reason_analysis) || {};
    const userVoid = !!userReason.is_void;
    const origVoid = !!origReason.is_void;
    if (userVoid && origVoid) score = 0.8;
    else if (userVoid && !origVoid) score = 0.2;
    else if (!userVoid && origVoid) score = 0.6;
    else score = 0.7;
    const rawHistory = attitudeContext.emotionHistory;
    const emotionHistory = rawHistory || [];
    if (emotionHistory.length >= 2) {
      const fixationLevel = calculateFixationLevel(emotionHistory);
      score -= fixationLevel * 0.3;
    }
    const skipCount = attitudeContext.skipCount || 0;
    if (skipCount > 0) score -= Math.min(0.2, skipCount * 0.05);
    return Math.max(0, Math.min(1, score));
  }

  function calculateAlignment(emotionScore, reasonScore, attitudeScore) {
    return Math.max(0, Math.min(1, emotionScore * 0.4 + reasonScore * 0.4 + attitudeScore * 0.2));
  }

  function calculateFixationLevel(emotionHistory) {
    if (!emotionHistory || emotionHistory.length < 2) return 0;
    const recent = emotionHistory.slice(-3);
    if (recent.length < 2) return 0;
    let totalSim = 0, pairs = 0;
    for (let i = 0; i < recent.length - 1; i++) {
      for (let j = i + 1; j < recent.length; j++) {
        const a = recent[i], b = recent[j];
        if (!a || !b) continue;
        if (typeof a === 'object' && typeof b === 'object') {
          totalSim += Math.max(0, cosineSimilarity(a, b));
        } else if (typeof a === 'string' && typeof b === 'string') {
          totalSim += (a === b) ? 1.0 : 0.0;
        }
        pairs++;
      }
    }
    if (!pairs) return 0;
    return totalSim / pairs;
  }

  function getBucket(alignment, previousBucket, emotionHistory) {
    if (emotionHistory && emotionHistory.length >= 3) {
      const fixLevel = calculateFixationLevel(emotionHistory);
      if (fixLevel >= 0.85) return 'FIXATED';
    }
    if (previousBucket === 'HIGH' && alignment >= 0.45) return 'HIGH';
    if (previousBucket === 'LOW' && alignment <= 0.42) return 'LOW';
    if (alignment >= 0.55) return 'HIGH';
    if (alignment < 0.35) return 'LOW';
    return 'MID';
  }

  function getMismatchType(userVector, originalVector) {
    if (!userVector || !originalVector) return null;
    const userReason = userVector.reason_analysis || {};
    const origReason = originalVector.reason_analysis || {};
    if (!!userReason.is_void !== !!origReason.is_void) return 'void_mismatch';
    if (userReason.attribution && origReason.attribution && userReason.attribution !== origReason.attribution) {
      return 'attribution_mismatch';
    }
    if (userReason.target && origReason.target && userReason.target !== origReason.target) {
      const emotionSim = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
      if (emotionSim >= 0.5) return 'target_displacement';
    }
    const emotionSimilarity = cosineSimilarity(userVector.base || userVector, originalVector.base || originalVector);
    if (emotionSimilarity < 0.5) return 'emotion_mismatch';
    return null;
  }

  function getTransitionPattern(bucket, mismatchType) {
    if (bucket === 'FIXATED') return 'fixation';
    if (bucket === 'HIGH') return 'echo_follow';
    if (bucket === 'MID') return 'bridge';
    if (bucket === 'LOW') {
      switch (mismatchType) {
        case 'void_mismatch': return 'avoidance';
        case 'target_displacement': return 'displacement';
        case 'emotion_mismatch': return 'contradiction';
        case 'attribution_mismatch': return 'contradiction';
        default: return 'bridge';
      }
    }
    return null;
  }

  function byeoriCalculateStep(input, context) {
    context = context || {};
    const { userVector, originalVector, anchorEmotions = null } = input;
    const { previousBucket = null, emotionHistory = null, skipCount = 0 } = context;
    if (!userVector || !originalVector) {
      return { affective_position: { v: 0, a: 0, d: 0 }, alignment_score: 0, alignment_bucket: 'LOW', transition_pattern: null, mismatch_type: null, debug: {} };
    }
    const emotionScore = calculateEmotionScore(userVector, originalVector, anchorEmotions);
    const reasonScore = calculateReasonScore(userVector, originalVector, emotionScore);
    const attitudeScore = calculateAttitudeScore(userVector, originalVector, { emotionHistory, skipCount });
    const alignmentScore = calculateAlignment(emotionScore, reasonScore, attitudeScore);
    const alignmentBucket = getBucket(alignmentScore, previousBucket, emotionHistory);
    const mismatchType = getMismatchType(userVector, originalVector);
    const baseVec = userVector.base || userVector;
    const affectivePosition = projectEmotionToVADContour(baseVec);
    const transitionPattern = getTransitionPattern(alignmentBucket, mismatchType);
    const debug = {
      emotion_score: emotionScore,
      reason_score: reasonScore,
      attitude_score: attitudeScore,
      formula: 'E×.4+R×.4+A×.2',
      fixation_level: emotionHistory ? calculateFixationLevel(emotionHistory) : 0,
      has_reason_data: !!(userVector.reason_analysis && originalVector.reason_analysis),
      has_embedding: !!(userVector.embedding && originalVector.embedding),
    };
    return {
      affective_position: affectivePosition,
      alignment_score: alignmentScore,
      alignment_bucket: alignmentBucket,
      transition_pattern: transitionPattern,
      mismatch_type: mismatchType,
      debug,
    };
  }

  function buildOriginalVectorFromScene(scene) {
    const base = safeParseEmotion(scene.original_emotion);
    const voidInfo = scene.void_info || {};
    const isVoidScene = !!(voidInfo && voidInfo.sceneVoid);
    return {
      base,
      reason_analysis: {
        attribution: scene.original_reason || null,
        target: voidInfo.target || null,
        core_fear: voidInfo.coreFear || voidInfo.core_fear || null,
        is_void: isVoidScene,
      },
    };
  }

  function reasonKeyToAttribution(key) {
    const m = { self_blame: 'self_blame', helpless: 'helpless_situation', fear_driven: 'external_threat', unknown: 'unknown' };
    return m[key] || key;
  }

  function buildTerrainFromData() {
    const T = window.TemAfStrataTerrain;
    if (!T || !game.memoryId) {
      console.warn('[play-test] TemAfStrataTerrain 또는 memoryId 없음 — 등고선 스킵');
      game.agg = null;
      let pollution = 0;
      if (game.plays.length) {
        let s = 0;
        game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
        pollution = Math.round((s / game.plays.length) * 100);
      }
      return pollution;
    }
    const memRow = {
      id: game.memoryId,
      title: game.memoryTitle || '',
      memory_words: '',
      completed_sentence: '',
    };
    const playsByMem = {};
    playsByMem[game.memoryId] = game.plays || [];
    const P = T.buildMemoryItems([memRow], playsByMem);
    const field = T.computeAfTerrainFields(P, null);
    const total = field.G * field.G;
    game.agg = {
      heights: field.hts,
      colors: field.cls,
      min: field.minH,
      max: field.maxH,
      domIdx: new Int16Array(total).fill(-1),
      gridG: field.G,
    };

    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    return pollution;
  }

  function renderContourCanvas() {
    const canvas = document.getElementById('contourCanvas');
    if (!canvas || !game.agg) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(2, Math.floor(rect.width * dpr));
    canvas.height = Math.max(2, Math.floor(rect.height * dpr));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const W = Math.floor(canvas.width), H = Math.floor(canvas.height);
    ctx.clearRect(0, 0, W, H);
    drawRaster(ctx, game.agg, W, H);
    const minH = game.agg.min, maxH = game.agg.max, range = (maxH - minH) || 1;
    const Gc = game.agg.gridG != null ? game.agg.gridG : GRID;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function strokeContourPass(strokeStyle, lineW) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineW;
      for (let i = 1; i <= CONTOUR_LEVELS; i++) {
        const t = i / (CONTOUR_LEVELS + 1);
        const th = minH + range * t;
        const segs = marchingSquaresSegments(game.agg.heights, th, Gc);
        ctx.beginPath();
        segs.forEach(pair => {
          const p1 = toCanvas(pair[0], W, H, Gc), p2 = toCanvas(pair[1], W, H, Gc);
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        });
        ctx.stroke();
      }
    }
    strokeContourPass('rgba(12, 8, 22, 0.42)', 1.05 * dpr);
    strokeContourPass('rgba(232, 224, 252, 0.48)', 0.62 * dpr);
  }

  function vadToPercent(vad) {
    const Gm = (game.agg && game.agg.gridG) ? game.agg.gridG : GRID;
    const gx = ((vad.x * HALF) / SIZE + 0.5) * (Gm - 1);
    const gz = ((vad.z * HALF) / SIZE + 0.5) * (Gm - 1);
    return {
      x: (gx / (Gm - 1)) * 100,
      y: (gz / (Gm - 1)) * 100,
    };
  }

  function buildPins() {
    game.pins = [];
    game.scenes.forEach((scene, idx) => {
      const emotion = safeParseEmotion(scene.original_emotion);
      const base = emotionToMapCoords(emotion);
      const spread = mapCoordsSpread(base.x, base.y, idx, scene.id);
      const isBridge = scene.scene_role === 'residual';
      const pinType = isBridge ? 'bridge' : 'core';
      const pinId = pinType + '-' + (scene.id != null ? scene.id : idx);
      const pinText = scene.text || scene.text_stage_1 || scene.text_stage_2 || '…';
      game.pins.push({
        id: pinId,
        type: pinType,
        sceneId: scene.id,
        sceneIndex: idx,
        memoryId: game.memoryId,
        role: scene.scene_role || 'anchor',
        mapX: spread.x,
        mapY: spread.y,
        x: spread.x * 100,
        y: spread.y * 100,
        text: pinText,
        label: isBridge ? '·' : ('#' + (scene.scene_order != null ? scene.scene_order : idx + 1)),
        originalEmotion: emotion,
        sceneOrder: scene.scene_order != null ? scene.scene_order : idx,
        state: 'locked',
        visited: false,
      });
    });
    const recent = game.plays.slice(-40);
    recent.forEach((pl, i) => {
      const af = projectEmotionToAFContour(safeParseEmotion(pl.user_emotion));
      const p = vadToPercent(af);
      const j = (i % 7) * 0.4;
      game.pins.push({
        id: 'echo-' + i + '-' + (pl.scene_id || i),
        type: 'echo',
        x: Math.max(2, Math.min(98, p.x + Math.sin(i * 1.7) * j)),
        y: Math.max(2, Math.min(98, p.y + Math.cos(i * 1.3) * j)),
        label: '',
        state: 'locked',
      });
    });
    const voidScene = game.scenes.find(s => s.void_info && s.void_info.sceneVoid);
    if (voidScene) {
      const vidx = game.scenes.findIndex(s => s.id === voidScene.id);
      game.pins.push({
        id: 'void-' + voidScene.id,
        type: 'voidPin',
        sceneId: voidScene.id,
        sceneIndex: vidx >= 0 ? vidx : 0,
        text: voidScene.text || voidScene.text_stage_1 || '…',
        originalEmotion: safeParseEmotion(voidScene.original_emotion),
        x: 88,
        y: 78,
        label: '∅',
        mapX: 0.88,
        mapY: 0.78,
        state: 'locked',
      });
    }
  }

  function finalizePinAccess() {
    syncPinStateFlags();
    applyPinVisualFlags();
  }

  function applyPinVisualFlags() {
    game.pins.forEach(pin => {
      pin.visited = false;
      pin.entrance = false;
      pin.active = false;
      pin.locked = false;
      if (pin.type === 'echo') {
        pin.locked = true;
        return;
      }
      if (pin.type === 'core' || pin.type === 'bridge') {
        pin.visited = !!game.visitedCore[pin.sceneId];
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
        return;
      }
      if (pin.type === 'voidPin') {
        pin.visited = !!(game.visitedCore[pin.sceneId]);
        const canOpen = pin.visited || !!(game.accessiblePinIds && game.accessiblePinIds.has(pin.id));
        pin.locked = !canOpen;
        pin.active = canOpen && !pin.visited;
        pin.entrance = canOpen && !pin.visited;
      }
    });
  }

  function renderPins() {
    const layer = document.getElementById('mapPinsLayer');
    if (!layer) return;
    layer.innerHTML = '';
    game.pins.forEach(pin => {
      const el = document.createElement('div');
      let cls = 'map-pin ' + pin.type;
      if (pin.active) cls += ' active';
      if (pin.entrance) cls += ' entrance';
      if (pin.visited) cls += ' visited';
      if (pin.locked) cls += ' locked';
      el.className = cls;
      el.style.left = pin.x + '%';
      el.style.top = pin.y + '%';
      if (pin.label) {
        const lb = document.createElement('div');
        lb.className = 'map-pin-label';
        lb.textContent = pin.label;
        el.appendChild(lb);
      }
      el.addEventListener('click', () => onPinClick(pin));
      layer.appendChild(el);
    });
  }

  function onPinClick(pin) {
    if (game.sealed) return;
    if (pin.locked) {
      LOG('pin locked');
      return;
    }
    initAudio();
    playOnce(SFX.footstep);
    setTimeout(() => { if (SFX.ambient && !SFX.ambient._broken) SFX.ambient.volume = 0.05; }, 800);
    if (pin.type === 'core') {
      enterSceneMode(pin);
    } else if (pin.type === 'bridge') {
      enterSceneMode(pin);
    } else if (pin.type === 'voidPin') {
      enterSceneMode(pin);
    }
  }

  function getNpcLines() {
    return T.npcLines;
  }

  function stopWave() {
    if (game.waveRaf) {
      cancelAnimationFrame(game.waveRaf);
      game.waveRaf = null;
    }
  }

  function bucketWaveColors(rgb, bucket) {
    const r = rgb[0], g = rgb[1], b = rgb[2];
    if (bucket === 'HIGH') {
      return {
        a: [Math.round(r * 0.5 + 196 * 0.5), Math.round(g * 0.5 + 168 * 0.5), Math.round(b * 0.5 + 130 * 0.5)],
        b: [Math.round(r * 0.35 + 90 * 0.65), Math.round(g * 0.35 + 160 * 0.65), Math.round(b * 0.35 + 120 * 0.65)],
        phaseB: 0.06,
        spd: 0.022,
      };
    }
    if (bucket === 'LOW') {
      return {
        a: [Math.min(255, r + 45), Math.round(g * 0.65), Math.round(b * 0.65)],
        b: [Math.min(255, r + 25), Math.round(g * 0.55), Math.round(b * 0.55)],
        phaseB: 0.55,
        spd: 0.038,
      };
    }
    if (bucket === 'FIXATED') {
      return {
        a: [Math.round(r * 0.45 + 120 * 0.55), Math.round(g * 0.4 + 80 * 0.6), Math.min(255, Math.round(b * 0.5 + 160 * 0.5))],
        b: [Math.round(r * 0.4 + 90 * 0.6), Math.round(g * 0.35 + 60 * 0.65), Math.round(b * 0.45 + 140 * 0.55)],
        phaseB: 0.42,
        spd: 0.008,
      };
    }
    return {
      a: [r, g, b],
      b: [Math.round(r * 0.55 + 140 * 0.45), Math.round(g * 0.55 + 150 * 0.45), Math.round(b * 0.55 + 160 * 0.45)],
      phaseB: 0.35,
      spd: 0.024,
    };
  }

  function transitionWavePostSubmit(rgb, bucket) {
    game.waveTargetRgb = rgb.slice();
    game.waveBucket = bucket || 'MID';
    game.waveGlitch = bucket === 'LOW' ? 1 : 0;
  }

  /** Core 제출 직후 API 응답 전, 한·영 키워드로 감정파동 색을 바로 반영 */
  function previewWaveFromCoreUserText(text) {
    if (!text || typeof text !== 'string') return;
    const t = text;
    if (/슬프|슬퍼|슬펐|우울|눈물|울었|비통|슬픔|서글|애처/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.sadness, 'MID');
      return;
    }
    if (/무섭|무서|두려|공포|불안|조마|오싹|겁/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.fear, 'MID');
      return;
    }
    if (/화나|분노|열받|짜증|격분|빡|욕나와/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.anger, 'MID');
      return;
    }
    if (/그립|그리워|보고\s*싶/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.longing, 'MID');
      return;
    }
    if (/미안|죄책|내\s*탓/.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.guilt, 'MID');
      return;
    }
    if (/\bsad\b|sorrow|grief|depressed|unhappy/i.test(t)) {
      transitionWavePostSubmit(PT_EMOTION_COLORS.sadness, 'MID');
    }
  }

  function startWaveLoop(rgb) {
    const canvas = document.getElementById('waveCanvas');
    if (!canvas) return;
    stopWave();
    game.waveRgb = rgb.slice();
    game.waveTargetRgb = rgb.slice();
    game.waveBucket = 'MID';
    game.waveGlitch = 0;
    runWaveFrame();
  }

  function runWaveFrame() {
    const canvas = document.getElementById('waveCanvas');
    if (!canvas) return;
    function frame() {
      const ctx = canvas.getContext('2d');
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      const w = canvas.width;
      const h = canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0a0a0e';
      ctx.fillRect(0, 0, w, h);
      if (game.waveBucket === 'FIXATED') {
        const vg = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.55);
        vg.addColorStop(0, 'rgba(40, 20, 60, 0)');
        vg.addColorStop(1, 'rgba(20, 10, 40, 0.45)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, w, h);
      }
      const bc2 = bucketWaveColors(game.waveRgb, game.waveBucket);
      game.waveT += bc2.spd != null ? bc2.spd : 0.024;
      game.waveRgb = lerpRgb(game.waveRgb, game.waveTargetRgb, 0.08);
      const cA = bc2.a;
      const cB = bc2.b;
      const r2 = cA[0] / 255;
      const g2 = cA[1] / 255;
      const b2 = cA[2] / 255;
      const cy = h * 0.55;
      let gTime = game.waveT;
      if (game.waveGlitch > 0) {
        gTime += (Math.random() - 0.5) * 0.4;
        game.waveGlitch = Math.max(0, game.waveGlitch - 0.02);
      }
      ctx.strokeStyle = 'rgba(' + cA[0] + ',' + cA[1] + ',' + cA[2] + ',0.38)';
      ctx.lineWidth = 1.25 * dpr;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const gx = game.waveBucket === 'LOW' ? (Math.random() - 0.5) * 2.5 : 0;
        const y = cy + Math.sin(x * 0.006 + gTime) * h * 0.08 + Math.sin(x * 0.014 + gTime * 0.7) * h * 0.04 + gx;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      const ph2 = game.waveBucket === 'HIGH' ? gTime + 0.04 : gTime * 0.88 + bc2.phaseB;
      ctx.strokeStyle = 'rgba(' + cB[0] + ',' + cB[1] + ',' + cB[2] + ',0.28)';
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const gx = game.waveBucket === 'LOW' ? (Math.random() - 0.5) * 2.2 : 0;
        const y = cy + Math.sin(x * 0.009 + ph2) * h * 0.065 + Math.sin(x * 0.017 + gTime * 0.65) * h * 0.035 + gx;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(' + Math.round(r2 * 200 + 40) + ',' + Math.round(g2 * 200 + 40) + ',' + Math.round(b2 * 200 + 60) + ',0.18)';
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const y = cy + Math.sin(x * 0.011 + gTime * 1.05) * h * 0.045;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      game.waveRaf = requestAnimationFrame(frame);
    }
    game.waveRaf = requestAnimationFrame(frame);
  }

  function clearTimers() {
    if (game.voidTimeout) {
      clearTimeout(game.voidTimeout);
      game.voidTimeout = null;
    }
    if (game.inputDeadline) {
      clearInterval(game.inputDeadline);
      game.inputDeadline = null;
    }
  }

  function enterSceneMode(pinOrId) {
    const pin = typeof pinOrId === 'string' ? game.pins.find(p => p.id === pinOrId) : pinOrId;
    if (!pin || (pin.type !== 'core' && pin.type !== 'bridge' && pin.type !== 'voidPin')) return;
    const scene = game.scenes.find(s => s.id === pin.sceneId);
    if (!scene) return;
    clearTimers();
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    game.postSubmitTerrainCleanup = null;
    stopTerrainAnimLoop();
    const _tc = document.getElementById('terrainCanvas');
    if (_tc) _tc.classList.remove('clickable');
    document.getElementById('terrainBar').classList.remove('awaiting-terrain');
    game.currentPinId = pin.id;
    game.currentSceneIndex = pin.sceneIndex;
    document.getElementById('mapMode').classList.remove('active');
    const sm = document.getElementById('sceneMode');
    sm.classList.add('active');
    const _ia = document.getElementById('emotionInputArea');
    _ia.style.opacity = '0';
    _ia.innerHTML = '';
    const tint = emotionVectorToRGB(pin.originalEmotion || safeParseEmotion(scene.original_emotion));
    startWaveLoop(tint);

    const textEl = document.getElementById('sceneText');
    textEl.textContent = '';
    const fullText = pin.text || scene.text || scene.text_stage_1 || '…';
    const _typeStart = performance.now();
    const _charMs = 28;
    (function _typeFrame(now) {
      const elapsed = now - _typeStart;
      const chars = Math.min(fullText.length, Math.floor(elapsed / _charMs) + 1);
      textEl.textContent = fullText.slice(0, chars);
      if (chars >= fullText.length) {
        setupEmotionInputByPinType(pin, scene);
        return;
      }
      requestAnimationFrame(_typeFrame);
    })(performance.now());

    document.getElementById('sceneNpc').textContent = '';
    document.getElementById('terrainClickHint').style.display = 'none';
    document.getElementById('terrainBar').classList.remove('clickable');
    game.lastTerrainTint = null;
    renderTerrainBar(pin.sceneIndex, null);
  }

  function armTimers(scene) {
    clearTimers();
    const voidMs = (scene.void_info && scene.void_info.voidLevel === 'high') ? 12000 : 20000;
    game.voidTimeout = setTimeout(() => {
      LOG('void timeout → unsaid');
      leaveSceneUnsaid();
    }, voidMs);
  }

  function resetEmotionInputSkeleton() {
    const area = document.getElementById('emotionInputArea');
    area.innerHTML = getEmotionInputSkeleton();
  }

  function setupEmotionInputByPinType(pin, scene) {
    if (pin.type === 'core') {
      setupCoreInput(pin, scene);
      return;
    }
    if (pin.type === 'bridge') {
      setupBridgeInput(pin, scene);
      return;
    }
    resetEmotionInputSkeleton();
    setupEmotionUI(scene);
    document.getElementById('emotionInputArea').style.opacity = '1';
    document.getElementById('submitBtn').disabled = false;
    fadeIn(SFX.white, 0.08, 2000);
    armTimers(scene);
  }

  function setupCoreInput(pin, scene) {
    const inputArea = document.getElementById('emotionInputArea');
    inputArea.innerHTML = `
      <p style="font-size:13px;opacity:0.5;margin-bottom:12px;">${T.corePrompt}</p>
      <textarea id="coreTextInput" placeholder="${T.corePlaceholder.replace(/"/g, '&quot;')}"
        style="width:100%;background:rgba(196,168,130,0.05);border:1px solid rgba(196,168,130,0.15);
        color:#c4a882;font-family:inherit;font-size:15px;padding:12px;resize:none;border-radius:4px;min-height:80px;"></textarea>
      <button id="coreSubmitBtn" style="margin-top:12px;float:right;background:none;
        border:1px solid rgba(196,168,130,0.3);color:#c4a882;padding:8px 24px;cursor:pointer;
        font-family:inherit;font-size:13px;">${T.coreSubmit}</button>
    `;
    inputArea.style.opacity = '1';
    fadeIn(SFX.white, 0.08, 2000);
    const submitBtn = document.getElementById('coreSubmitBtn');
    submitBtn.addEventListener('click', async () => {
      const text = (document.getElementById('coreTextInput').value || '').trim();
      if (!text) return;
      submitBtn.disabled = true;
      submitBtn.textContent = T.coreLoading;
      previewWaveFromCoreUserText(text);
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/claude-scene', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({
            type: 'emotion_extract',
            scene_text: scene.text || '',
            user_text: text,
          }),
        });
        const raw = await res.json();
        const userVector = raw?.base ? raw : (raw?.data?.base ? raw.data : { base: {} });
        if (!userVector.reason_analysis) userVector.reason_analysis = { attribution: 'unknown', core_fear: 'none', target: 'unknown', is_void: false };
        processEmotionResult(pin, scene, userVector);
      } catch (e) {
        console.error('emotion_extract error:', e);
        submitBtn.textContent = T.coreError;
        submitBtn.disabled = false;
        setTimeout(() => {
          if (!submitBtn.disabled) submitBtn.textContent = T.coreSubmit;
        }, 1500);
      }
    });
  }

  function setupBridgeInput(pin, scene) {
    const BRIDGE_CHIPS = [
      { key: 'guilt' },
      { key: 'fear' },
      { key: 'anger' },
      { key: 'sadness' },
      { key: 'longing' },
      { key: 'relief' },
      { key: 'confusion' },
      { key: 'emptiness' },
    ];
    const CHIP_VECTORS = {
      guilt: { fear: 0.1, sadness: 0.3, anger: 0, joy: 0, longing: 0.1, guilt: 0.8 },
      fear: { fear: 0.8, sadness: 0.2, anger: 0, joy: 0, longing: 0, guilt: 0.1 },
      anger: { fear: 0.1, sadness: 0.1, anger: 0.8, joy: 0, longing: 0, guilt: 0 },
      sadness: { fear: 0, sadness: 0.8, anger: 0, joy: 0, longing: 0.3, guilt: 0.1 },
      longing: { fear: 0, sadness: 0.4, anger: 0, joy: 0.1, longing: 0.8, guilt: 0 },
      relief: { fear: 0, sadness: 0.1, anger: 0, joy: 0.5, longing: 0, guilt: 0.3 },
      confusion: { fear: 0.3, sadness: 0.2, anger: 0.1, joy: 0, longing: 0.1, guilt: 0.2 },
      emptiness: { fear: 0, sadness: 0.4, anger: 0, joy: 0, longing: 0.2, guilt: 0.1 },
    };
    const inputArea = document.getElementById('emotionInputArea');
    const selected = [];
    let html = '<p style="font-size:13px;opacity:0.5;margin-bottom:12px;">' + T.bridgePrompt + '</p>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
    BRIDGE_CHIPS.forEach(chip => {
      const lab = T.chipLabels[chip.key] || chip.key;
      html += `<button class="bridge-chip" data-key="${chip.key}"
        style="background:rgba(122,154,122,0.08);border:1px solid rgba(122,154,122,0.2);
        color:#a0b8a0;padding:6px 14px;font-family:inherit;font-size:13px;cursor:pointer;
        border-radius:20px;">${lab}</button>`;
    });
    html += '</div>';
    html += `<button id="bridgeConfirmBtn" style="margin-top:12px;float:right;background:none;
      border:1px solid rgba(122,154,122,0.3);color:#7a9a7a;padding:8px 24px;cursor:pointer;
      font-family:inherit;font-size:13px;opacity:0;">${T.bridgeConfirm}</button>`;
    inputArea.innerHTML = html;
    inputArea.style.opacity = '1';
    fadeIn(SFX.white, 0.08, 2000);
    inputArea.querySelectorAll('.bridge-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const idx = selected.indexOf(key);
        if (idx >= 0) {
          selected.splice(idx, 1);
          btn.style.background = 'rgba(122,154,122,0.08)';
          btn.style.borderColor = 'rgba(122,154,122,0.2)';
          btn.style.color = '#a0b8a0';
        } else if (selected.length < 2) {
          selected.push(key);
          btn.style.background = 'rgba(122,154,122,0.25)';
          btn.style.borderColor = '#7a9a7a';
          btn.style.color = '#d0e0d0';
        }
        document.getElementById('bridgeConfirmBtn').style.opacity = selected.length > 0 ? '1' : '0';
      });
    });
    document.getElementById('bridgeConfirmBtn').addEventListener('click', () => {
      if (!selected.length) return;
      const keys = ['fear', 'sadness', 'anger', 'joy', 'longing', 'guilt'];
      const blended = {};
      keys.forEach(k => { blended[k] = 0; });
      selected.forEach(chipKey => {
        const vec = CHIP_VECTORS[chipKey] || {};
        keys.forEach(k => { blended[k] += (vec[k] || 0) / selected.length; });
      });
      const userVector = {
        base: blended,
        reason_analysis: {
          attribution: 'unknown', core_fear: 'none', target: 'unknown',
          is_void: false, is_compound: selected.length > 1, emotions: selected,
        },
        attitude: { is_void: false, is_displaced: false },
      };
      processEmotionResult(pin, scene, userVector);
    });
  }

  function setupEmotionUI(scene) {
    const chips = document.getElementById('emotionChips');
    const sliders = document.getElementById('sliderArea');
    const reasons = document.getElementById('reasonArea');
    chips.innerHTML = '';
    sliders.innerHTML = '';
    reasons.innerHTML = '';
    const orig = safeParseEmotion(scene.original_emotion);
    getEmotionsUi().forEach(def => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emotion-chip';
      b.textContent = def.label;
      b.dataset.key = def.key;
      if (orig[def.key] > 0.2) b.classList.add('selected');
      b.addEventListener('click', () => {
        b.classList.toggle('selected');
        validateSubmit();
      });
      chips.appendChild(b);
    });
    getEmotionsUi().forEach(def => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin:4px 0;';
      const lab = document.createElement('span');
      lab.style.cssText = 'font-size:0.75rem;color:#888;width:72px;';
      lab.textContent = def.label;
      const input = document.createElement('input');
      input.type = 'range';
      input.min = '0';
      input.max = '1';
      input.step = '0.05';
      input.dataset.key = def.key;
      input.value = String(orig[def.key] != null ? orig[def.key] : 0);
      input.style.width = '160px';
      input.addEventListener('input', validateSubmit);
      wrap.appendChild(lab);
      wrap.appendChild(input);
      sliders.appendChild(wrap);
    });
    getReasonsUi().forEach(def => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emotion-chip';
      b.textContent = def.label;
      b.dataset.reason = def.key;
      b.addEventListener('click', () => {
        reasons.querySelectorAll('.emotion-chip').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        validateSubmit();
      });
      reasons.appendChild(b);
    });
    document.getElementById('submitBtn').onclick = () => submitScene(scene);
    const vb = document.getElementById('voidBtn');
    vb.disabled = false;
    vb.onclick = () => leaveSceneVoid(scene);
    validateSubmit();
  }

  function collectUserEmotionVector() {
    const vec = {};
    document.querySelectorAll('#sliderArea input[type="range"]').forEach(el => {
      const k = el.dataset.key;
      vec[k] = parseFloat(el.value) || 0;
    });
    return vec;
  }

  function collectReason() {
    const sel = document.querySelector('#reasonArea .emotion-chip.selected');
    return sel ? sel.dataset.reason : null;
  }

  function validateSubmit() {
    const vec = collectUserEmotionVector();
    const sum = Object.values(vec).reduce((a, b) => a + b, 0);
    document.getElementById('submitBtn').disabled = sum <= 0;
  }

  function leaveSceneUnsaid() {
    const scene = game.scenes[game.currentSceneIndex];
    if (!scene) return;
    game.skipCount++;
    const vec = {};
    getEmotionsUi().forEach(d => { vec[d.key] = 0; });
    const userVector = {
      base: vec,
      reason_analysis: { is_void: true, attribution: null, target: null, core_fear: null },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    finishScene(scene, result, vec, 'timeout_void', true);
  }

  function leaveSceneVoid(scene) {
    game.skipCount++;
    const vec = collectUserEmotionVector();
    const userVector = {
      base: vec,
      reason_analysis: { is_void: true, attribution: null, target: null, core_fear: null },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    finishScene(scene, result, vec, 'void', true);
  }

  function parseAnchorEmotions(scene) {
    let a = scene.anchor_emotions;
    if (typeof a === 'string') {
      try { a = JSON.parse(a); } catch (_) { a = null; }
    }
    if (Array.isArray(a) && a.length) return a.map(String);
    return null;
  }

  function submitScene(scene) {
    clearTimers();
    const vec = collectUserEmotionVector();
    const reasonKey = collectReason();
    const userVector = {
      base: vec,
      reason_analysis: {
        is_void: false,
        attribution: reasonKey ? reasonKeyToAttribution(reasonKey) : null,
        target: 'scene',
        core_fear: null,
      },
    };
    const orig = buildOriginalVectorFromScene(scene);
    const anchors = parseAnchorEmotions(scene);
    const result = byeoriCalculateStep({ userVector, originalVector: orig, anchorEmotions: anchors }, {
      previousBucket: game.previousBucket,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });
    game.previousBucket = result.alignment_bucket;
    game.emotionHistory.push(Object.assign({}, vec));
    finishScene(scene, result, vec, reasonKey || '', false);
  }

  function processEmotionResult(pin, scene, userVector) {
    fadeOut(SFX.white, 500, true);
    clearTimers();
    const origVector = {
      base: pin.originalEmotion || safeParseEmotion(scene.original_emotion),
      reason_analysis: scene.original_reason_vector || null,
    };
    const engineResult = byeoriCalculateStep({
      userVector,
      originalVector: origVector,
      anchorEmotions: parseAnchorEmotions(scene),
    }, {
      previousBucket: game.previousBucket || null,
      emotionHistory: game.emotionHistory,
      skipCount: game.skipCount,
    });

    pin.visited = true;
    pin.emotion_data = userVector;
    pin.engine_result = engineResult;
    game.visitedCore[pin.sceneId] = true;
    if (pin.type === 'core') game.coreVisitCount++;
    game.previousBucket = engineResult.alignment_bucket;
    if (userVector.base) game.emotionHistory.push(Object.assign({}, userVector.base));

    const baseEmotion = userVector.base || {};
    game.traces.push({
      pinType: pin.type,
      sceneId: pin.sceneId || scene.id,
      sceneText: scene.text || '',
      userVector,
      userEmotion: baseEmotion,
      alignment: engineResult.alignment_score,
      bucket: engineResult.alignment_bucket,
      pattern: engineResult.transition_pattern,
      mismatch: engineResult.mismatch_type,
      sceneIndex: pin.sceneIndex,
    });

    const pos = engineResult.affective_position;
    if (!game.emotionCursor) game.emotionCursor = { v: 0, a: 0, d: 0 };
    if (pos) {
      game.emotionCursor.v = game.emotionCursor.v * 0.3 + pos.v * 0.7;
      game.emotionCursor.a = game.emotionCursor.a * 0.3 + pos.a * 0.7;
      game.emotionCursor.d = (game.emotionCursor.d || 0) * 0.3 + (pos.d || 0) * 0.7;
      if (!game.emotionTrajectory) game.emotionTrajectory = [];
      game.emotionTrajectory.push({ ...game.emotionCursor });
    }

    const reasonLabel = userVector.reason_analysis?.attribution || '';
    insertPlay(scene, baseEmotion, reasonLabel, engineResult, !!userVector.reason_analysis?.is_void).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        updateMapStatus();
        updateSealButton();
        LOG('engine', engineResult);
        beginPostSubmitSequence(engineResult, baseEmotion);
      });
    });
  }

  function finishScene(scene, result, vec, reasonLabel, isVoid) {
    fadeOut(SFX.white, 500, true);
    LOG('engine', result);
    game.lastResult = result;
    game.lastUserEmotion = Object.assign({}, vec);
    const rgb = emotionVectorToRGB(vec);
    game.lastTintRGB = rgb;
    const vad = projectEmotionToVADContour(vec);
    game.cursorTarget = vadToPercent(vad);

    insertPlay(scene, vec, reasonLabel, result, isVoid).then(() => {
      reloadPlaysOnly().then(() => {
        buildTerrainFromData();
        showPostSubmitNPC(result);
      });
    });
  }

  async function insertPlay(scene, vec, reasonLabel, result, isVoid) {
    const row = {
      memory_id: game.memoryId,
      scene_id: scene.id,
      user_emotion: vec,
      user_reason: isVoid ? 'void' : (reasonLabel || ''),
      alignment: result.alignment_score,
      mismatch_type: isVoid ? 'void_mismatch' : (result.mismatch_type || null),
      wave_data: null,
      layer_id: 0,
    };
    const { error } = await sb.from('plays').insert(row);
    if (error) LOG('plays insert error', error);
    else LOG('plays saved', row);
  }

  async function reloadPlaysOnly() {
    const { data, error } = await sb.from('plays')
      .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
      .eq('memory_id', game.memoryId)
      .order('created_at');
    if (!error) game.plays = data || [];
  }

  function showPostSubmitNPC(result) {
    beginPostSubmitSequence(result, game.lastUserEmotion || {});
  }

  function afterTerrainReturn(result) {
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    game.postSubmitTerrainCleanup = null;
    stopTerrainAnimLoop();
    game.terrainRipple = 0;
    const tc = document.getElementById('terrainCanvas');
    if (tc) {
      tc.classList.remove('clickable');
      tc.style.opacity = '';
      tc.style.filter = '';
    }
    document.getElementById('terrainBar').classList.remove('awaiting-terrain');
    const scene = game.scenes[game.currentSceneIndex];
    const originSceneId = scene ? scene.id : null;
    stopWave();
    const lastTr = game.traces[game.traces.length - 1];
    if (!lastTr || lastTr.userEmotion == null) {
      game.traces.push({ sceneIndex: game.currentSceneIndex, alignment: result.alignment_score });
    }
    if (scene && !game.visitedCore[scene.id]) {
      game.visitedCore[scene.id] = true;
      const pin = game.currentPinId ? game.pins.find(p => p.id === game.currentPinId) : null;
      if (!pin || pin.type === 'core') game.coreVisitCount++;
    }
    document.getElementById('sceneMode').classList.remove('active');
    document.getElementById('mapMode').classList.add('active');
    document.getElementById('terrainBar').classList.remove('clickable');
    document.getElementById('terrainClickHint').style.display = 'none';
    buildTerrainFromData();
    buildPins();
    handleEmotionResult({
      userEmotion: game.lastUserEmotion || {},
      result: result || game.lastResult || {},
      originSceneId,
    });
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    updateMapStatus();
    updateSealButton();
    startCursorLerp();
    game.currentSceneIndex = null;
    game.currentPinId = null;
  }

  function renderTerrainBar(sceneIndex, tintRGB, opts) {
    const canvas = document.getElementById('terrainCanvas');
    renderTerrainProfile(canvas, game.scenes, game.traces, sceneIndex, tintRGB, opts);
    if (tintRGB && tintRGB.length === 3) game.lastTerrainTint = tintRGB.slice();
  }

  function stopTerrainAnimLoop() {
    if (game.terrainAnimRaf) {
      cancelAnimationFrame(game.terrainAnimRaf);
      game.terrainAnimRaf = null;
    }
  }

  function ensureTerrainAnimLoop() {
    if (game.terrainAnimRaf) return;
    function tick() {
      let tint = null;
      if (game.terrainTintFrom && game.terrainTintTo && game.terrainTintLerp < 1) {
        game.terrainTintLerp = Math.min(1, game.terrainTintLerp + 0.032);
        tint = lerpRgb(game.terrainTintFrom, game.terrainTintTo, easeOutCubic(game.terrainTintLerp));
      } else if (game.terrainTintTo && game.terrainTintLerp >= 1) {
        tint = game.terrainTintTo.slice();
      } else if (game.lastTerrainTint && game.terrainTintLerp >= 1 && !game.terrainTintTo) {
        tint = game.lastTerrainTint.slice();
      }
      if (game.terrainRipple > 0.002) {
        game.terrainRipple = Math.max(0, game.terrainRipple - game.terrainRippleDecay);
        game.terrainRipplePhase += 0.07;
      }
      const ripplePx = game.terrainRipple * 16;
      renderTerrainBar(game.currentSceneIndex, tint, { rippleAmp: ripplePx, rippleTime: game.terrainRipplePhase });
      const tintAnimating = game.terrainTintFrom && game.terrainTintTo && game.terrainTintLerp < 1;
      if (tintAnimating || game.terrainRipple > 0.004) {
        game.terrainAnimRaf = requestAnimationFrame(tick);
      } else {
        game.terrainAnimRaf = null;
      }
    }
    game.terrainAnimRaf = requestAnimationFrame(tick);
  }

  function enableTerrainCanvasClick(result) {
    const canvas = document.getElementById('terrainCanvas');
    const bar = document.getElementById('terrainBar');
    if (!canvas) return;
    if (game.postSubmitTerrainCleanup) game.postSubmitTerrainCleanup();
    bar.classList.add('awaiting-terrain');
    canvas.classList.add('clickable');
    try {
      if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
    } catch (_) {}
    function onTerrainClick(e) {
      e.preventDefault();
      e.stopPropagation();
      playOnce(SFX.footstep);
      fadeOut(SFX.void, 400, true);
      fadeIn(SFX.ambient, 0.12, 1000);
      canvas.removeEventListener('click', onTerrainClick);
      game.postSubmitTerrainCleanup = null;
      stopTerrainAnimLoop();
      game.terrainRipple = 0;
      game.terrainTintLerp = 1;
      game.terrainTintFrom = null;
      game.terrainTintTo = null;
      canvas.classList.remove('clickable');
      bar.classList.remove('awaiting-terrain');
      const fadeFrom = game.lastTerrainTint || [196, 168, 130];
      let k = 0;
      function fadeStep() {
        k += 0.12;
        const c = lerpRgb(fadeFrom, [196, 168, 130], Math.min(1, k));
        renderTerrainBar(game.currentSceneIndex, c, { rippleAmp: 0, rippleTime: 0 });
        if (k < 1) requestAnimationFrame(fadeStep);
        else {
          renderTerrainBar(game.currentSceneIndex, null, {});
          afterTerrainReturn(result);
        }
      }
      requestAnimationFrame(fadeStep);
    }
    canvas.addEventListener('click', onTerrainClick);
    game.postSubmitTerrainCleanup = () => {
      canvas.removeEventListener('click', onTerrainClick);
      canvas.classList.remove('clickable');
      bar.classList.remove('awaiting-terrain');
    };
  }

  function beginPostSubmitSequence(result, baseEmotion) {
    const dom = getDominantColor(baseEmotion || {});
    const bucket = result.alignment_bucket || 'MID';
    transitionWavePostSubmit(dom, bucket);

    const npc = document.getElementById('sceneNpc');
    const lines = getNpcLines();
    npc.textContent = lines[Math.floor(Math.random() * lines.length)];

    renderTerrainBar(game.currentSceneIndex, game.lastTerrainTint || null, {});
    document.getElementById('terrainClickHint').style.display = 'block';
    document.getElementById('emotionInputArea').style.opacity = '0.3';
    const sub = document.getElementById('submitBtn');
    const voi = document.getElementById('voidBtn');
    if (sub) sub.disabled = true;
    if (voi) voi.disabled = true;
    document.querySelector('#terrainClickHint .hint-txt').textContent = T.terrainHintAlign(
      (result.alignment_score * 100).toFixed(0),
      result.alignment_bucket || ''
    );

    game.terrainTintFrom = null;
    game.terrainTintTo = null;
    game.terrainTintLerp = 1;
    game.terrainRipple = 0;
    stopTerrainAnimLoop();

    setTimeout(() => {
      game.terrainTintFrom = (game.lastTerrainTint || [196, 168, 130]).slice();
      game.terrainTintTo = dom.slice();
      game.terrainTintLerp = 0;
      ensureTerrainAnimLoop();
    }, 300);

    setTimeout(() => {
      game.terrainRipple = 1;
      game.terrainRipplePhase = performance.now() * 0.001;
      ensureTerrainAnimLoop();
      fadeIn(SFX.void, 0.25, 800);
    }, 500);

    setTimeout(() => enableTerrainCanvasClick(result), 1000);
  }

  function updateMapStatus() {
    const el = document.getElementById('mapStatus');
    let pollution = 0;
    if (game.plays.length) {
      let s = 0;
      game.plays.forEach(p => { s += (1 - (p.alignment != null ? p.alignment : 0.5)); });
      pollution = Math.round((s / game.plays.length) * 100);
    }
    el.textContent = T.mapStatus(game.coreVisitCount, pollution);
  }

  function updateSealButton() {
    const btn = document.getElementById('sealBtn');
    if (!btn) return;
    btn.disabled = game.sealed || game.coreVisitCount < 3;
    btn.textContent = T.sealBtn;
    btn.title = btn.disabled && !game.sealed ? T.sealBlocked : '';
  }

  function startCursorLerp() {
    const cursor = document.getElementById('emotionCursor');
    if (!cursor) return;
    cursor.style.display = 'block';
    if (game.cursorRaf) cancelAnimationFrame(game.cursorRaf);
    function tick() {
      game.cursorPos.x += (game.cursorTarget.x - game.cursorPos.x) * 0.08;
      game.cursorPos.y += (game.cursorTarget.y - game.cursorPos.y) * 0.08;
      cursor.style.left = game.cursorPos.x + '%';
      cursor.style.top = game.cursorPos.y + '%';
      if (game.lastTintRGB) {
        cursor.style.boxShadow = '0 0 12px rgba(' + game.lastTintRGB[0] + ',' + game.lastTintRGB[1] + ',' + game.lastTintRGB[2] + ',0.45)';
      }
      game.cursorRaf = requestAnimationFrame(tick);
    }
    tick();
  }

  async function loadMemories() {
    const { data, error } = await sb.from('memories').select('id, title').order('id');
    if (error) throw error;
    game.memories = data || [];
    const sel = document.getElementById('memorySelect');
    sel.innerHTML = '';
    game.memories.forEach(m => {
      const op = document.createElement('option');
      op.value = m.id;
      op.textContent = (m.title || '(untitled)') + ' · ' + String(m.id).slice(0, 8) + '…';
      sel.appendChild(op);
    });
  }

  async function loadMemoryData(memoryId) {
    game.memoryId = memoryId;
    if (window.memoriesData) {
      const found = window.memoriesData.find(function(m) { return m.id === memoryId; });
      if (found) game.memoryTitle = found.title || '';
    }
    const scenesRes = await sb.from('scenes').select('*').eq('memory_id', memoryId).order('scene_order');
    const playsRes = await sb.from('plays')
      .select('user_emotion, user_reason, alignment, mismatch_type, created_at, scene_id')
      .eq('memory_id', memoryId)
      .order('created_at');
    if (scenesRes.error) throw scenesRes.error;
    if (playsRes.error) throw playsRes.error;
    game.scenes = scenesRes.data || [];
    game.plays = playsRes.data || [];

    if (!game.scenes.length && window._simulatedScenesMap && window._simulatedScenesMap[memoryId]) {
      LOG('Supabase scenes empty, using local fallback for', memoryId);
      game.scenes = window._simulatedScenesMap[memoryId].map(function(s) {
        return Object.assign({}, s, { memory_id: memoryId });
      });
    }
    if (!game.plays.length && window._simulatedPlaysMap && window._simulatedPlaysMap[memoryId]) {
      LOG('Supabase plays empty, using local fallback for', memoryId);
      game.plays = window._simulatedPlaysMap[memoryId];
    }
    game.visitedCore = {};
    game.coreVisitCount = 0;
    game.traces = [];
    game.previousBucket = null;
    game.emotionHistory = [];
    game.accessiblePinIds = null;
    game.lastUserEmotion = null;
    const pollution = buildTerrainFromData();
    buildPins();
    applyInitialAccess();
    finalizePinAccess();
    renderContourCanvas();
    renderPins();
    updateMapStatus();
    updateSealButton();
    LOG('loaded scenes', game.scenes.length, 'plays', game.plays.length, 'pollution', pollution);
  }

  function bindMapResize() {
    window.addEventListener('resize', () => {
      if (document.getElementById('mapMode').classList.contains('active')) renderContourCanvas();
    });
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const id = document.getElementById('memorySelect').value;
    if (!id) return;
    initAudio();
    document.getElementById('selectScreen').style.display = 'none';
    document.getElementById('mapMode').classList.add('active');
    try {
      await loadMemoryData(id);
      fadeIn(SFX.ambient, 0.12, 3000);
      startCursorLerp();
    } catch (e) {
      console.error(e);
      alert('Failed to load: ' + (e.message || e));
    }
  });
  document.getElementById('sealBtn').addEventListener('click', async () => {
    if (game.sealed || game.coreVisitCount < 3) return;
    game.sealed = true;
    initAudio();
    fadeOut(SFX.ambient, 1500, true);
    fadeOut(SFX.void, 500, true);
    fadeOut(SFX.white, 500, true);
    setTimeout(() => {
      if (SFX.void && !SFX.void._broken) {
        SFX.void.currentTime = 0;
        SFX.void.volume = 0.5;
        SFX.void.play().catch(() => {});
        setTimeout(() => fadeOut(SFX.void, 1000, true), 1500);
      }
    }, 2000);
    setTimeout(() => {
      fadeIn(SFX.rain, 0.15, 4000);
    }, 4500);
    document.getElementById('mapMode').classList.remove('active');
    const rev = document.getElementById('revealScreen');
    rev.classList.add('active');
    document.getElementById('revealTitle').textContent = T.revealLoading;
    document.getElementById('revealBody').textContent = '';
    const avgAlign = game.traces.length
      ? game.traces.reduce((s, t) => s + t.alignment, 0) / game.traces.length
      : 0;
    const visits = game.traces.map((t, i) => ({
      pin_type: t.pinType || 'core',
      scene_id: t.sceneId,
      scene_text: t.sceneText || '',
      order: i + 1,
      emotion_data: t.userVector || { base: t.userEmotion || {} },
      engine_result: { alignment_score: t.alignment, alignment_bucket: t.bucket || 'MID', transition_pattern: t.pattern || 'bridge', mismatch_type: t.mismatch || null }
    }));
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/generate-reveal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          visits,
          memory_title: game.memoryTitle || '',
          emotion_trajectory: game.emotionTrajectory || [],
          lang: LANG,
        })
      });
      const data = await res.json();
      if (data.narrative) {
        document.getElementById('revealTitle').textContent = T.revealTitle;
        typeRevealText(document.getElementById('revealBody'), data.narrative);
      } else {
        document.getElementById('revealTitle').textContent = T.revealTitle;
        document.getElementById('revealBody').textContent = T.revealFallback;
      }
    } catch (e) {
      console.error('Reveal error:', e);
      document.getElementById('revealTitle').textContent = T.revealTitle;
      document.getElementById('revealBody').textContent = T.revealFallback;
    }
    document.getElementById('revealStats').textContent = T.stats(avgAlign, game.coreVisitCount);

    const _urlParams = new URLSearchParams(window.location.search);
    const _fromDemo = _urlParams.get('memory');
    const _targetMemoryId = _fromDemo || game.memoryId;
    if (_targetMemoryId) {
      document.getElementById('revealRestart').style.display = 'none';
      if (!document.getElementById('revealContinueBtn')) {
        const continueBtn = document.createElement('button');
        continueBtn.id = 'revealContinueBtn';
        continueBtn.textContent = T.revealContinue;
        continueBtn.className = 'action-btn';
        continueBtn.style.marginTop = '1.5rem';
        continueBtn.addEventListener('click', () => {
          initAudio();
          fadeOut(SFX.rain, 2000, true);
          setTimeout(() => {
            const id = _targetMemoryId;
            if (!id) return;
            const viewEl = document.getElementById('strataView');
            const backBtn = document.getElementById('backToMenu');
            if (backBtn) backBtn.style.display = 'block';
            if (!window.showStrataView) {
              console.warn('[play-test] window.showStrataView가 없습니다. strataView.js 로딩을 확인하세요.');
              if (viewEl) viewEl.style.display = 'none';
              return;
            }
            window.showStrataView(id, null, function () {
              if (backBtn) backBtn.style.display = 'block';
            });
          }, 2000);
        });
        const restartBtn = document.getElementById('revealRestart');
        restartBtn.parentNode.insertBefore(continueBtn, restartBtn.nextSibling);
      }
    }
  });

  document.getElementById('revealRestart').addEventListener('click', () => {
    initAudio();
    fadeOut(SFX.rain, 2000, true);
    setTimeout(() => location.reload(), 2000);
  });

  window.addEventListener('beforeunload', () => { stopAll(); });

  function applyPlayTestI18nLabels() {
    const th = document.querySelector('#terrainClickHint .hint-txt');
    if (th) th.textContent = T.exploreTerrain;
    const ms = document.getElementById('mapStatus');
    if (ms) ms.textContent = T.mapStatus(0, 0);
    const seal = document.getElementById('sealBtn');
    if (seal) {
      seal.textContent = T.sealBtn;
      seal.title = T.sealBlocked;
    }
    const rt = document.getElementById('revealTitle');
    if (rt) rt.textContent = T.revealTitle;
    const rr = document.getElementById('revealRestart');
    if (rr) rr.textContent = T.revealRestart;
    const rc = document.getElementById('revealContinueBtn');
    if (rc) rc.textContent = T.revealContinue;
    const sub = document.getElementById('submitBtn');
    const voi = document.getElementById('voidBtn');
    if (sub) sub.textContent = T.submitBtn;
    if (voi) voi.textContent = T.voidBtn;
  }

  // Console shortcut: temGoStrata() / temGoStrata('memory-uuid')
  window.temGoStrata = function (memoryId) {
    const id = memoryId || game.memoryId || new URLSearchParams(window.location.search).get('memory');
    if (!id) {
      console.warn('[TEM] memoryId가 없습니다. temGoStrata(\"memory-id\")로 호출하세요.');
      return;
    }
    const backBtn = document.getElementById('backToMenu');
    if (backBtn) backBtn.style.display = 'block';
    if (!window.showStrataView) {
      console.warn('[TEM] window.showStrataView가 없습니다. strataView.js 로딩을 확인하세요.');
      return;
    }
    window.showStrataView(id, null, function () {
      if (backBtn) backBtn.style.display = 'block';
    });
  };

  function temMenuHref() {
    try {
      if (location.protocol === 'file:') return 'index.html';
      const h = location.hostname || '';
      const isLocal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || (typeof h === 'string' && h.endsWith('.local'));
      if (isLocal) return new URL('index.html', location.href).href;
      return '/';
    } catch (_) {
      return '/';
    }
  }

  (function bindBackToMenu() {
    const btn = document.getElementById('backToMenu');
    if (!btn) return;
    btn.addEventListener('click', () => {
      window.location.href = temMenuHref();
    });
  })();

  (async function init() {
    applyPlayTestI18nLabels();
    bindMapResize();
    let urlMemoryId = urlParams.get('memory');
    if (!urlMemoryId) {
      try {
        urlMemoryId =
          sessionStorage.getItem('tem_archive_memory_id') ||
          sessionStorage.getItem('demoMemoryId') ||
          '';
      } catch (_) {
        urlMemoryId = '';
      }
    }

    if (urlMemoryId) {
      document.getElementById('selectScreen').style.display = 'none';
      document.getElementById('mapMode').classList.add('active');
      try {
        await loadMemoryData(urlMemoryId);
        try {
          sessionStorage.removeItem('tem_archive_memory_id');
          sessionStorage.removeItem('demoMemoryId');
        } catch (_) {}
        initAudio();
        fadeIn(SFX.ambient, 0.12, 3000);
        startCursorLerp();
      } catch (e) {
        console.error(e);
        alert('Failed to load: ' + (e.message || e));
      }
    } else {
      try {
        await loadMemories();
      } catch (e) {
        console.error(e);
      }
    }
  })();

  </script>
  <script src="js/ui/strataView.js"></script>
</body>
