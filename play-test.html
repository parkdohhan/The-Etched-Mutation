<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEM — Play Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/data/memories.js"></script>
  <script src="js/shared/tem_af_strata_terrain.js"></script>
  <script src="js/ui/strataSection.js"></script>
  <style>
    :root {
      --bg-deep: #0a0a0c;
      --text-primary: #e8e4df;
      --text-muted: #6b6b7b;
      --accent-memory: #c4a882;
      --bg-surface: rgba(15, 15, 20, 0.95);
      --ghost: rgba(196, 168, 130, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0a0a0e; color: var(--text-primary); font-family: 'Noto Serif KR', 'Cormorant Garamond', serif; }
    #selectScreen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0e; }
    #mapMode {
      position: fixed; inset: 0; background: #0a0a0e; display: none; flex-direction: column; z-index: 50;
    }
    #mapMode.active { display: flex; }
    .map-canvas-area { flex: 1; position: relative; min-height: 0; }
    #contourCanvas { width: 100%; height: 100%; display: block; }
    .map-pins-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .map-pin {
      position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
      border-radius: 50%; transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .map-pin.core { width: 12px; height: 12px; border: 1.5px solid var(--accent-memory); background: rgba(232, 228, 220, 0.95); }
    .map-pin.core.active { box-shadow: 0 0 12px rgba(196,168,130,0.6); }
    .map-pin.echo { width: 6px; height: 6px; background: rgba(180, 160, 200, 0.85); border: 1px solid rgba(200, 180, 220, 0.5); }
    .map-pin.bridge {
      width: 9px; height: 9px; border: 1.3px solid #7a9a7a; background: rgba(122, 154, 122, 0.22);
      box-shadow: 0 0 10px rgba(122,154,122,0.5);
    }
    .map-pin.bridge.active { box-shadow: 0 0 10px rgba(122,154,122,0.5); }
    .map-pin.voidPin { width: 8px; height: 8px; background: transparent; border: 1px dashed rgba(200, 150, 140, 0.6); }
    .map-pin.active { box-shadow: 0 0 14px rgba(196, 168, 130, 0.55); opacity: 1; }
    .map-pin.current { box-shadow: 0 0 20px rgba(255, 220, 180, 0.8); }
    .map-pin.visited { opacity: 0.72; }
    .map-pin.visited::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; background: #888;
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    .map-pin.locked { opacity: 0.38; pointer-events: none; filter: grayscale(0.35); }
    .map-pin:not(.locked):not(.echo):hover {
      transform: translate(-50%, -50%) scale(1.35);
      box-shadow: 0 0 18px rgba(196, 168, 130, 0.7);
      filter: brightness(1.3);
      z-index: 10;
    }
    .map-pin.entrance { animation: entrancePulse 1.5s ease-in-out infinite; }
    @keyframes entrancePulse {
      0% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
      50% { box-shadow: 0 0 22px rgba(196, 168, 130, 0.65); transform: translate(-50%, -50%) scale(1.15); }
      100% { box-shadow: 0 0 8px rgba(196, 168, 130, 0.3); transform: translate(-50%, -50%) scale(1); }
    }
    .map-pin.unlocking { animation: pinUnlock 0.5s ease forwards; }
    .map-pin.locking { animation: pinLock 0.5s ease forwards; }
    @keyframes pinUnlock {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes pinLock { from { opacity: 1; } to { opacity: 0.06; } }
    .map-pin-label { position: absolute; left: 14px; top: -6px; font-size: 10px; color: rgba(200, 190, 220, 0.7); white-space: nowrap; font-style: italic; pointer-events: none; }
    .emotion-cursor {
      position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(196, 168, 130, 0.15);
      transform: translate(-50%, -50%); pointer-events: none; animation: cursorPulse 2s infinite; z-index: 1;
    }
    @keyframes cursorPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    }
    .map-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem;
      border-top: 1px solid rgba(196, 168, 130, 0.12); background: rgba(8, 8, 12, 0.92);
    }
    .map-status { font-size: 0.75rem; color: rgba(200, 195, 210, 0.65); letter-spacing: 0.04em; }
    .seal-btn {
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.45rem 1rem; border-radius: 6px; border: 1px solid rgba(200, 180, 230, 0.35);
      background: rgba(60, 45, 85, 0.45); color: rgba(232, 224, 252, 0.35); cursor: not-allowed;
    }
    .seal-btn:not(:disabled) { color: rgba(248, 240, 255, 0.95); background: rgba(100, 70, 130, 0.55); cursor: pointer; border-color: rgba(210, 190, 255, 0.55); }

    #sceneMode { display: none; position: fixed; inset: 0; background: var(--bg-deep); z-index: 50; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
    #sceneMode.active { display: flex; opacity: 1; }
    .wave-top { width: 100%; height: 18vh; max-height: 200px; position: relative; overflow: hidden; flex-shrink: 0; }
    #waveCanvas { width: 100%; height: 100%; display: block; }
    .scene-content-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1rem; overflow-y: auto; }
    .scene-main { width: 100%; max-width: 560px; text-align: center; }
    #sceneNpc { font-family: 'Cormorant Garamond', serif; font-style: italic; color: rgba(196, 168, 130, 0.5); font-size: 0.9rem; min-height: 1.2em; margin-bottom: 0.8rem; }
    #sceneText { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; line-height: 2; letter-spacing: 0.03em; color: var(--text-primary); margin-bottom: 1.5rem; }
    #emotionInputArea { opacity: 0; transition: opacity 0.6s; }
    #emotionInputArea.warn-border { box-shadow: 0 0 0 1px rgba(196, 168, 130, 0.15); border-radius: 8px; padding: 8px; }
    .emotion-chip {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.35); color: #ccc;
      padding: 10px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; cursor: pointer; transition: all 0.3s;
      border-radius: 4px; user-select: none; margin: 3px;
    }
    .emotion-chip:hover { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.08); }
    .emotion-chip.selected { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.1); }
    .action-btn {
      background: rgba(196, 168, 130, 0.1); border: 1px solid rgba(196, 168, 130, 0.25); color: #e8e4df;
      padding: 8px 24px; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; cursor: pointer; border-radius: 4px;
    }
    .action-btn:disabled { opacity: 0.3; cursor: default; }
    .action-btn.void { background: transparent; border-color: rgba(200, 150, 140, 0.3); color: rgba(200, 150, 140, 0.7); font-style: italic; }
    .typing::after { content: '|'; animation: blink 500ms step-end infinite; color: rgba(196, 168, 130, 0.6); }
    @keyframes blink { 50% { opacity: 0; } }

    #terrainBar {
      width: 100%; height: 120px; position: relative; flex-shrink: 0;
      border-top: none;
      background: #09090d;
      box-shadow: inset 0 1px 0 rgba(196, 168, 130, 0.06);
    }
    #terrainBar.awaiting-terrain { animation: terrainBarGlow 1.5s ease-in-out infinite; }
    @keyframes terrainBarGlow {
      0%, 100% { box-shadow: inset 0 1px 0 rgba(196, 168, 130, 0.06); }
      50% { box-shadow: inset 0 1px 0 rgba(196, 168, 130, 0.1), 0 -6px 24px rgba(100, 140, 200, 0.12); }
    }
    #terrainCanvas {
      width: 100%; height: 100%; display: block;
      pointer-events: none;
      vertical-align: top;
    }
    #terrainCanvas.clickable {
      pointer-events: auto !important;
      cursor: pointer;
      opacity: 0.97;
      transition: opacity 0.3s, filter 0.3s;
      /* glow는 곡선 지형(stroke) 쪽으로 — 직선 테두리 유도 방지 */
      filter: drop-shadow(0 -2px 10px rgba(130, 160, 220, 0.45)) drop-shadow(0 0 6px rgba(196, 168, 130, 0.25));
    }
    #terrainCanvas.clickable:hover {
      opacity: 1;
      filter: drop-shadow(0 -3px 14px rgba(130, 170, 230, 0.55)) drop-shadow(0 0 10px rgba(196, 168, 130, 0.35));
    }
    #terrainClickHint { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    /* 힌트를 하단(밀폐 fill의 직선과 겹침)이 아니라 상단·곡선 근처로 — 지형 stroke와 시각적으로 연결 */
    #terrainClickHint .hint-txt {
      position: absolute;
      top: 6px;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      color: rgba(200, 210, 235, 0.55);
      letter-spacing: 0.04em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      max-width: 96%;
      text-align: center;
      pointer-events: none;
    }

    #revealScreen {
      display: none; position: fixed; inset: 0; z-index: 60; background: #08080c; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    #revealScreen.active { display: flex; }
    #revealScreen h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 0.06em; color: var(--text-primary); }
    #revealScreen p { max-width: 520px; line-height: 1.8; color: rgba(220, 215, 230, 0.85); font-size: 0.95rem; }

    /* ================================================================
       STRATA — overlay HUD styles (copied from css/index.css minimal)
       ================================================================ */
    .strata-hud { position: fixed; z-index: 100; pointer-events: none; }
    .strata-h-tl { top: 20px; left: 28px; }
    .strata-h-tr {
      top: 20px; right: 28px; text-align: right; font-size: 11px;
      color: rgba(196, 168, 130, 0.4); line-height: 1.8; font-style: italic;
    }
    .strata-h-bl { bottom: 20px; left: 28px; }
    .strata-h-br { bottom: 20px; right: 28px; pointer-events: auto; }
    .strata-h-br input,
    .strata-h-br button,
    .strata-h-br select { pointer-events: auto; }
    .strata-tsm {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(196, 168, 130, 0.4); font-weight: 300;
    }
    .strata-tlg { font-size: 22px; letter-spacing: 8px; color: #c4a882; font-weight: 300; margin-top: 4px; }
    .strata-dlb { font-size: 10px; letter-spacing: 2px; color: rgba(196, 168, 130, 0.4); text-transform: uppercase; }
    .strata-dvl { font-size: 14px; color: #c4a882; font-weight: 300; margin-top: 2px; line-height: 1.5; }
    .strata-ct { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(196, 168, 130, 0.4); }
    .strata-ct-tk { width: 80px; height: 2px; background: rgba(196, 168, 130, 0.08); }
    .strata-ct-fl { height: 100%; background: #c4a882; transition: width 0.6s; }
    .strata-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 9px; letter-spacing: 3px;
      color: rgba(196, 168, 130, 0.12); text-transform: uppercase;
      animation: strata-pulse 4s ease-in-out infinite; pointer-events: none;
    }
    @keyframes strata-pulse { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.25; } }
    .strata-grain {
      position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0.018;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E") repeat;
      background-size: 256px;
    }
  </style>
</head>
<body>
  <div id="selectScreen">
    <h1 style="font-family:'Cormorant Garamond',serif;color:#e8e4df;font-size:2rem;font-weight:400;letter-spacing:0.05em;margin-bottom:2rem;">The Etched Mutation</h1>
    <select id="memorySelect" style="background:#111;color:#e8e4df;border:1px solid rgba(196,168,130,0.3);padding:0.6rem 1.2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;border-radius:4px;margin-bottom:1rem;min-width:250px;"></select>
    <button id="startBtn" type="button" style="background:transparent;border:1px solid rgba(196,168,130,0.3);color:#c4a882;padding:0.6rem 2rem;font-family:'Cormorant Garamond',serif;font-size:1rem;cursor:pointer;border-radius:4px;letter-spacing:0.05em;">Enter the memory</button>
  </div>

  <div id="mapMode">
    <div class="map-canvas-area" id="mapCanvasArea">
      <canvas id="contourCanvas"></canvas>
      <div class="map-pins-layer" id="mapPinsLayer"></div>
      <div class="emotion-cursor" id="emotionCursor" style="display:none;"></div>
    </div>
    <div class="map-bar">
      <span class="map-status" id="mapStatus"></span>
      <button type="button" class="seal-btn" id="sealBtn" disabled></button>
    </div>
  </div>

  <div id="sceneMode">
    <div class="wave-top" id="waveTop"><canvas id="waveCanvas"></canvas></div>
    <div class="scene-content-area">
      <div class="scene-main">
        <div id="sceneNpc"></div>
        <div id="sceneText"></div>
        <div id="emotionInputArea">
          <div id="emotionChips" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;"></div>
          <div id="sliderArea" style="margin-bottom:12px;"></div>
          <div id="reasonArea" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;"></div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button type="button" id="submitBtn" class="action-btn" disabled></button>
            <button type="button" id="voidBtn" class="action-btn void"></button>
          </div>
        </div>
      </div>
    </div>
    <div id="terrainBar">
      <canvas id="terrainCanvas"></canvas>
      <div id="terrainClickHint"><div class="hint-txt"></div></div>
    </div>
  </div>

  <div id="revealScreen">
    <h2 id="revealTitle"></h2>
    <p id="revealBody"></p>
    <p id="revealStats" style="font-size:0.85rem;color:var(--text-muted);"></p>
    <button type="button" class="action-btn" id="revealRestart" style="margin-top:1.5rem;"></button>
  </div>

  <!-- Strata overlay (copied from index.html) -->
  <div id="strataView" style="display:none;position:fixed;inset:0;z-index:2600;background:#0a0a0f;">
    <canvas id="strataCanvas" style="width:100%;height:100%;"></canvas>
    <div class="strata-hud strata-h-tl"><div class="strata-tsm">The Geology of Emotion</div><div class="strata-tlg">S T R A T A</div></div>
    <div class="strata-hud strata-h-tr" id="strataHudTR"></div>
    <div class="strata-hud strata-h-bl">
      <div class="strata-dlb">Strata Structure</div>
      <div class="strata-dvl" id="strataDv">From above: emotional terrain<br>From the side: temporal fault lines</div>
    </div>
    <div class="strata-hud strata-h-br">
      <div class="strata-ct">Contamination<div class="strata-ct-tk"><div class="strata-ct-fl" id="strataCtFl" style="width:0%"></div></div><span id="strataCtVal">0.00</span></div>
            <div class="strata-ct" style="margin-top:8px;">Brightness<input id="strataBrightness" type="range" min="0.8" max="2.4" step="0.05" value="1.35" style="width:120px;margin:0 8px;" /><span id="strataBrightnessVal">1.35x</span></div>
    </div>
    <div class="strata-hint">drag to rotate — view from side to see cross-section</div>
    <div class="strata-grain"></div>
    <div id="strataLc"></div>
    <button id="strataCloseBtn" style="position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:120;background:transparent;border:1px solid rgba(196,168,130,0.3);color:#c4a882;padding:12px 32px;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:3px;cursor:pointer;transition:all 0.3s;">Leave the strata behind</button>
    <button id="backToMenu" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:120;background:transparent;border:1px solid rgba(196,168,130,0.18);color:rgba(196,168,130,0.85);padding:12px 32px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:3px;cursor:pointer;transition:all 0.3s;display:none;">Return to Menu</button>
  </div>

  <script>

      revealRestart: '다시 시작',
      revealFallback: '이 기억은 다시 열리지 않을지도 모릅니다. 남은 파도는 흙 아래 가라앉습니다.',
