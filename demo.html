<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Etched Mutation — Demo Hub</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/demo-hub.css">
</head>
<body>
  <div class="demo-hub" id="demoHub">
    <header class="demo-hub__header">
      <div class="demo-hub__brand">
        <h1 class="demo-hub__title">Demo Hub</h1>
        <p class="demo-hub__subtitle">The Etched Mutation — 테스트용 묶음 (<strong>demo.html</strong>)</p>
      </div>
      <p class="demo-hub__note">
        <strong>index.html</strong> 본편에는 고저 미니맵·등고 지도 통합이 <em>켜져 있지 않습니다</em>.
        아래 탭에서 본편 플레이, 등고 지형 맵(<code>contour-test</code>), 기존 단계 데모(플레이 중 2D 고저 미니맵)를 전환할 수 있습니다.
      </p>
      <nav class="demo-hub__tabs" role="tablist" aria-label="데모 종류">
        <button type="button" class="demo-hub__tab active" role="tab" aria-selected="true" data-src="index.html" id="tab-index">
          Index 플레이
        </button>
        <button type="button" class="demo-hub__tab" role="tab" aria-selected="false" data-src="contour-test.html" id="tab-contour">
          고저 지형 맵
        </button>
        <button type="button" class="demo-hub__tab" role="tab" aria-selected="false" data-src="demo-sequence.html" id="tab-sequence">
          단계 데모 (미니맵)
        </button>
      </nav>
    </header>
    <div class="demo-hub__frame-wrap">
      <iframe
        id="demoHubFrame"
        class="demo-hub__frame"
        src="index.html"
        title="Demo Hub content"
        loading="lazy"
      ></iframe>
    </div>
  </div>
  <script>
    (function () {
      var tabs = document.querySelectorAll('.demo-hub__tab');
      var frame = document.getElementById('demoHubFrame');
      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          var src = btn.getAttribute('data-src');
          if (src && frame) frame.src = src;
        });
      });
    })();
  </script>
</body>
</html>
