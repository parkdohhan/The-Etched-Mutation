const SLIDES=[
{ html:`
  <div class="eyebrow">Interactive Media Art · Formal Semantics of Memory</div>
  <h1>Is There an <span class="k">Original</span>?</h1>
  <p class="lead">A sheaf-theoretic formalization of memory variance —<br>and the artwork built to measure it.</p>
  <div class="fill"></div>
  <p class="foot">Dohan Park · The Etched Mutation · pre-registered draft, 2026</p>`,
  cue:`훅. 제목 읽고 3초 침묵.`,
  script:`Every field that studies memory shares one silent assumption. Today I want to name it, break it, and replace it with something you can compute. This is a talk about a question we have never been able to ask — and an artwork I built so that we finally can.`},

{ html:`
  <div class="eyebrow">The premise</div>
  <h2>The question the <span class="k">tree</span> forbids</h2>
  <div class="two mid">
    <div><ul>
      <li>Manuscript variants are reconstructed with a <span class="accent">family tree</span>: one root archetype, branches of copying error.</li>
      <li>But drawing the tree <span class="accent">already assumes the root</span>.</li>
      <li class="muted">Bédier's critique asked <em>which tree</em> — never <em>whether a root exists</em>.</li>
    </ul></div>
    <div class="diagram">${SVG.tree}</div>
  </div>`,
  cue:`셋업. "뿌리는 이미 전제된다" 강조. 그림 가리키며.`,
  script:`Here is the standard tool for how texts mutate across copies: a family tree. One original at the root, every scribe's error branching down. Powerful — but notice what it forbids. The instant you draw the tree, the root is already assumed. Even the most famous critique, Bédier's, only asked which tree is right. Nobody could ask whether a root exists at all.`},

{ html:`
  <div class="eyebrow">The premise, everywhere</div>
  <h2>Memory science shares the <span class="k">coordinate zero</span></h2>
  <ul style="max-width:80%">
    <li>Since Bartlett (1932): recall is <span class="accent">reconstruction</span>, not replay.</li>
    <li>But "reconstruction" grammatically demands a thing-before-reconstruction.</li>
    <li class="muted">distortion · contamination · degradation — every standard term sets the original as the origin of coordinates.</li>
  </ul>`,
  cue:`같은 병이 심리학에도. 어휘 자체가 원본을 전제.`,
  script:`And it's not just old manuscripts. Since Bartlett, we've known remembering is reconstruction, not playback. But listen to the word: re-construction presupposes something constructed first. Distortion, contamination, degradation — the whole vocabulary places the original at coordinate zero. Every measurement is a distance from an origin we never questioned.`},

{ html:`
  <div class="fill" style="flex:.5"></div>
  <div class="eyebrow">The move</div>
  <h2 style="font-size:4vw;line-height:1.1">Move existence from<br><span class="muted">premise</span> &nbsp;→&nbsp; <span class="k">computation.</span></h2>
  <p class="lead">Not: assume the original, measure deviation.<br>Instead: ask whether an original <em>can exist at all</em> — and get a number.</p>
  <div class="fill"></div>`,
  cue:`논문의 심장. 또박또박, 느리게.`,
  script:`So here is the whole move, in one sentence. We stop assuming the original and measuring how far each version strays. Instead we ask whether a single consistent original could exist at all — and we turn that yes-or-no into a computation. Existence stops being a premise. It becomes a result. To do that I need one piece of mathematics.`},

{ html:`
  <div class="eyebrow">Intuition — no math yet</div>
  <h2>Three siblings remember one <span class="k">grandmother</span></h2>
  <div class="two mid">
    <div class="kr"><ul>
      <li>Each remembers overlapping but different moments.</li>
      <li class="accent" style="font-size:2vw">Do the memories reassemble into one true grandmother?</li>
    </ul></div>
    <div>
      <div class="box" style="margin-bottom:1em"><p><b>Common sense</b> — yes. Each saw a part; stitch the parts.</p></div>
      <div class="box" style="border-color:#cdd8ee;background:#eef2fa"><p><b class="accent">Variant theory</b> — no. They will not stitch. There is no single grandmother.</p></div>
    </div>
  </div>`,
  cue:`할머니 이야기 1부. 긴장 풀리는 자리. 편하게.`,
  script:`Forget the equations for a moment. Three siblings remember their late grandmother. Their memories overlap in places, differ in others. Ask: if we collect all three, does one true grandmother come back? Common sense says yes — each saw a part, so stitch them. The theory I'm defending says no. They will not stitch into one. There were only ever three different grandmothers. The mathematics I'll show is nothing but the machine that checks: can these pieces be stitched — yes or no?`},

{ html:`
  <div class="eyebrow">Intuition — the crucial part</div>
  <h2>The clash lives in the <span class="k">transitions</span>, not the scenes</h2>
  <div class="two mid">
    <div class="kr">
      <p style="margin-bottom:.6em"><span class="tag">same moment</span> &nbsp;the kitchen</p>
      <ul>
        <li>Brother A: warm — <span class="muted">right after she forgave him.</span></li>
        <li>Brother B: cold — <span class="muted">right before the fight.</span></li>
      </ul>
    </div>
    <div>
      <p>The kitchen <span class="accent">value</span> agrees.<br>What it <span class="accent">connects to</span> is opposite.</p>
      <p class="sub" style="margin-top:.7em">No single timeline holds both. The conflict is in the <b>seam</b>, not the scene.</p>
    </div>
  </div>`,
  cue:`제일 중요. "충돌은 이음매에 있다" = 논문 뼈대.`,
  script:`Here's the subtle part — the part that makes this mathematics, not metaphor. The siblings don't just remember different events. Even where they remember the same moment, the connections differ. Both remember the kitchen. For A it was warm, right after forgiveness. For B, cold, right before a fight. Same moment — opposite of what it flows from. You cannot fold these into one timeline. The conflict is not inside the scene. It lives in the seam between scenes. Hold onto that word: seam.`},

{ html:`
  <div class="eyebrow">Formalization</div>
  <h2>A memory as a <span class="k">cellular sheaf</span></h2>
  <ul style="max-width:82%">
    <li><span class="accent">Base space</span> — scenes of a memory, as a graph of admissible transitions.</li>
    <li><span class="accent">A section</span> — one playthrough's emotional trajectory over the scenes it visited.</li>
    <li><span class="accent">Gluing</span> — do overlapping sections assemble into one global telling?</li>
  </ul>
  <div class="fill"></div>
  <p class="note-quote">A section carries the seams, not just the values. Values alone always glue — and the theory would be empty.</p>`,
  cue:`형식화. "절편=값이 아니라 이음매 포함" 함정 회피.`,
  script:`The formal version. Take the scenes as points and admissible transitions as edges — that's the base space. Over it we build a cellular sheaf. A section is one playthrough: the emotional trajectory a person left across the scenes they visited. Gluing is exactly the grandmother question — do overlapping sections assemble into one global telling? One trap: a section must carry the seams, the transitions, not just values. Values alone would trivially glue, and the theory would say nothing.`},

{ html:`
  <div class="eyebrow">Derivation · 1 of 2</div>
  <h2>From tellings to a <span class="k">cochain</span></h2>
  <div class="two mid">
    <div>
      <p class="gloss" style="margin-bottom:.7em">Nerve graph N: nodes = runs; edge (p,q) if they share ≥ m scenes; weight w<sub>pq</sub> = # shared scenes.</p>
      <div class="math">
        <div>d<sub>pq</sub>(s) = σ<sub>p</sub>(s) − σ<sub>q</sub>(s)</div>
        <div><span class="lhs">g<sub>pq</sub></span> = mean<sub>s</sub> d<sub>pq</sub>(s) <span class="gloss">&nbsp;constant offset</span></div>
        <div><span class="lhs">r<sub>pq</sub></span> = √( mean<sub>s</sub> ‖d<sub>pq</sub>(s) − g<sub>pq</sub>‖² )</div>
      </div>
    </div>
    <div class="box">
      <h3>Pairwise-consistency gate</h3>
      <p>Keep an edge only if <b class="accent">r<sub>pq</sub> ≤ τ</b> — the two runs are translatable by a single shift g<sub>pq</sub>. τ = median(r). These are precisely the "agrees with its neighbor" edges.</p>
    </div>
  </div>`,
  cue:`유도 1. g=상수 오프셋(재보정), r=상수이동으로 번역 가능한가. 그림 대신 수식.`,
  script:`Now the actual construction. Build a nerve graph: each run is a node, and two runs are joined if they share at least m scenes, weighted by how many. On each shared scene, take the difference between the two tellings. Its average is g — a single constant offset, think of it as one run recalibrated onto the other. The residual r asks: can these two runs be reconciled by that one shift alone? If the residual is at most tau, we call the edge consistent — these are the pairs that agree with their neighbor.`},

{ html:`
  <div class="eyebrow">Derivation · 2 of 2 — the number</div>
  <h2>What no recalibration removes: <span class="k">ρ</span></h2>
  <div class="math" style="margin:.2em 0 .3em">
    <div>h* = argmin<sub>h</sub> &nbsp;Σ<sub>(p,q)∈E</sub> w<sub>pq</sub> ‖ g<sub>pq</sub> − (h<sub>p</sub> − h<sub>q</sub>) ‖² &nbsp;&nbsp;<span class="op">⟶</span>&nbsp;&nbsp; L h = δ<sup>T</sup>(w·g)</div>
  </div>
  <div class="eq" style="font-size:2vw;margin:.2em 0 .7em"><span class="accent">ρ</span> = &nbsp;Σ w‖g − δh*‖² &nbsp;/&nbsp; Σ w‖g‖² &nbsp;&nbsp;∈ [0,1]</div>
  <ul style="max-width:90%">
    <li>h gives each run its best global recalibration. Whatever it explains away is <span class="muted">reducible</span>.</li>
    <li><span class="accent">ρ = the share that survives</span> — the cyclic, path-dependent residue. ρ &gt; 0 ⟺ nonzero holonomy around loops.</li>
    <li class="muted">ρ = 0 ⟺ one global telling fits every run. "The original exists," computed — not assumed.</li>
  </ul>`,
  cue:`유도 2 = 페이오프. ρ가 재보정으로 안 지워지는 순환 잔여. 느리게.`,
  script:`Here's the payoff. Let h assign every run its own best global recalibration — solved by a single graph-Laplacian linear system, trivial at this size. Whatever that recalibration explains away is reducible; it's just per-run bias. Rho is the fraction that survives it — the cyclic, path-dependent residue that no per-run shift can remove. Rho greater than zero is exactly nonzero holonomy around loops. And rho equal to zero means one global telling fits every run: the original exists, computed rather than assumed. Rho is the whole experiment in one number.`},

{ html:`
  <div class="eyebrow">Instrument 2 — the one that matters</div>
  <h2><span class="k">Monodromy</span>: locally fine, globally twisted</h2>
  <div class="two mid">
    <div class="diagram">${SVG.loop}</div>
    <div>
      <p>Follow overlaps around a loop and return — the telling has <span class="accent">twisted</span>.</p>
      <div class="box" style="margin-top:.9em;border-color:#cdd8ee;background:#eef2fa">
        <h3>Why pairwise distance is blind</h3>
        <p>Every neighbor agrees. Only going <em>around</em> reveals the twist. A flat metric reports "all consistent."</p>
      </div>
    </div>
  </div>`,
  cue:`두 번째 도구. 뫼비우스 연상. 쌍별로 못 봄이 핵심.`,
  script:`The second instrument carries the paper. Monodromy — path dependence. Walk the overlaps around a loop and come back, and the telling has twisted. A and B agree, B and C agree, C and A agree — yet the three cannot be one. Like a Möbius strip: every local patch looks normal; only going all the way around reveals the twist. This is why a flat pairwise-similarity metric is blind — every neighbor is consistent, so it reports "all fine." Only the sheaf sees the global twist.`},

{ html:`
  <div class="eyebrow">The instrument in the world</div>
  <h2>TEM <span class="k">generates</span> what it measures</h2>
  <div class="two mid">
    <div><ul>
      <li>Applied-sheaf work usually runs on toy data.</li>
      <li>Hundreds of real emotional trajectories over one scene graph <span class="accent">did not exist</span>.</li>
      <li>So I built the instrument that produces them.</li>
    </ul></div>
    <div class="box"><h3>The Etched Mutation</h3><p>An interactive artwork. Each visitor's telling is recorded as a local section — and reshapes the terrain the next visitor inherits.</p></div>
  </div>`,
  cue:`작품 소개. "재는 대상을 스스로 만든다" = 유일무이.`,
  script:`But this input didn't exist. Most applied sheaf theory runs on toy examples. Hundreds of real emotional trajectories over a shared scene graph — nobody had that. So I built the instrument that produces it. The Etched Mutation is an interactive artwork: each visitor moves through a memory, and their telling is recorded as a local section. The artwork *is* the measurement device. That's the unusual part — the instrument generates the very phenomenon it measures.`},

{ html:`
  <div class="fill" style="flex:.4"></div>
  <div class="eyebrow">The reframe</div>
  <p class="callout" style="max-width:34ch">What the artwork called <span class="accent">"contamination"</span> was the nameless version of disagreement energy.</p>
  <p class="lead">The seams the engine already tracked — trajectory mismatch between overlapping tellings — are exactly where the cohomological obstruction lives.</p>
  <div class="fill"></div>`,
  cue:`반전. 오염 = 코호몰로지의 이름 없는 판본.`,
  script:`And here the two halves meet. The artwork had, for months, tracked something it called "contamination" — the mismatch between how two overlapping tellings connect. That quantity was the nameless version of disagreement energy. The obstruction to gluing doesn't predict contamination — it *is* contamination, in another language. Art and mathematics were describing the same thing without knowing it.`},

{ html:`
  <div class="eyebrow">Falsifiability</div>
  <h2>The test that could <span class="k">kill</span> the theory</h2>
  <div class="two">
    <div>
      <p class="note-quote">Reviewer's knife: "Wouldn't pairwise distances give the same answer? Is the sheaf just decoration?"</p>
    </div>
    <div>
      <p>Defense — one phenomenon must exist in the data:</p>
      <p class="callout accent" style="font-size:2vw;margin-top:.5em">Tellings that agree with every neighbor, yet twist around the loop.</p>
      <p class="sub" style="margin-top:.7em">Present → the sheaf earns its place. Absent → the theory downgrades to an essay.</p>
    </div>
  </div>`,
  cue:`반증 조건. 학술적으로 가장 강한 자리.`,
  script:`A real theory has to be able to die. Here's the test that could kill this one. A reviewer will ask: wouldn't simple pairwise distances give the same result? Is the sheaf decoration? My defense needs one specific phenomenon to exist in the data: tellings that agree with every neighbor, yet twist around the loop. If it's there, the sheaf earns its place — nothing pairwise can reconstruct it. If it's absent, I lose, and this becomes a speculative essay. That's the falsification condition.`},

{ html:`
  <div class="fill" style="flex:.4"></div>
  <div class="eyebrow">Method</div>
  <h2 style="font-size:3.4vw">Criteria fixed <span class="k">before</span> the data.</h2>
  <p class="lead">Thresholds, null models, and the go / no-go rule were written and committed before running the experiment. When theory is cheap to generate, pre-registration is not a footnote — it is the method.</p>
  <div class="fill"></div>`,
  cue:`사전등록. AI 시대에 왜 이게 방법론인지.`,
  script:`One methodological point, explicit. Every threshold, every null model, the whole go/no-go rule — written and committed before I ran the experiment. This matters more than it used to. A fluent-sounding theory can now be generated in minutes. So what separates a theory that lives from one that merely sounds good is no longer eloquence — it's whether you staked a falsifiable claim before seeing the answer. Pre-registration here isn't a footnote. It's the method.`},

{ html:`
  <div class="eyebrow">Pilot — simulated</div>
  <h2>Even coherence-trained AI <span class="k">didn't glue</span></h2>
  <div class="two mid">
    <div>
      <div class="stat" style="color:${A_BLUE}">ρ = 0.18</div>
      <p class="sub" style="margin-top:.6em">Cyclic (non-reducible) share of disagreement across 39 runs.</p>
      <p style="margin-top:.7em"><span class="accent">p &lt; 0.001</span> — of 1,000 "original-exists" resamples, <b>zero</b> reached this.</p>
      <p class="muted" style="margin-top:.5em;font-size:1.3vw">Data: 39 persona-simulation runs. Not human. Not yet.</p>
    </div>
    <div class="diagram">${SVG.bell}</div>
  </div>`,
  cue:`파일럿 수치. "시뮬이지 실관객 아님" 반드시 명시.`,
  script:`Here's where the pilot stands. On thirty-nine runs, about eighteen percent of the disagreement is cyclic — the part no per-run recalibration removes. And in a thousand simulated worlds where an original genuinely exists, not one reached that value; the p-value is below a thousandth. The honest framing: these runs are not humans. They're language-model personas — simulations. But hold that thought — it makes the finding stranger, not weaker.`},

{ html:`
  <div class="eyebrow">Pilot results — MM23L · 39 runs · m=2 · τ=median</div>
  <h2>The <span class="k">table</span></h2>
  <table class="res">
    <tr><th>Axis set</th><th>ρ</th><th>N1 · shuffle</th><th>N2 · global-section</th><th>N3 · bootstrap</th><th>Exhibit&nbsp;A</th></tr>
    <tr class="hl"><td>A12 · decision</td><td class="mono">0.184</td><td class="mono">p = 1.00</td><td class="mono">p &lt; 0.001</td><td class="mono">p &lt; 0.001</td><td class="mono">0</td></tr>
    <tr><td>A17 · canonical</td><td class="mono">0.176</td><td class="mono">p = 1.00</td><td class="mono">p &lt; 0.001</td><td class="mono">p &lt; 0.001</td><td class="mono">1</td></tr>
    <tr><td>A9 · judged (6 real)</td><td class="mono">0.187</td><td class="mono">p = 1.00</td><td class="mono">p &lt; 0.001</td><td class="mono">p &lt; 0.001</td><td class="mono">1</td></tr>
  </table>
  <p class="cap"><b>N1 p = 1.00</b> is not a failure: destroying scene order gives <em>more</em> cyclic disagreement — order carries real structure. <b>N2</b> is the main null (an original-exists world); observed ρ beats all 1,000 resamples. <b>N3</b> preserves axis correlation and agrees. <b>Exhibit A</b> = loops twisted beyond the null's 99th percentile — present for A17/A9, borderline-absent for the conservative A12 (max ‖W‖/T = 0.996×).</p>`,
  cue:`결과 표. N1=1.00이 왜 좋은 신호인지 반드시 설명(순서가 구조를 담음).`,
  script:`Now the full table — three choices of emotion axis space against three null models. Read the decision row, A12. Rho is 0.18. Against N2 — the original-exists null — it beats every one of a thousand resamples, p below a thousandth; N3, which keeps the axis correlations, agrees. Note N1: p equals one. That's not a failure — it says that shuffling the scene order produces MORE cyclic disagreement, so the real order carries structure that reduces it. And Exhibit A — a single loop twisted past the null's 99th percentile — shows up for the other axis sets but sits right on the boundary for the conservative decision axis. That borderline is exactly why the verdict is weak-go, not go. I'm reporting the number that argues against me too.`},

{ html:`
  <div class="eyebrow">Does the instrument work? — sanity check</div>
  <h2>Two worlds with <span class="k">known</span> answers</h2>
  <div class="two mid">
    <div class="box"><h3>World 1 — no twist, by construction</h3>
      <p class="mono pos" style="font-size:2.4vw;font-weight:700">ρ = 0.00003</p>
      <p>A synthetic original-exists world. The pipeline returns ≈ 0, as it must.</p></div>
    <div class="box" style="border-color:#cdd8ee;background:#eef2fa"><h3>World 2 — one twist injected</h3>
      <p class="mono accent" style="font-size:2.4vw;font-weight:700">ρ = 0.9998</p>
      <p>A cyclic twist planted on one ring. ρ spikes <em>and</em> Exhibit A localizes that exact ring.</p></div>
  </div>
  <p class="cap">Before trusting any number on real data: the pipeline must return ≈ 0 where the truth is zero, and must find a twist where one was planted. It does both. The measurement was validated before it was used.</p>`,
  cue:`자가검증. 답 아는 두 세계로 계측기가 진짜인지 먼저 증명. 신뢰의 근거.`,
  script:`One more slide, because a number is only as good as the instrument that produced it. Before touching the real data, I ran the pipeline on two worlds where I already knew the answer. World one: a synthetic world built to have a single consistent original. The pipeline returns rho of three hundred-thousandths — essentially zero, correct. World two: I planted one cyclic twist on a ring of runs. Rho jumps to point nine-nine-nine, and Exhibit A points back at that exact ring. So the instrument reads zero where the truth is zero, and localizes a twist where one exists. It was validated before it was believed.`},

{ html:`
  <div class="eyebrow">Reading it honestly</div>
  <h2>The strangeness, and the <span class="k">limits</span></h2>
  <div class="two">
    <div class="box"><h3>Why it's striking</h3><p>These agents were <em>trained to be consistent</em>. Even they left an irreducible cyclic residue. Real humans should leave more — a pre-registered prediction.</p></div>
    <div class="box"><h3>What I don't yet have</h3><p>No single dramatic loop yet · 39×10 limits power · LLM persona bias. The real test is <span class="accent">live audience data</span>.</p></div>
  </div>`,
  cue:`정직 슬라이드. 강점·한계 나란히. 방어력=정직.`,
  script:`Why striking? These agents were trained to be coherent — consistency is their whole job. Even they couldn't be stitched into one original; they left an irreducible cyclic residue. If a machine built for consistency leaves that residue, a human remembering a real loss should leave more. That's a pre-registered prediction for the live run. The limits, plainly: no single dramatic loop yet for a figure; thirty-nine runs over ten scenes is modest power; persona bias is real. The genuine test is the live audience — and that data is coming.`},

{ html:`
  <div class="eyebrow">Contribution</div>
  <h2>A falsifiable <span class="k">semantics</span> for variant theory</h2>
  <p class="callout" style="max-width:36ch;margin-bottom:.6em">"Variation is not degradation, but a mode of being."</p>
  <p>Given a precise, testable meaning:</p>
  <p class="callout accent" style="max-width:40ch;margin-top:.4em">objects whose baseline state is disagreement energy &gt; 0.</p>
  <p class="sub" style="margin-top:.7em">Not a metaphor about memory — a measurable property of it.</p>`,
  cue:`기여. 이본론 명제에 수학적 의미 부여.`,
  script:`What does the paper contribute? At the heart of variant theory is a claim — variation is not degradation, but a mode of being. Beautiful, but until now unfalsifiable. This work gives it a precise, testable meaning: variant memory is a class of objects whose baseline state is disagreement energy greater than zero. Not "the original is lost" as lament — but "no consistent original exists" as a measured property, with a number attached.`},

{ html:`
  <div class="eyebrow">Why this medium</div>
  <h2>Why it had to be an <span class="k">artwork</span></h2>
  <ul style="max-width:82%">
    <li>The theory needs local sections that are <span class="accent">lived</span> — trajectories a person walks, not answers they tick.</li>
    <li>A static survey flattens the very seams the theory is about.</li>
    <li>The medium is not decoration on the research — it is the <span class="accent">condition</span> of the measurement.</li>
  </ul>`,
  cue:`매체 필연성. 왜 설문이 아니라 작품인가.`,
  script:`Why art, not just a study. The theory needs local sections that are lived — emotional trajectories a person actually walks, moment to moment — not boxes ticked on a form. A static survey flattens exactly the seams the theory is about. Only an interactive work produces trajectories with real transitions in them. So the medium isn't decoration bolted onto the research. It's the precondition of the measurement itself.`},

{ html:`
  <div class="fill" style="flex:.5"></div>
  <div class="eyebrow">Where this goes</div>
  <h2 style="font-size:4vw">From <span class="muted">premise</span> to <span class="k">measurement.</span></h2>
  <p class="lead">Preservation assumes the pieces reassemble into an original. Variant theory says the seams won't close — and now that refusal has a number, and a claim you could prove wrong. Next: the seams of real people.</p>
  <div class="fill"></div>
  <p class="foot">Thank you · The Etched Mutation · dohhan_ · 2026</p>`,
  cue:`닫기. 1번과 수미상관. 마지막 문장 후 침묵.`,
  script:`To close where we opened. Preservation believes the pieces stitch back into an original. Variant theory says the seams will not close — and for the first time, that refusal is not a poetic claim but a number you can compute, and a claim you could prove me wrong on. The pilot did it with simulated minds. What remains is to do it with the seams of real people. Thank you.`}
];

const deck=document.getElementById('deck');
SLIDES.forEach(s=>{const d=document.createElement('section');d.className='slide';d.innerHTML=s.html;deck.appendChild(d);});
const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),pg=document.getElementById('pg');
const notes=document.getElementById('notes'),ncue=document.getElementById('ncue'),nscript=document.getElementById('nscript');
let i=0;
function show(n){
  i=Math.max(0,Math.min(SLIDES.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  bar.style.width=((i+1)/SLIDES.length*100)+'%';
  pg.textContent=String(i+1).padStart(2,'0')+' / '+SLIDES.length;
  ncue.textContent=SLIDES[i].cue||''; nscript.textContent=SLIDES[i].script||'';
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowright','arrowdown','pagedown',' '].includes(e.key.toLowerCase())){show(i+1);e.preventDefault();}
  else if(['arrowleft','arrowup','pageup'].includes(e.key.toLowerCase())){show(i-1);e.preventDefault();}
  else if(k==='home'){show(0);} else if(k==='end'){show(SLIDES.length-1);}
  else if(k==='n'){notes.classList.toggle('on');}
  else if(k==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
document.getElementById('frame').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  if(e.clientX-r.left>r.width*0.5)show(i+1);else show(i-1);
});
show(0);
</script>
