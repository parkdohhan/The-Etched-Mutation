<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 걸음 — The Etched Mutation</title>
<style>
  :root { --ink: #d7dee6; --mine: #ffb057; --ghost: #8b97a6; --dim: #6c7683; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #dark { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2.4s linear; }
  #cap { position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%); width: min(680px, calc(100vw - 32px));
    text-align: center; line-height: 1.85; font-size: clamp(15px, 2.1vw, 19px); pointer-events: none; text-shadow: 0 0 12px #000, 0 0 3px #000; }
  #cap p { margin: 0 0 .35em; min-height: 1em; word-break: keep-all; }
  #cap .mine { color: var(--mine); }
  #cap .ghost { color: var(--ghost); font-style: italic; }
  #hint { position: fixed; left: 0; right: 0; bottom: 3.2vh; text-align: center; font-size: 12px; letter-spacing: .08em; color: var(--dim);
    pointer-events: none; opacity: 0; transition: opacity .8s; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  #hint.on { opacity: 1; }
  #go { position: fixed; left: 50%; bottom: 6.5vh; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 50%;
    border: 1px solid #4a5360; background: rgba(10, 13, 17, .55); color: var(--ink); font: 13px -apple-system, "Apple SD Gothic Neo", sans-serif;
    display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { #go.on { display: block; } #hint { bottom: 1.2vh; } #cap { bottom: 22vh; } }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 0 16px; background: #000; transition: opacity 1.6s; }
  .screen.off { opacity: 0; pointer-events: none; }
  .screen h1 { font-weight: 400; font-size: clamp(22px, 4vw, 34px); letter-spacing: .12em; margin: 0 0 1.4em; }
  .screen p { margin: 0 0 .5em; line-height: 1.9; color: var(--ink); font-size: clamp(14px, 2vw, 17px); word-break: keep-all; max-width: 560px; }
  .screen .small { color: var(--dim); font-size: 12px; margin-top: 2.4em; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; letter-spacing: .04em; }
  button.plain { margin-top: 2.2em; background: none; border: 1px solid #4a5360; color: var(--ink); padding: .7em 2.2em; font: inherit; font-size: 15px;
    letter-spacing: .2em; cursor: pointer; }
  button.plain:hover { border-color: var(--ink); }
  button.plain[disabled] { opacity: .35; cursor: default; }
  #end { background: none; justify-content: flex-end; padding-bottom: 3.5vh; pointer-events: none; }
  #end p { text-shadow: 0 0 14px #000, 0 0 4px #000; }
  #end .mine { color: var(--mine); font-size: clamp(16px, 2.4vw, 21px); min-height: 1.9em; }
  #end .note { color: var(--dim); font-size: 13px; min-height: 1.9em; }
  #end button { pointer-events: auto; opacity: 0; transition: opacity 2s; margin-top: 1.2em; }
  #end button.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dark"></div>
<div id="cap"></div>
<div id="hint"></div>
<button id="go" aria-label="걷기">걷기</button>

<div id="end" class="screen off">
  <p class="mine" id="endMine"></p>
  <p class="note" id="endNote1"></p>
  <p class="note" id="endNote2"></p>
  <button class="plain" id="again">처음부터</button>
</div>

<div id="intro" class="screen">
  <h1 id="inTitle">&nbsp;</h1>
  <p id="inLine1">불러오는 중입니다.</p>
  <p id="inLine2"></p>
  <button class="plain" id="enter" disabled>들어가기</button>
  <p class="small">W 또는 ↑ 를 누르고 있으면 걷습니다 · 화면을 끌면 둘러봅니다 · 소리가 납니다</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
/**
 * One walk, built as a place. Standalone: no code shared with the terrain stage, the corridor, the way or the piece room.
 * Material = one run in the ledger (plays, read-only): the scenes one walker passed, in their order, with what they wrote.
 * Nothing is written anywhere. Manuscript sentences and the walker's lines are read at run time, never stored in this file.
 *
 * Staging choices (free parameters, not definitions):
 *   · the path is one continuous line; seen from above it is a face in profile, and it ends on the cheekbone
 *   · a station's thing sits lower in the water the further the walker's line was from the scene (SINK below)
 *   · amber = what the walker brought; white = what was there
 */
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/lib/config.js';

const Q = new URLSearchParams(location.search);
const RUN = Q.get('run') || 'e08e2183-107a-4603-9410-6f2e67a00b5d';
const FAST = Math.max(1, Number(Q.get('fast')) || 1);
const AUTO = Q.get('auto') === '1';
const JUMP = Q.get('at') || '';
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms / FAST));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (t) => t * t * (3 - 2 * t);

// ── the ledger ──────────────────────────────────────────────────────────────
async function rest(path) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } });
  if (!r.ok) throw new Error('read failed: ' + r.status);
  return r.json();
}
async function loadWalk() {
  const rows = await rest(`plays?run_id=eq.${RUN}&scene_id=not.is.null&select=memory_id,scene_id,created_at,alignment,dialog_turns&order=created_at`);
  if (!rows.length) throw new Error('no such walk');
  const mid = rows[0].memory_id;
  const [mem] = await rest(`memories?id=eq.${mid}&select=title`);
  const scenes = await rest(`scenes?memory_id=eq.${mid}&select=id,scene_order,text`);
  const byId = new Map(scenes.map((s) => [s.id, s]));
  const stations = rows.filter((r) => byId.has(r.scene_id)).map((r) => {
    const s = byId.get(r.scene_id), text = String(s.text || '').replace(/\s+/g, ' ').trim();
    return { order: s.scene_order, text, silent: !text || /^[.…\s]+$/.test(text), align: clamp(Number(r.alignment) || 0, 0, 1),
      turns: (Array.isArray(r.dialog_turns) ? r.dialog_turns : []).map((t) => ({ mine: String(t.raw_text || '').trim(), ghost: String(t.ghost_reply || '').replace(/\s+/g, ' ').trim() })).filter((t) => t.mine) };
  });
  const t0 = new Date(rows[0].created_at), t1 = new Date(rows[rows.length - 1].created_at);
  const k = new Date(t0.getTime() + 9 * 3600e3), h = k.getUTCHours();
  const part = h < 6 ? '새벽' : h < 12 ? '아침' : h < 18 ? '낮' : '밤';
  return { title: (mem && mem.title) || '', stations, when: `${k.getUTCFullYear()}년 ${k.getUTCMonth() + 1}월 ${k.getUTCDate()}일 ${part}`, minutes: Math.max(1, Math.floor((t1 - t0) / 60000)) };
}

// ── the scene ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const FOG_NEAR = 0.05, FOG_FAR = 0.0035;
scene.fog = new THREE.FogExp2(0x000000, FOG_NEAR);
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 600);
function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

const C = { line: 0xcdd6e0, dimline: 0x6f7a87, amber: 0xffb057, blue: 0x6f9bd1, fill: 0x05070a };
const M = {
  line: new THREE.LineBasicMaterial({ color: C.line }),
  dim: new THREE.LineBasicMaterial({ color: C.dimline }),
  amber: new THREE.LineBasicMaterial({ color: C.amber }),
  blue: new THREE.LineBasicMaterial({ color: C.blue }),
  fill: new THREE.MeshBasicMaterial({ color: C.fill, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide }),
};
function solid(geom, mat, thr) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geom, M.fill));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom, thr === undefined ? 20 : thr), mat || M.line));
  return g;
}
const box = (w, h, d, mat) => solid(new THREE.BoxGeometry(w, h, d), mat);
const put = (o, x, y, z) => { o.position.set(x, y, z); return o; };
function stroke(pts, mat, closed) {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
  return closed ? new THREE.LineLoop(g, mat || M.line) : new THREE.Line(g, mat || M.line);
}
function oval(rx, rz, mat, n) { const pts = []; for (let i = 0; i < (n || 40); i++) { const a = (i / (n || 40)) * Math.PI * 2; pts.push([Math.cos(a) * rx, 0, Math.sin(a) * rz]); } return stroke(pts, mat, true); }
const glowTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const x = cv.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cv); })();
function glow(color, size, opacity) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: opacity === undefined ? 0.7 : opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog: true }));
  s.scale.set(size, size, 1); return s;
}

// things, one per scene of this memory. Each returns { g, h } — h is how tall it stands (used for sinking).
const pulses = [], drifters = [];
const THINGS = {
  2() {   // the iron gate under a faded blue roof — closed
    const g = new THREE.Group();
    g.add(put(box(0.28, 3, 0.28), -1.25, 1.5, 0), put(box(0.28, 3, 0.28), 1.25, 1.5, 0), put(box(2.2, 2.7, 0.08), 0, 1.35, 0));
    for (const y of [0.55, 1.35, 2.15]) g.add(stroke([[-1.1, y, 0.06], [1.1, y, 0.06]], M.dim));
    g.add(stroke([[0, 0, 0.06], [0, 2.7, 0.06]], M.dim));
    const roof = box(4.2, 0.12, 2.6, M.blue); roof.rotation.x = 0.16; g.add(put(roof, 0, 3.25, 0.2));
    return { g, h: 3.3 };
  },
  6() {   // the tub; a face under its water, only the outline, and the cheekbone
    const g = new THREE.Group();
    g.add(put(box(3.3, 1.1, 1.6), 0, 0.55, 0));
    g.add(put(stroke([[-1.5, 0, -0.65], [1.5, 0, -0.65], [1.5, 0, 0.65], [-1.5, 0, 0.65]], M.dim, true), 0, 1.1, 0));
    const face = new THREE.Group();
    face.add(oval(0.5, 0.36, M.line));
    face.add(stroke([[0.02, 0, -0.2], [0.2, 0, -0.14], [0.27, 0, -0.02]], M.amber));   // the cheekbone — "mine too"
    g.add(put(face, 0.55, 1.12, 0)); g.add(put(glow(0x9fb6cc, 1.6, 0.25), 0.55, 1.15, 0));
    return { g, h: 1.15 };
  },
  5() {   // the dog, the leash taken off, the paws still warm
    const g = new THREE.Group();
    const body = solid(new THREE.IcosahedronGeometry(1, 1), M.line, 1); body.scale.set(1.25, 0.36, 0.5); g.add(put(body, 0, 0.36, 0));
    const head = solid(new THREE.IcosahedronGeometry(1, 0), M.line, 1); head.scale.set(0.38, 0.26, 0.3); g.add(put(head, 1.45, 0.26, 0.12));
    for (const z of [-0.02, 0.26]) { const ear = solid(new THREE.ConeGeometry(0.09, 0.22, 4), M.line, 1); ear.rotation.z = -0.5; g.add(put(ear, 1.3, 0.56, z)); }
    for (const x of [-0.7, 0.75]) g.add(stroke([[x, 0.25, 0.4], [x + 0.25, 0.06, 0.95], [x + 0.55, 0.05, 0.98]], M.line));
    const leash = []; for (let i = 0; i <= 40; i++) { const t = i / 40; leash.push([1.3 + t * 2.3, 0.04 + Math.sin(t * Math.PI) * 0.05, -0.2 - Math.sin(t * 7) * 0.45 * (1 - t) - t * 1.3]); }
    g.add(stroke(leash, M.dim)); g.add(put(box(0.1, 0.7, 0.1), 3.6, 0.35, -1.5));
    g.add(put(glow(C.amber, 1.1, 0.5), 1.15, 0.12, 0.98));
    return { g, h: 0.8 };
  },
  9() {   // "as long as I wear this I will not move" — the one thing here that does not move
    const g = new THREE.Group();
    g.add(put(box(0.1, 2.3, 0.1), -1.9, 1.15, 0), put(box(0.1, 2.3, 0.1), 1.9, 1.15, 0));
    const sag = []; for (let i = 0; i <= 24; i++) { const t = i / 24; sag.push([-1.9 + t * 3.8, 2.25 - Math.sin(t * Math.PI) * 0.22, 0]); }
    g.add(stroke(sag, M.dim));
    g.add(stroke([[-0.42, 2.03, 0], [0.42, 2.03, 0], [0.36, 1.78, 0], [0.12, 1.58, 0], [0.07, 1.46, 0], [-0.07, 1.46, 0], [-0.12, 1.58, 0], [-0.36, 1.78, 0]], M.line, true));
    g.add(stroke([[-0.42, 1.97, 0], [0.42, 1.97, 0]], M.dim));
    return { g, h: 2.3 };
  },
  13() {  // the screen, put down. Neither answered nor refused
    const g = new THREE.Group();
    g.add(put(box(0.9, 0.75, 0.9), 0, 0.375, 0));
    const ph = box(0.42, 0.04, 0.82); ph.rotation.y = 0.35; g.add(put(ph, 0, 0.78, 0));
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.74), new THREE.MeshBasicMaterial({ color: 0xbfd4ea, transparent: true, opacity: 0.8 }));
    scr.rotation.x = -Math.PI / 2; scr.rotation.z = 0.35; g.add(put(scr, 0, 0.805, 0));
    const gl = glow(0xbfd4ea, 2.4, 0.5); g.add(put(gl, 0, 1.0, 0)); pulses.push({ a: scr.material, b: gl.material, kind: 'ring' });
    return { g, h: 0.85 };
  },
  4() {   // the child holding the woman's waist
    const g = new THREE.Group();
    g.add(put(solid(new THREE.CylinderGeometry(0.2, 0.52, 2.5, 6), M.line), 0, 1.25, 0));
    const h1 = solid(new THREE.IcosahedronGeometry(0.24, 0), M.line, 1); g.add(put(h1, 0, 2.78, 0));
    g.add(put(solid(new THREE.CylinderGeometry(0.14, 0.3, 1.15, 6), M.line), 0.55, 0.575, 0.12));
    const h2 = solid(new THREE.IcosahedronGeometry(0.17, 0), M.line, 1); g.add(put(h2, 0.5, 1.33, 0.1));
    const arms = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 24 }, (_, i) => { const a = (i / 24) * Math.PI * 2; return new THREE.Vector3(0.14 + Math.cos(a) * 0.5, 1.05, Math.sin(a) * 0.42); })), M.line);
    g.add(arms);
    return { g, h: 3.0 };
  },
  3() {   // the bell in the small room — and the flyers the walker brought in (amber: not in the manuscript)
    const g = new THREE.Group();
    g.add(put(box(1.1, 0.8, 0.8), 0, 0.4, 0), put(box(0.55, 0.2, 0.42), 0, 0.9, 0), put(box(0.78, 0.1, 0.14), 0, 1.07, 0));
    g.add(put(oval(0.13, 0.13, M.dim, 16), 0, 1.005, 0.0));
    const cord = []; for (let i = 0; i <= 30; i++) { const t = i / 30; cord.push([0.4 + t * 0.5, 1.02 - t * 1.0 + Math.sin(t * 22) * 0.03, 0.2 + Math.cos(t * 22) * 0.04]); }
    g.add(stroke(cord, M.dim));
    for (let i = 0; i < 6; i++) {
      const f = new THREE.Group(), a = i * 1.07 + 0.4, r = 1.7 + (i % 3) * 0.75;
      f.add(stroke([[-0.3, 0, -0.4], [0.3, 0, -0.4], [0.3, 0, 0.4], [-0.3, 0, 0.4]], M.amber, true));
      f.add(put(oval(0.12, 0.15, M.amber, 14), 0, 0, -0.1));                                   // where a face would be printed
      f.add(stroke([[-0.18, 0, 0.18], [0.18, 0, 0.18]], M.amber), stroke([[-0.18, 0, 0.27], [0.1, 0, 0.27]], M.amber));
      f.rotation.set(-1.1 + (i % 2) * 0.5, a, 0.3 * Math.sin(i));
      put(f, Math.cos(a) * r, 0.9 + (i % 4) * 0.42, Math.sin(a) * r); g.add(f); drifters.push({ o: f, y: f.position.y, ph: i * 1.3 });
    }
    pulses.push({ g: g.children[1], kind: 'shake' }, { g: g.children[2], kind: 'shake' });
    return { g, h: 1.15 };
  },
  8() {   // the drawer, searched on the nights she did not come home
    const g = new THREE.Group();
    g.add(put(box(1.9, 2.3, 0.95), 0, 1.15, 0));
    for (const [y, out] of [[0.45, 0], [1.15, 0.55], [1.85, 0]]) g.add(put(box(1.7, 0.56, 0.9 + (out ? 0.1 : 0.04)), 0, y, out + 0.03));
    g.add(put(glow(C.amber, 1.5, 0.55), 0, 1.5, 0.75));
    const fold = solid(new THREE.IcosahedronGeometry(1, 1), M.dim, 1); fold.scale.set(1.0, 0.2, 0.62); g.add(put(fold, 1.9, 0.2, 1.1));   // the blanket
    return { g, h: 2.35 };
  },
  11() {  // decided to believe she was dead — a frame with nothing in it
    const g = new THREE.Group();
    g.add(stroke([[-0.8, 0.9, 0], [0.8, 0.9, 0], [0.8, 3.0, 0], [-0.8, 3.0, 0]], M.line, true));
    g.add(stroke([[-0.68, 1.02, 0], [0.68, 1.02, 0], [0.68, 2.88, 0], [-0.68, 2.88, 0]], M.dim, true));
    g.add(stroke([[-0.8, 0.9, 0], [-0.95, 0, 0.3]], M.dim), stroke([[0.8, 0.9, 0], [0.95, 0, 0.3]], M.dim), stroke([[0, 0.9, 0], [0, 0, -0.5]], M.dim));
    return { g, h: 3.0 };
  },
  silent() { const g = new THREE.Group(); g.add(put(oval(2.6, 2.6, M.dim, 64), 0, 0.02, 0)); return { g, h: 0 }; },
  other() { const g = new THREE.Group(); g.add(put(box(0.3, 2.2, 0.3), 0, 1.1, 0)); return { g, h: 2.2 }; },
};

// ── the path: one continuous line. From above it is a profile that ends on the cheekbone ──────────────────────
const PROFILE = [[-0.32, 0.90], [-0.06, 1.01], [0.22, 0.97], [0.40, 0.84], [0.46, 0.68], [0.425, 0.565], [0.50, 0.50], [0.59, 0.40], [0.70, 0.285], [0.545, 0.235],
  [0.51, 0.18], [0.57, 0.125], [0.49, 0.085], [0.555, 0.03], [0.48, -0.04], [0.52, -0.15], [0.40, -0.26], [0.16, -0.22], [-0.10, -0.06], [-0.19, 0.16], [-0.12, 0.36], [0.06, 0.42], [0.22, 0.385], [0.31, 0.31]];
const SCALE = 46, PC = { x: 0.24, y: 0.38 };
const curve = new THREE.CatmullRomCurve3(PROFILE.map((p) => new THREE.Vector3((p[0] - PC.x) * SCALE, 0, -(p[1] - PC.y) * SCALE)), false, 'centripetal');
curve.arcLengthDivisions = 800;
const LENGTH = curve.getLength();
const EYE = 1.62, SIDE = 4.8, SINK = (a) => clamp((0.7 - a) / 0.6, 0, 0.9);   // share of the thing under water

const water = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshBasicMaterial({ color: 0x020305, transparent: true, opacity: 0.74, depthWrite: false }));
water.rotation.x = -Math.PI / 2; water.renderOrder = 2; scene.add(water);
{ // flecks on the water — something to walk past
  const n = 5000, pos = new Float32Array(n * 3); let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * 140; pos[i * 3 + 1] = 0.012; pos[i * 3 + 2] = (rnd() - 0.5) * 150; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x55606c, size: 0.05, sizeAttenuation: true, transparent: true, opacity: 0.8, depthWrite: false })); p.renderOrder = 3; scene.add(p);
}

// the walked line (amber: the walker's)
const TN = 900, trailMat = new THREE.MeshBasicMaterial({ color: C.amber, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide });
const trail = (() => {
  const pos = new Float32Array((TN + 1) * 6), idx = [];
  for (let i = 0; i <= TN; i++) {
    const u = i / TN, p = curve.getPointAt(u), t = curve.getTangentAt(u), nx = -t.z, nz = t.x, w = 0.16;
    pos.set([p.x + nx * w, 0.03, p.z + nz * w, p.x - nx * w, 0.03, p.z - nz * w], i * 6);
    if (i < TN) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx); g.setDrawRange(0, 0);
  const m = new THREE.Mesh(g, trailMat); m.renderOrder = 4; scene.add(m); return m;
})();

// snow
const SN = 4200, snowBase = new Float32Array(SN * 3), snowPos = new Float32Array(SN * 3);
for (let i = 0; i < SN * 3; i++) snowBase[i] = Math.random();
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.PointsMaterial({ color: 0xe8eef5, size: 0.075, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false, map: glowTex, fog: true });
const snow = new THREE.Points(snowGeo, snowMat); snow.frustumCulled = false; snow.renderOrder = 5; scene.add(snow);
const snowState = { t: 0, rate: 1, ext: new THREE.Vector3(30, 14, 30), centre: new THREE.Vector3() };

// ── sound (made here, no files) ─────────────────────────────────────────────
const snd = { ac: null, master: null, bell: null, wind: null, lp: null, level: 0, mute: 1, continuous: false, stopped: false };
function startSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = snd.ac = new AC(); snd.master = ac.createGain(); snd.master.gain.value = 0.9; snd.master.connect(ac.destination);
    const buf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = ac.createBufferSource(); n.buffer = buf; n.loop = true; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
    snd.wind = ac.createGain(); snd.wind.gain.value = 0.0; n.connect(f); f.connect(snd.wind); snd.wind.connect(snd.master); n.start();
    snd.bell = ac.createGain(); snd.bell.gain.value = 0; snd.lp = ac.createBiquadFilter(); snd.lp.type = 'lowpass'; snd.lp.frequency.value = 500;
    const trem = ac.createGain(); trem.gain.value = 0.5; const lfo = ac.createOscillator(); lfo.frequency.value = 22; const lg = ac.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(trem.gain); lfo.start();
    for (const hz of [1180, 1570, 2360]) { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = hz; const og = ac.createGain(); og.gain.value = hz > 2000 ? 0.18 : 0.4; o.connect(og); og.connect(trem); o.start(); }
    trem.connect(snd.lp); snd.lp.connect(snd.bell); snd.bell.connect(snd.master);
  } catch (e) { console.warn('[one-walk] sound', e); }
}
function tickSound(time, progress) {
  if (!snd.ac) return;
  const now = snd.ac.currentTime;
  const ringing = !snd.stopped && (snd.continuous || (time % 3.4) < 1.3);      // rings, stops, rings
  const near = 1 - Math.min(1, Math.abs(progress - snd.source) * 2.2);         // loudest by the bell itself
  snd.bell.gain.setTargetAtTime(ringing ? (0.012 + 0.05 * progress + 0.06 * near) * snd.mute : 0, now, 0.03);
  snd.lp.frequency.setTargetAtTime(420 + 4200 * Math.max(near, progress * 0.5), now, 0.3);
  snd.wind.gain.setTargetAtTime(0.07 * snd.mute, now, 0.4);
}

// ── text ────────────────────────────────────────────────────────────────────
async function type(el, text, per) {
  const step = (per || 40) / FAST;
  for (const ch of String(text)) {
    el.textContent += ch;
    await new Promise((r) => setTimeout(r, /[,.?!…]/.test(ch) ? step + 250 / FAST : step));
  }
}
function line(cls) { const p = document.createElement('p'); if (cls) p.className = cls; $('cap').appendChild(p); return p; }
const hint = (t) => { const h = $('hint'); h.textContent = t || ''; h.classList.toggle('on', !!t); };

// ── the walk ────────────────────────────────────────────────────────────────
const st = { phase: 'load', u: 0, walking: false, blocked: true, yaw: 0, pitch: 0, focus: null, focusW: 0, dir: new THREE.Vector3(0, 0, -1), next: 0, reveal: 0, cover: 0, bob: 0 };
let walk = null; const stations = [];
window.__walk = st;

function build(w) {
  walk = w;
  const n = w.stations.length;
  w.stations.forEach((s, i) => {
    const u = n === 1 ? 1 : 0.035 + (1 - 0.035) * (i / (n - 1));
    const p = curve.getPointAt(u), t = curve.getTangentAt(u), side = i % 2 ? -1 : 1;
    const make = s.silent ? THINGS.silent : (THINGS[s.order] || THINGS.other), thing = make();
    const at = s.silent ? p.clone() : new THREE.Vector3(p.x - t.z * side * SIDE + t.x * 1.2, 0, p.z + t.x * side * SIDE + t.z * 1.2);
    thing.g.position.set(at.x, -SINK(s.align) * thing.h, at.z);
    thing.g.rotation.y = Math.atan2(p.x - at.x, p.z - at.z);                 // its front turned to where the walker stands
    scene.add(thing.g);
    if (!s.silent && SINK(s.align) > 0.02) for (const r of [2.3, 3.1]) scene.add(put(oval(r, r * 0.8, M.dim, 56), at.x, 0.015, at.z));   // where the water closes round it
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.5, 28), new THREE.MeshBasicMaterial({ color: 0xffe2bd, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
    dot.rotation.x = -Math.PI / 2; dot.position.set(p.x, 0.04, p.z); dot.renderOrder = 6; scene.add(dot);
    stations.push({ data: s, u, p, at, h: thing.h, g: thing.g, dot, done: false });
    if (s.order === 3) snd.source = u;
  });
  if (snd.source === undefined) snd.source = 0.8;
  $('inTitle').textContent = w.title;
  $('inLine1').textContent = `${w.when}, 한 사람이 이 기억의 장면 ${n}개를 ${w.minutes}분 동안 걸었습니다.`;
  $('inLine2').textContent = '그 사람이 걸은 순서대로, 그 사람이 남긴 말과 함께 놓았습니다.';
  $('enter').disabled = false;
  st.phase = 'intro';
}

async function arrive(s, i) {
  st.blocked = true; hint(''); st.focus = s.data.silent ? null : new THREE.Vector3(s.at.x, Math.max(0.5, s.h * (1 - SINK(s.data.align)) * 0.55), s.at.z);
  s.dot.material.opacity = 0.3;
  const cap = $('cap'); cap.innerHTML = '';
  const last = i === stations.length - 1;
  if (s.data.silent) {
    snowState.rate = 0; snd.mute = 0; $('dark').style.opacity = 0.72;        // the snow stops in the air
    await wait(3200);
    await type(line(), '…'); await wait(1400);
    for (let k = 0; k < s.data.turns.length; k++) {
      const t = s.data.turns[k]; cap.innerHTML = '';
      await type(line('mine'), t.mine); await wait(700);
      if (t.ghost) { await type(line('ghost'), t.ghost, 34); }
      $('dark').style.opacity = Math.max(0.28, 0.72 - 0.16 * (k + 1));        // the eyes get used to it
      await wait(2200);
    }
    snowState.rate = 1; snd.mute = 1; $('dark').style.opacity = 0;
  } else {
    await wait(900);
    await type(line(), s.data.text); await wait(900);
    for (const t of s.data.turns) {
      if (last && t === s.data.turns[s.data.turns.length - 1]) break;         // the last line is kept for the end
      await type(line('mine'), t.mine); await wait(500);
      if (t.ghost) await type(line('ghost'), t.ghost, 34);
    }
    if (s.data.order === 13) { await wait(600); snd.continuous = true; }      // from here it does not stop
    await wait(1700);
  }
  s.done = true; st.next = i + 1;
  if (last) return reveal();
  st.focus = null; st.blocked = false;
  hint(matchMedia('(pointer: coarse)').matches ? '걷기를 누르고 있으면 이어서 걷습니다' : 'W 또는 ↑ 를 누르고 있으면 이어서 걷습니다');
}

const top = { pos: new THREE.Vector3(), from: new THREE.Vector3(), qFrom: new THREE.Quaternion(), qTo: new THREE.Quaternion() };
async function reveal() {
  snd.stopped = true; await wait(1600);
  $('cap').innerHTML = ''; hint(''); $('go').classList.remove('on');
  const half = Math.tan((camera.fov * Math.PI) / 360), H = Math.max(31 / half, 25 / (half * camera.aspect)) * 1.5;
  top.pos.set(0.4, H, 2 + H * 0.1);                      // the face sits a little high, the last line under it top.from.copy(camera.position); top.qFrom.copy(camera.quaternion);
  // a camera looks down its -Z (a plain object would face away)
  const tmp = new THREE.PerspectiveCamera(); tmp.position.copy(top.pos); tmp.up.set(0, 0, -1); tmp.updateMatrixWorld(); tmp.lookAt(top.pos.x, 0, top.pos.z); top.qTo.copy(tmp.quaternion);
  st.phase = 'reveal'; st.reveal = 0;
  await wait(11500);
  const end = $('end'); end.classList.remove('off');
  const lastTurns = stations[stations.length - 1].data.turns, lastLine = lastTurns.length ? lastTurns[lastTurns.length - 1].mine : '';
  await type($('endMine'), lastLine, 70);
  st.phase = 'cover'; await wait(2600);
  await type($('endNote1'), '걸은 길은 한 줄이었고, 위에서 보면 얼굴이었습니다.', 45); await wait(900);
  await type($('endNote2'), '그 사람의 말이 장면에서 멀었던 자리의 사물은 물에 잠겨 있었습니다.', 45); await wait(1500);
  $('again').classList.add('on'); st.phase = 'done';
}

// input
const keys = new Set();
window.addEventListener('keydown', (e) => { if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) { keys.add(e.code); e.preventDefault(); } });
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());
let drag = null, holdGo = false;
$('c').addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; $('c').setPointerCapture(e.pointerId); });
$('c').addEventListener('pointermove', (e) => { if (!drag || st.phase !== 'walk') return; st.yaw = clamp(st.yaw - (e.clientX - drag.x) * 0.004, -1.9, 1.9); st.pitch = clamp(st.pitch - (e.clientY - drag.y) * 0.003, -0.6, 0.6); drag = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', () => { drag = null; holdGo = false; });
$('go').addEventListener('pointerdown', (e) => { holdGo = true; $('go').setPointerCapture(e.pointerId); e.preventDefault(); });
$('go').addEventListener('pointercancel', () => { holdGo = false; });
$('again').addEventListener('click', () => location.reload());
$('enter').addEventListener('click', () => {
  startSound(); $('intro').classList.add('off'); $('go').classList.add('on');
  st.phase = 'walk'; st.blocked = false;
  hint(matchMedia('(pointer: coarse)').matches ? '걷기를 누르고 있으면 걷습니다' : 'W 또는 ↑ 를 누르고 있으면 걷습니다');
  if (JUMP === 'reveal') { stations.forEach((s) => { s.done = true; s.dot.material.opacity = 0.3; }); st.u = 1; st.next = stations.length; st.blocked = true; place(0); reveal(); }
});

const V = new THREE.Vector3(), V2 = new THREE.Vector3();
function place(dt) {
  const p = curve.getPointAt(st.u), t = curve.getTangentAt(st.u);
  st.focusW += ((st.focus ? 0.9 : 0) - st.focusW) * Math.min(1, dt * 1.6 * FAST || 1);
  V.copy(t);
  if (st.focusW > 0.002 && (st.focus || st.lastFocus)) { const f = st.focus || st.lastFocus; V2.set(f.x - p.x, 0, f.z - p.z).normalize(); V.lerp(V2, st.focusW).normalize(); }
  if (st.focus) st.lastFocus = st.focus;
  st.dir.lerp(V, Math.min(1, (dt || 1) * 2.4)).normalize();
  const a = Math.atan2(st.dir.x, st.dir.z) + st.yaw, lookDown = st.focus ? -0.16 * st.focusW : 0;
  camera.position.set(p.x, EYE + Math.sin(st.bob) * 0.018, p.z);
  camera.up.set(0, 1, 0); camera.updateMatrixWorld();          // lookAt reads the world position
  camera.lookAt(p.x + Math.sin(a), camera.position.y + Math.tan(st.pitch + lookDown), p.z + Math.cos(a));
}

let prev = performance.now(), clock = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (nowMs - prev) / 1000); prev = nowMs; clock += dt;

  if (st.phase === 'walk') {
    const want = (AUTO || holdGo || keys.size > 0) && !st.blocked;
    if (want) {
      const target = st.next < stations.length ? stations[st.next].u : 1;
      st.u = Math.min(target, st.u + (2.9 * FAST * dt) / LENGTH); st.bob += dt * 7.2;
      if ($('cap').firstChild && st.u > (st.next ? stations[st.next - 1].u : 0) + 2.5 / LENGTH) { $('cap').innerHTML = ''; hint(''); }
      if (st.u >= target - 1e-6 && st.next < stations.length && !stations[st.next].done) arrive(stations[st.next], st.next);
    }
    if (!drag) { st.yaw *= 1 - Math.min(1, dt * (want ? 0.9 : 0)); }
    place(dt);
    trail.geometry.setDrawRange(0, Math.floor(st.u * TN) * 6);
    snowState.centre.copy(camera.position); snowState.centre.y = 6;
  } else if (st.phase === 'reveal' || st.phase === 'cover' || st.phase === 'done') {
    st.reveal = Math.min(1, st.reveal + (dt * FAST) / 10); const k = ease(st.reveal);
    camera.position.lerpVectors(top.from, top.pos, k); camera.quaternion.slerpQuaternions(top.qFrom, top.qTo, ease(Math.min(1, st.reveal * 1.25)));
    scene.fog.density = FOG_NEAR + (FOG_FAR - FOG_NEAR) * ease(Math.min(1, st.reveal * 1.6));
    if (st.phase !== 'reveal') st.cover = Math.min(1, st.cover + (dt * FAST) / 16);
    const keep = 1 - 0.93 * ease(st.cover);                                    // the snow takes the face back; an outline stays
    trailMat.opacity = (0.4 + 0.6 * k) * keep; trail.geometry.setDrawRange(0, TN * 6);
    stations.forEach((s) => { s.dot.material.opacity = (0.3 + 0.7 * k) * keep; s.dot.scale.setScalar(1 + 0.4 * k); });
    snowState.centre.set(top.pos.x, 9, top.pos.z); snowState.ext.set(30 + 70 * k, 14 + 8 * k, 30 + 70 * k);
    snowMat.size = 0.075 + 0.2 * k; snowMat.opacity = 0.85 - 0.25 * k + 0.4 * st.cover * 0.6;
  }

  // snow falls (and does not, in the silence)
  snowState.t += dt * snowState.rate;
  const e = snowState.ext, c = snowState.centre, T = snowState.t;
  for (let i = 0; i < SN; i++) {
    const j = i * 3, sp = 0.035 + (snowBase[j + 1] * 7 % 1) * 0.03;
    let x = snowBase[j] + T * 0.012 + Math.sin(T * 0.4 + i) * 0.004, y = snowBase[j + 1] - T * sp, z = snowBase[j + 2] + T * 0.006;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    snowPos[j] = c.x + (x - 0.5) * e.x; snowPos[j + 1] = y * e.y; snowPos[j + 2] = c.z + (z - 0.5) * e.z;
  }
  snowGeo.attributes.position.needsUpdate = true;

  const ringing = !snd.stopped && (snd.continuous || (clock % 3.4) < 1.3) && snd.mute > 0;
  for (const p of pulses) {
    if (p.kind === 'ring') { const v = ringing ? 0.55 + 0.45 * Math.sin(clock * 30) : 0.25; p.a.opacity = v; p.b.opacity = v * 0.6; }
    else if (p.kind === 'shake') p.g.rotation.z = ringing ? Math.sin(clock * 70) * 0.035 : 0;
  }
  for (const d of drifters) { d.o.position.y = d.y + Math.sin(snowState.t * 0.5 + d.ph) * 0.12; d.o.rotation.y += dt * 0.12 * snowState.rate; }
  tickSound(clock, st.u);
  renderer.render(scene, camera);
}

loadWalk().then((w) => { build(w); place(0); requestAnimationFrame(frame); if (AUTO) $('enter').click(); })
  .catch((e) => { console.error('[one-walk]', e); $('inLine1').textContent = '걸음을 불러오지 못했습니다.'; $('inLine2').textContent = String(e.message || e); });
</script>
</body>
</html>
